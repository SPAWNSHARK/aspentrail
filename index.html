      z-index: 10;

      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      color: #ffcc66;
      font-family: 'Courier New', monospace;
      font-size: 13px;

      font-size: 10px;
      letter-spacing: 2px;
      pointer-events: none;
      z-index: 10;

      </a-camera>
    </a-entity>

    <a-entity id="corridor" wf-corr></a-entity>
  </a-scene>

        x.fillStyle = 'rgba(255,210,150,0.06)'; x.fillRect(q[0], q[1], q[2] - q[0], 3);
        x.fillStyle = 'rgba(0,0,0,0.35)'; x.fillRect(q[0], q[3] - 3, q[2] - q[0], 3);

      for (var i = 0; i < 5000; i++) { x.fillStyle = r() < 0.5 ? 'rgba(0,0,0,0.06)' : 'rgba(255,220,180,0.025)'; x.fillRect(r() * W, r() * Hh, 1 + r() * 6, 1 + r() * 2); }

    function deckTexture() {             // polished dark deck plates, 1 m tiles
      var c = cv(512, 512), x = c.getContext('2d'), r = rng(23);
      x.fillStyle = '#1e1a17'; x.fillRect(0, 0, 512, 512);
      for (var i = 0; i < 70; i++) { x.fillStyle = 'rgba(' + (r() < 0.5 ? '0,0,0' : '255,230,200') + ',' + (0.015 + r() * 0.025) + ')'; x.fillRect(r() * 512, r() * 512, 40 + r() * 160, 20 + r() * 90); }

    function dotTexture() { var c = cv(64, 64), x = c.getContext('2d'), g = x.createRadialGradient(32, 32, 0, 32, 32, 32); g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.35, 'rgba(255,255,255,0.4)'); g.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = g; x.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c); }

      g.addColorStop(0, 'rgba(255,255,255,0.9)'); g.addColorStop(0.5, 'rgba(255,255,255,0.25)'); g.addColorStop(1, 'rgba(255,255,255,0)');
      x.fillStyle = g; x.fillRect(0, 0, 64, 256);

    // ───────────────────────────── geometry collector (world-aligned boxes, world-space UVs) ─────────────────────────────
    var TILE = { wall: [1.2, H], trim: [1, 1], dark: [1, 1], amber: [1, 1], lamp: [1, 1], wood: [1, 1] };
    var buckets = {};
    function bx(key, cx, cy, cz, w, h, d) {

    function buildWall(W, ops, lo, hi, Wk) {

        wb('trim', W, -0.02, 0.03, 0, 0.05, a0, a1);                       // kick plate under it
      }
      ops.forEach(function (o) {
        var a0 = o.c - o.w / 2, a1 = o.c + o.w / 2;

    // ── a recessed bookcase: walnut carcass, bronze lip, two columns × six shelves, amber strip under every shelf ──
    var books = [], bookCol = [], decor = [];
    var BOOK_COLS = ['#6b1e1e', '#7a2a1a', '#1f3350', '#24405e', '#2d4a2f', '#3c5a36', '#b08a3e', '#8c6a2a', '#e2d6bc', '#cbbd9a', '#1c1c1e', '#3a2a22', '#1f5a5a', '#5a2e4a', '#9a4a24', '#4a3a6a'];

      rx.fillStyle = '#b8823e'; for (var y = 0; y < 512; y += 32) { rx.beginPath(); rx.moveTo(26, y + 4); rx.lineTo(32, y + 16); rx.lineTo(26, y + 28); rx.lineTo(20, y + 16); rx.fill(); rx.beginPath(); rx.moveTo(230, y + 4); rx.lineTo(236, y + 16); rx.lineTo(230, y + 28); rx.lineTo(224, y + 16); rx.fill(); }
      rx.strokeStyle = 'rgba(190,130,62,0.6)'; rx.lineWidth = 2; rx.beginPath(); rx.moveTo(128, 150); rx.lineTo(166, 256); rx.lineTo(128, 362); rx.lineTo(90, 256); rx.closePath(); rx.stroke();      // a medallion per repeat
      rx.beginPath(); rx.moveTo(128, 196); rx.lineTo(148, 256); rx.lineTo(128, 316); rx.lineTo(108, 256); rx.closePath(); rx.fillStyle = 'rgba(70,24,18,0.9)'; rx.fill(); rx.stroke();
      rx.fillStyle = '#b8823e'; rx.beginPath(); rx.arc(128, 256, 5, 0, 7); rx.fill();
      var rt = mkTex(rc); rt.repeat.set(1, 9); rt.anisotropy = aniso;
      var runner = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 24.2, 1, 24), new THREE.MeshStandardMaterial({ map: rt, roughness: 0.95, metalness: 0, color: 0xb8a8a0 }));
      runner.rotation.x = -Math.PI / 2; runner.position.y = 0.006; root.add(runner);
      var rodM = new THREE.MeshStandardMaterial({ color: 0xc08a48, roughness: 0.3, metalness: 0.9 });
      [-0.78, 0.78].forEach(function (xx) { var rod = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 24.2, 8), rodM); rod.rotation.x = Math.PI / 2; rod.position.set(xx, 0.018, 0); root.add(rod); });
      var edge = rampTexture(false);
      [-1, 1].forEach(function (s) { var m = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 25), add(edge, 0xff9a40, 0.32)); m.rotation.x = -Math.PI / 2; m.rotation.z = s > 0 ? Math.PI : 0; m.position.set(s * (2.5 - 0.4), 0.003, 0); root.add(m); });
    }

    // ── glowing arch portals around the two end doors (amber: Bridge, teal: Library) ──
    function buildPortals(root, M) {
      DOORS.forEach(function (d) {
        if (!d.end) return;
        var s = WALLS[d.W].s, g = new THREE.Group(), R = 1.5, cy = 1.9; g.position.set(0, 0, s * 12.5); g.rotation.y = s > 0 ? Math.PI : 0; root.add(g);
        var glowM = new THREE.MeshBasicMaterial({ color: d.glow, fog: false, toneMapped: false });
        var arc = new THREE.Mesh(new THREE.TorusGeometry(R, 0.1, 10, 48, Math.PI), M.trim); arc.position.set(0, cy, 0.1); g.add(arc);
        var arcL = new THREE.Mesh(new THREE.TorusGeometry(R - 0.1, 0.022, 6, 48, Math.PI), glowM); arcL.position.set(0, cy, 0.17); g.add(arcL);
        [-1, 1].forEach(function (k) {
          var leg = new THREE.Mesh(new THREE.BoxGeometry(0.2, cy, 0.2), M.trim); leg.position.set(k * R, cy / 2, 0.1); g.add(leg);
          var ll = new THREE.Mesh(new THREE.BoxGeometry(0.04, cy - 0.1, 0.02), glowM); ll.position.set(k * (R - 0.1), cy / 2 + 0.05, 0.2); g.add(ll);
        });
        var halo = new THREE.Mesh(new THREE.RingGeometry(R - 0.35, R + 0.45, 48, 1, 0, Math.PI), new THREE.MeshBasicMaterial({ map: rampTexture(true), color: d.glow, transparent: true, opacity: 0.22, blending: THREE.AdditiveBlending, depthWrite: false, fog: false }));
        halo.position.set(0, cy, 0.02); g.add(halo);
      });
    }

    // one-off environment capture from eye height: gives the polished deck and bronze their reflections
    function bakeReflections(root, M) {
      try {
        var r = sc.renderer, pm = new THREE.PMREMGenerator(r);
        var camO = document.getElementById('cam').object3D, cv0 = camO.visible; camO.visible = false;
        var lampC = M.lamp.color.clone(), ambC = M.amber.color.clone(); M.lamp.color.multiplyScalar(0.25); M.amber.color.multiplyScalar(0.45);
        root.position.set(0, -1.6, -2); root.updateMatrixWorld(true);
        var rt = pm.fromScene(sc.object3D, 0.015, 0.1, 1000);
        root.position.set(0, 0, 0); root.updateMatrixWorld(true); camO.visible = cv0; M.lamp.color.copy(lampC); M.amber.color.copy(ambC);
        [state.floorMat, M.trim].concat(state.doorMats || []).forEach(function (m) { m.envMap = rt.texture; m.envMapIntensity = m === state.floorMat ? 1.1 : (m === M.trim ? 0.6 : 0.35); m.needsUpdate = true; });
        pm.dispose();
      } catch (e) { root.position.set(0, 0, 0); }
    }

    // ───────────────────────────── doors ─────────────────────────────
    var promptEl = document.getElementById('room-prompt'), promptT = 0;
    function say(msg, col) { promptEl.textContent = msg; promptEl.style.color = col || '#ffcc66'; promptEl.style.opacity = '1'; clearTimeout(promptT); promptT = setTimeout(function () { promptEl.style.opacity = '0'; }, 1800); }

    function buildDoors(root) {
      var from = fromRoom(), PT = window.WAYFARER.door.PORTALS;
      state.doorMats = [];
      DOORS.forEach(function (d) {
        var P = PT[d.id], W = WALLS[d.W];
        var D = window.WAYFARER.door.create({ sc: sc, parent: root, frame: P.corr, name: d.one, tint: d.tint, depth: 0.1, other: P.room, space: P.space,
          img: 'images/portals/room-' + d.id + '.jpg', autoPass: false, onPass: function () { goto(d); }, startOpen: from === d.id, holdMs: from === d.id ? 900 : 8000, say: say });
        D.d = d; D.W = W; D.c = d.c; D.s = W.s;
        D.mats.forEach(function (m) { if (state.doorMats.indexOf(m) < 0) state.doorMats.push(m); });
        state.doors.push(D);
      });
      window.WAYFARER.corridorDoors = state.doors;
    }

    // ───────────────────────────── stars (seen through the skylight) ─────────────────────────────
    // ── light speed overhead (shared hyperspace.js): the ship flies toward the Bridge (+Z), streaks rush aft ──
    function buildSky(root) { state.hyper = window.WAYFARER.hyperspace(root, { fwd: 1, arc: [-70, 70], count: MOB ? 900 : 1500, minR: 16, maxR: 190, tunnel: 0.6, width: 0.55, bright: 0.9,
      spill: [{ p: [0, 3.3, -7], i: 1.6, d: 10 }, { p: [0, 3.3, 0], i: 1.6, d: 10 }, { p: [0, 3.3, 7], i: 1.6, d: 10 }] }); }   // blue glare on the deck/walls

    // ───────────────────────────── per-frame: door animation, collision, entry ─────────────────────────────
    var navigating = false, fade = document.getElementById('wf-fade');
    function goto(d) { if (navigating) return; navigating = true; fade.style.transition = 'opacity .25s'; fade.style.opacity = '1'; setTimeout(function () { window.location.href = d.page; }, 260); }
    AFRAME.registerComponent('wf-corr', {
      init: function () { this.cam = document.getElementById('cam'); this.t0 = 0; var self = this; if (sc.hasLoaded) this.start(); else sc.addEventListener('loaded', function () { self.start(); }); },
      start: function () { build(); applySpawn(); },
      tick: function (t, dt) {
        if (!state.doors.length) return;
        var s = Math.min(dt, 50) / 1000, p = this.cam.object3D.position, now = performance.now();
        // blink nav lights
        state.hullLights.forEach(function (l, i) { l.visible = ((t / 1000 + i * 0.7) % 2) < 0.2; });
        // light shafts fade out as you walk into them (seen from inside they'd be a flat smear)
        if (state.hyper) state.hyper.update(t / 1000);
        if (state.shafts) state.shafts.forEach(function (m) { var d = Math.abs(p.z - m.position.z); m.material.opacity = 0.075 * Math.max(0, Math.min(1, (d - 1.2) / 2.5)); m.visible = m.material.opacity > 0.001; });
        // doors (shared door.js: animation, auto-close, portal); the corridor keeps its own walls and doorway lanes
        var lim = { xm: 2.15, xp: 2.15, zm: 12.15, zp: 12.15 };
        state.doors.forEach(function (D) {
          D.update(dt, p);
          var W = D.W, along = W.axis === 'x' ? p.z : p.x, depthPos = W.axis === 'x' ? W.s * p.x : W.s * p.z;     // depthPos: how far into the wall plane (2.5 = at the face)
          var inLane = Math.abs(along - D.c) < 0.6, open = D.p > 0.92, base = W.axis === 'x' ? 2.15 : 12.15;
          if (open && (inLane || depthPos > base)) {                    // an open doorway: let the player into the niche, kept inside the opening's width
            if (W.axis === 'x') { if (W.s > 0) lim.xp = 2.95; else lim.xm = 2.95; } else { if (W.s > 0) lim.zp = 12.95; else lim.zm = 12.95; }
          }
        });
        // walls: clamp, then keep the player inside an open doorway's width
        p.x = Math.max(-lim.xm, Math.min(lim.xp, p.x)); p.z = Math.max(-lim.zm, Math.min(lim.zp, p.z));
        state.doors.forEach(function (D) {
          var W = D.W; if (D.p <= 0.92) return;
          var depthPos = W.axis === 'x' ? W.s * p.x : W.s * p.z, base = W.axis === 'x' ? 2.15 : 12.15;
          if (depthPos > base + 0.01) {
            if (W.axis === 'x') p.z = Math.max(D.c - 0.6, Math.min(D.c + 0.6, p.z)); else p.x = Math.max(D.c - 0.6, Math.min(D.c + 0.6, p.x));
            if (depthPos > base + 0.4) goto(D.d);                       // stepped through (before reaching the portal surface)
          }
        });
      }
    });

    // ───────────────────────────── spawn: one step outside the doorway you came out of ─────────────────────────────
    var wrap = function (a) { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };
    function fromRoom() {
      try {
        var nav = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
        if (nav && nav.type !== 'navigate') return null;                // reload / back-forward: don't re-place the player
        var ref = document.referrer || ''; if (!ref || ref.indexOf(location.host) < 0) return null;
        var m = ref.split('?')[0].split('#')[0].split('/').pop();
        var hit = DOORS.filter(function (d) { return d.page === m; })[0]; return hit ? hit.id : null;
      } catch (e) { return null; }
    }
    function applySpawn() {
      var from = fromRoom(), sp = (from && SPAWN[from]) || DEFAULT_SPAWN, cam = document.getElementById('cam'), want = sp.yaw * Math.PI / 180;
      var player = document.getElementById('player'); player.object3D.rotation.set(0, 0, 0);          // rig heading (kept at 0: the camera carries the heading, so movement stays aligned)
      cam.setAttribute('position', { x: sp.x, y: 1.6, z: sp.z }); cam.object3D.position.set(sp.x, 1.6, sp.z);
      var lc = cam.components['look-controls'], dir = new THREE.Vector3(), frames = 0, settled = 0, t0 = performance.now(), done = false;
      function align() {
        if (!lc || !lc.yawObject) return 1;
        lc.pitchObject.rotation.x = 0;
        cam.object3D.updateMatrixWorld(true); cam.object3D.getWorldDirection(dir);
        var cur = Math.atan2(dir.x, dir.z), diff = wrap(want - cur);          // actual heading of the view (gyro included) vs wanted
        if (Math.abs(diff) > 0.005) lc.yawObject.rotation.y += diff;
        return Math.abs(diff);
      }
      function step() {
        var e = 0; if (frames % 3 === 0) { e = align(); settled = e < 0.02 ? settled + 1 : 0; } frames++;
        var late = performance.now() - t0;
        if (!done && (settled >= 3 && late > 250 || late > 1500)) { done = true; fade.style.transition = 'opacity .35s'; fade.style.opacity = '0'; }
        if (late < 2500) requestAnimationFrame(step);
      }
      window.addEventListener('deviceorientation', function once() { window.removeEventListener('deviceorientation', once); var n = 0; (function k() { if (n % 3 === 0) align(); if (++n < 30) requestAnimationFrame(k); })(); });
      step();
    }
  }());
  </script>
