<!DOCTYPE html>
<html lang="en">
<head>

  <title>SS Wayfarer</title>

  <meta name="apple-mobile-web-app-title" content="SS Wayfarer">
  <link rel="apple-touch-icon" sizes="180x180" href="/aspentrail/icons/apple-touch-icon.png">
  <link rel="icon" href="/aspentrail/icons/favicon.ico">
  <meta property="og:type" content="website">
  <meta property="og:title" content="SS Wayfarer">
  <meta property="og:url" content="https://spawnshark.github.io/aspentrail/">
  <meta property="og:image" content="https://spawnshark.github.io/aspentrail/images/wayfarer-share.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="The bronze SS Wayfarer in orbit above a sunlit planet.">
  <meta name="twitter:card" content="summary_large_image">
  <script src="textures.js"></script>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="mobile.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; }

    #hud {
      position: fixed;
      top: 0; left: 0; right: 0;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #cc8833;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      pointer-events: none;
      text-shadow: 0 0 8px #ff6600;
      background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
      z-index: 10;
    }

    #room-prompt {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      color: #ffcc66;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      letter-spacing: 4px;
      text-transform: uppercase;
      pointer-events: none;
      text-shadow: 0 0 12px #ff8833;
      opacity: 0;
      transition: opacity 0.3s ease;
      white-space: nowrap;
      z-index: 10;
    }

    #controls-hint {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: #554433;
      font-family: 'Courier New', monospace;
      font-size: 10px;
      letter-spacing: 2px;
      pointer-events: none;
      z-index: 10;
    }
    #wf-fade { position: fixed; inset: 0; background: #000; opacity: 1; z-index: 30; pointer-events: none; }
  </style>
</head>
<body>

  <div id="hud">
    <span>SS WAYFARER</span>
    <span>HERITAGE CLASS · DEEP CORE SERIES</span>
    <span>DECK 01</span>
  </div>

  <div id="room-prompt"></div>
  <div id="controls-hint">WASD / DRAG TO LOOK · CLICK OR TAP THE OPEN BUTTON BESIDE A DOOR · VR ICON FOR CARDBOARD</div>
  <div id="wf-fade"></div>

  <a-scene wayfarer-mobile
    fog="type: exponential; color: #0c0a08; density: 0.010"
    background="color: #02030a"
    vr-mode-ui="enabled: true"
    renderer="antialias: true; toneMapping: ACESFilmic; exposure: 1.05">

    <a-entity id="player" position="0 0 0">
      <a-camera id="cam"
        wasd-controls="acceleration: 22; fly: false"
        look-controls="pointerLockEnabled: true; touchEnabled: true"
        position="0 1.6 9">
        <a-cursor color="#ffcc66" opacity="0.6" fuse="true" fuse-timeout="1500"
          raycaster="objects: .interactive"></a-cursor>
      </a-camera>
    </a-entity>

    <a-entity id="corridor" wf-corr></a-entity>
  </a-scene>

    var wrap = function (a) { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };

      step();
    }
  }());
