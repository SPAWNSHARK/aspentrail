<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SS Wayfarer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-title" content="SS Wayfarer">
  <link rel="apple-touch-icon" sizes="180x180" href="/aspentrail/icons/apple-touch-icon.png">
  <link rel="icon" href="/aspentrail/icons/favicon.ico">
  <meta property="og:type" content="website">
  <meta property="og:title" content="SS Wayfarer">
  <meta property="og:url" content="https://spawnshark.github.io/aspentrail/">
  <meta property="og:image" content="https://spawnshark.github.io/aspentrail/images/wayfarer-share.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="The bronze SS Wayfarer in orbit above a sunlit planet.">
  <meta name="twitter:card" content="summary_large_image">
  <script src="textures.js"></script>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="mobile.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; }

    #hud {
      position: fixed;
      top: 0; left: 0; right: 0;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #cc8833;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      pointer-events: none;
      text-shadow: 0 0 8px #ff6600;
      background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
      z-index: 10;
    }

    #room-prompt {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      color: #ffcc66;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      letter-spacing: 4px;
      text-transform: uppercase;
      pointer-events: none;
      text-shadow: 0 0 12px #ff8833;
      opacity: 0;
      transition: opacity 0.3s ease;
      white-space: nowrap;
      z-index: 10;
    }

    #controls-hint {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: #554433;
      font-family: 'Courier New', monospace;
      font-size: 10px;
      letter-spacing: 2px;
      pointer-events: none;
      z-index: 10;
    }
    #wf-fade { position: fixed; inset: 0; background: #000; opacity: 1; z-index: 30; pointer-events: none; }
  </style>
</head>
<body>

  <div id="hud">
    <span>SS WAYFARER</span>
    <span>HERITAGE CLASS · DEEP CORE SERIES</span>
    <span>DECK 01</span>
  </div>

  <div id="room-prompt"></div>
  <div id="controls-hint">WASD / DRAG TO LOOK · CLICK OR TAP THE OPEN BUTTON BESIDE A DOOR · VR ICON FOR CARDBOARD</div>
  <div id="wf-fade"></div>

  <a-scene wayfarer-mobile light="defaultLightsEnabled: false"
    fog="type: exponential; color: #0c0a08; density: 0.010"
    background="color: #02030a"
    vr-mode-ui="enabled: true"
    renderer="antialias: true; toneMapping: ACESFilmic; exposure: 1.05">

    <a-entity id="player" position="0 0 0">
      <a-camera id="cam"
        wasd-controls="acceleration: 22; fly: false"
        look-controls="pointerLockEnabled: true; touchEnabled: true"
        position="0 1.6 9">
        <a-cursor color="#ffcc66" opacity="0.6" fuse="true" fuse-timeout="1500"
          raycaster="objects: .interactive"></a-cursor>
      </a-camera>
    </a-entity>

    <a-entity id="corridor" wf-corr></a-entity>
  </a-scene>

    // ───────────────────────────── textures ─────────────────────────────

    function coveGlowTexture() {        // emissive wash: amber from the hidden strip at the wall top, a softer warm edge at the skylight

    function plate(lines, w, h, sub) {     // bronze name plate, engraved lettering

    }
    function buttonFace(state) {           // state: open | close | press

      g.addColorStop(0, hot ? '#fff6d8' : '#ffd37a'); g.addColorStop(0.6, hot ? '#ffcf70' : '#f59a2a'); g.addColorStop(1, hot ? '#f0a040' : '#b4600e');
      x.fillStyle = g; x.beginPath(); x.arc(128, 128, 108, 0, 6.3); x.fill();
      x.strokeStyle = 'rgba(70,30,0,0.7)'; x.lineWidth = 5; x.beginPath(); x.arc(128, 128, 108, 0, 6.3); x.stroke();
      x.fillStyle = '#2a1500'; x.textAlign = 'center'; x.textBaseline = 'middle';
      x.font = '800 58px "Helvetica Neue", Arial, sans-serif'; if (x.letterSpacing !== undefined) x.letterSpacing = '3px';
      x.fillText(state === 'close' ? 'CLOSE' : 'OPEN', 128, 112);
      x.fillStyle = '#2a1500';                               // chevrons: point outward to open, inward to close
      var dir = state === 'close' ? -1 : 1;
      [-1, 1].forEach(function (sd) { var cx = 128 + sd * 46, tip = cx + sd * 14 * dir; x.beginPath(); x.moveTo(cx - sd * 14 * dir, 150); x.lineTo(tip, 170); x.lineTo(cx - sd * 14 * dir, 190); x.closePath(); x.fill(); });
      var t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
    }
    function dotTexture() { var c = cv(64, 64), x = c.getContext('2d'), g = x.createRadialGradient(32, 32, 0, 32, 32, 32); g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.35, 'rgba(255,255,255,0.4)'); g.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = g; x.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c); }

      else { g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.25, 'rgba(255,255,255,0.35)'); g.addColorStop(1, 'rgba(255,255,255,0)'); }
      x.fillStyle = g; x.fillRect(0, 0, 128, 4); return new THREE.CanvasTexture(c);

    // ───────────────────────────── geometry collector (world-aligned boxes, world-space UVs) ─────────────────────────────
    var TILE = { wall: [1.2, H], trim: [1, 1], dark: [1, 1], amber: [1, 1], lamp: [1, 1] };
    var buckets = {};

    function buildWall(W, ops, lo, hi, Wk) {

        pane([[i0 + sd * 0.02, 1.62], [o0 - sd * 0.06, 1.62], [hx + sd * 0.02, HUB_Y + 0.12], [i0 + sd * 0.02, HUB_Y + 0.42]]);  // upper

        nm.position.set(0, (DOOR_H + FR_TOP) / 2, 0.16); g.add(nm);

        var dp = doorPaint(d.tint || 0xffa040), leafM = new THREE.MeshStandardMaterial({ map: dp.map, bumpMap: dp.bump, bumpScale: 3, roughnessMap: dp.rough, roughness: 1, metalness: 0.55, color: 0xf0e0cc });

    // ───────────────────────────── stars (seen through the skylight) ─────────────────────────────
    function buildSky(root) {
      var PR = Math.min(2, window.devicePixelRatio || 1), R = 900, r = rng(77), dot = dotTexture();

      starSet(MOB ? 200 : 380, 1.6, function () { var b = 0.6 + r() * 0.3; return [b * 0.9, b * 0.94, b]; }, 0.95);
      starSet(MOB ? 14 : 24, 3.0, function () { return [0.72, 0.84, 1]; }, 1); starSet(MOB ? 9 : 16, 2.8, function () { return [1, 0.8, 0.55]; }, 1);
    }

    // ───────────────────────────── per-frame: door animation, collision, entry ─────────────────────────────
    var navigating = false, fade = document.getElementById('wf-fade');
    function goto(d) { if (navigating) return; navigating = true; fade.style.transition = 'opacity .25s'; fade.style.opacity = '1'; setTimeout(function () { window.location.href = d.page; }, 260); }
    AFRAME.registerComponent('wf-corr', {
      init: function () { this.cam = document.getElementById('cam'); this.t0 = 0; var self = this; if (sc.hasLoaded) this.start(); else sc.addEventListener('loaded', function () { self.start(); }); },

    // ───────────────────────────── spawn: one step outside the doorway you came out of ─────────────────────────────
