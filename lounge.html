  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; }
    #hud {
      position: fixed; top: 0; left: 0; right: 0;
      padding: 14px 20px;
      display: flex; justify-content: space-between; align-items: center;
      color: #cc8833;
      font-family: 'Courier New', monospace; font-size: 11px;
      letter-spacing: 3px; text-transform: uppercase;
      pointer-events: none;
      text-shadow: 0 0 8px #ff6600;
      background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
      z-index: 10;
    }
    #tv-panel {
      position: fixed; inset: 0;
      background: #000;
      display: none; flex-direction: column;
      z-index: 100;
    }
    #tv-panel.open { display: flex; }
    #tv-chrome {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px;
      background: #0a0a0a;
      border-bottom: 1px solid #2a2a2a;
      flex-shrink: 0;
    }
    #tv-chrome button {
      background: #111; color: #cc8833;
      border: 1px solid #333; border-radius: 3px;
      padding: 5px 12px;
      font-family: 'Courier New', monospace; font-size: 11px;
      letter-spacing: 1px; cursor: pointer; white-space: nowrap;
    }
    #tv-chrome button:hover { background: #222; border-color: #ff6600; }
    #tv-url {
      flex: 1; min-width: 0;
      background: #050505; color: #ffcc66;
      border: 1px solid #333; border-radius: 3px;
      padding: 5px 10px;
      font-family: 'Courier New', monospace; font-size: 12px; outline: none;
    }
    #tv-url:focus { border-color: #ff6600; }
    #tv-note {
      color: #444; font-family: 'Courier New', monospace; font-size: 10px;
      letter-spacing: 1px; padding: 4px 12px;
      background: #050505; border-bottom: 1px solid #1a1a1a; flex-shrink: 0;
    }
    #tv-frame { flex: 1; border: none; background: #0a0a0a; }
  </style>

<body>

<div id="hud">
  <span>SS WAYFARER</span>
  <span>CREW LOUNGE</span>
  <span>DECK 2 — STARBOARD FWD</span>
</div>

<div id="tv-panel">
  <div id="tv-chrome">
    <button onclick="tvClose()">✕ CLOSE</button>
    <input id="tv-url" type="text" placeholder="https://" value="https://www.wikipedia.org" />
    <button onclick="tvGo()">GO</button>
    <button onclick="tvNewTab()">↗ NEW TAB</button>
  </div>
  <div id="tv-note">Some sites block embedding — use ↗ NEW TAB as fallback</div>
  <iframe id="tv-frame" src="about:blank"
    sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox">
  </iframe>
</div>

<a-scene device-orientation-permission-ui="enabled: false" wayfarer-mobile="radius: 8.3" light="defaultLightsEnabled: false"
  vr-mode-ui="enabled: true"
  renderer="antialias: true; toneMapping: ACESFilmic; exposure: 1.05"
  background="color: #060300">

  <!-- ===================== ROOM SHELL ===================== -->
  <!-- walls: metal panels (amber-tinted) applied via JS -->
  <a-cylinder id="lounge-walls" radius="9" height="5.5" open-ended="true" position="0 2.75 0" theta-start="208.6" theta-length="302.8" segments-radial="96" segments-height="14"
    material="side: back; color: #130a03; roughness: 0.92; metalness: 0.08">
  </a-cylinder>
  <!-- floor: grating applied via JS -->
  <a-cylinder id="lounge-floor" radius="9.1" height="0.1" position="0 0.05 0"
    material="color: #180d03; roughness: 0.95">
  </a-cylinder>
  <a-cylinder radius="4.6" height="0.02" position="0 0.12 -2.7"
    material="color: #2a1409; roughness: 0.99">
  </a-cylinder>
  <a-cylinder id="lounge-ceil" radius="9.1" height="0.1" position="0 5.55 0"
    material="color: #0c0602; roughness: 0.95">
  </a-cylinder>
  <a-torus radius="7.4" radius-tubular="0.09" position="0 5.38 0" rotation="90 0 0" segments-tubular="96"
    material="color: #b8681a; emissive: #ff8a20; emissiveIntensity: 0.85; shader: standard">
  </a-torus>

  <!-- ===================== SPACE WINDOW ===================== -->
  <!-- Deep outer frame -->
  <!-- (the wall has a gap here; buildShell() fills it with a panel that has a round window cut in it) -->
  <!-- Frame bolts -->
  <!-- Viewport space scene (texture applied via JS) -->
  <!-- Subtle glass sheen overlay -->
  <!-- Distant nebula wash behind the glass -->

  <!-- ===================== TV (brass ring, screen = browser) ===================== -->
  <a-box position="0 0.55 -7.6" width="5.6" height="1.1" depth="0.6"
    material="color: #2a1a0e; roughness: 0.45; metalness: 0.7">
  </a-box>
  <!-- soft amber back-glow, slim bronze frame, bezel, screen -->
  <a-box position="0 2.7 -7.7" width="5.75" height="3.3" depth="0.02"
    material="color: #ff9a30; emissive: #ff9a30; emissiveIntensity: 0.7; shader: flat; opacity: 0.55; transparent: true">
  </a-box>
  <a-box position="0 2.7 -7.6" width="5.3" height="3.03" depth="0.1"
    material="color: #0a0a0c; roughness: 0.35; metalness: 0.6">
  </a-box>
  <a-box position="0 4.245 -7.56" width="5.44" height="0.06" depth="0.14" material="color: #9a7038; roughness: 0.4; metalness: 0.85; emissive: #2a1806; emissiveIntensity: 0.4"></a-box>
  <a-box position="0 1.155 -7.56" width="5.44" height="0.06" depth="0.14" material="color: #9a7038; roughness: 0.4; metalness: 0.85; emissive: #2a1806; emissiveIntensity: 0.4"></a-box>
  <a-box position="-2.68 2.7 -7.56" width="0.06" height="3.15" depth="0.14" material="color: #9a7038; roughness: 0.4; metalness: 0.85; emissive: #2a1806; emissiveIntensity: 0.4"></a-box>
  <a-box position="2.68 2.7 -7.56" width="0.06" height="3.15" depth="0.14" material="color: #9a7038; roughness: 0.4; metalness: 0.85; emissive: #2a1806; emissiveIntensity: 0.4"></a-box>
  <a-plane id="tv-screen" class="clickable"
    position="0 2.7 -7.53" width="5.2" height="2.93"
    material="color: #0b1c33; emissive: #1d4d86; emissiveIntensity: 0.9; roughness: 0">
  </a-plane>
  <a-text value="CREW TERMINAL" align="center" position="0 3.75 -7.51" color="#7fb4ff" width="6" letter-spacing="4"></a-text>
  <a-box position="0 2.7 -7.52" width="4.2" height="0.03" depth="0.01"
    material="color: #2a6ad0; emissive: #4a8aff; emissiveIntensity: 1.6">
  </a-box>
  <a-text value="[ TAP SCREEN TO BROWSE ]" align="center" position="0 1.95 -7.51" color="#9fc4ff" width="5" letter-spacing="4"></a-text>
  <a-light id="win-spill" type="point" position="0 2.9 -6.4" color="#8ab4ff" intensity="1.2" distance="11" decay="1.6"></a-light>
  <!-- soft warm fill over seating + rug (independent of the TV, so a dark frame still reads) -->
  <a-light id="fill-seat" type="point" position="0 3.4 1.2" color="#ffc890" intensity="1.1" distance="11" decay="1.2"></a-light>
  <a-light id="fill-rug" type="point" position="0.5 3.2 -3.8" color="#ffc080" intensity="1.0" distance="10" decay="1.2"></a-light>
  <a-light id="fill-cats" type="point" position="-0.5 1.8 -5.2" color="#ffd8b0" intensity="0.6" distance="6" decay="1.5"></a-light>

  <!-- everything else is built in script (sofa, rug, shelves, cats, lamps, plaques) -->
  <a-entity id="lounge-set"></a-entity>

  <!-- ===================== EXIT DOOR ===================== -->
  <!-- exit: the shared ship door (door.js → WAYFARER.door.roomExit) -->
  <a-box position="0 0.02 6.2" width="0.18" height="0.04" depth="4.5"
    material="color: #441a00; emissive: #ff3300; emissiveIntensity: 0.9">
  </a-box>

  <!-- ===================== LIGHTING ===================== -->
  <a-light type="ambient" color="#d9a070" intensity="0.55"></a-light>
  <a-light type="hemisphere" color="#ffc890" groundColor="#6a3a14" intensity="0.8"></a-light>
  <a-light type="point" position="0 4.8 0" color="#ffa648" intensity="1.5" distance="14" decay="2"></a-light>
  <a-light type="point" position="0 3.5 2.0" color="#ff7722" intensity="1.0" distance="8" decay="2"></a-light>

  <!-- ===================== PLAYER ===================== -->
  <a-entity id="player"
    position="0 0 7"
>
    <a-camera id="cam" fov="80" near="0.05" wasd-controls="acceleration: 22; fly: false" look-controls="pointerLockEnabled: true; touchEnabled: true; magicWindowTrackingEnabled: false">
      <a-cursor
        color="#cc8833"
        fuse="true"
        fuse-timeout="1500"
        raycaster="objects: .clickable"
        animation__click="property: scale; startEvents: click; easing: easeInCubic; dur: 150; from: 1.2 1.2 1.2; to: 1 1 1">
      </a-cursor>
    </a-camera>
  </a-entity>

  <!-- cat furniture (models/props, recoloured to the ship palette by props.js) -->
  <a-entity id="old-cat-tree" wf-prop="src: cat_tree; height: 1.5" position="6.4 0.1 3.4" rotation="0 -118 0"></a-entity>
  <a-entity id="old-cat-bed" wf-prop="src: cat_bed; height: 0.28" position="-6.3 0.1 3.1" rotation="0 116 0"></a-entity>
  <a-entity id="old-cat-food" wf-prop="src: cat_feeding_station; height: 0.16" position="5.0 0.1 5.8" rotation="0 -140 0"></a-entity>
</a-scene>

<script>

  // ===================== LOUNGE BUILD =====================
  function buildLounge() {
    var scene = document.querySelector('a-scene'), root = document.getElementById('lounge-set'), MOB = window.WAYFARER && window.WAYFARER.mobile;
    function E(tag, attrs, parent) {
      var e = document.createElement(tag);
      Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
      (parent || root).appendChild(e); return e;
    }
    function rnd(a, b) { return a + Math.random() * (b - a); }
    var BRASS = 'color: #b88a46; roughness: 0.3; metalness: 0.95; emissive: #3a2208; emissiveIntensity: 0.45';
    // procedural leather grain (grey, tinted by material colour)
    var gc = document.createElement('canvas'); gc.width = gc.height = 256; var gx = gc.getContext('2d'), gi;
    gx.fillStyle = '#d4d4d4'; gx.fillRect(0, 0, 256, 256);
    for (gi = 0; gi < 9000; gi++) { var gv = 120 + Math.random() * 110 | 0; gx.fillStyle = 'rgba(' + gv + ',' + gv + ',' + gv + ',0.55)'; gx.fillRect(Math.random() * 256, Math.random() * 256, 1 + Math.random() * 2, 1 + Math.random() * 2); }
    gx.lineWidth = 1;
    for (gi = 0; gi < 140; gi++) { var wx = Math.random() * 256, wy = Math.random() * 256, wl = 10 + Math.random() * 28, wa = Math.random() * 6.28;
      gx.strokeStyle = 'rgba(40,40,40,' + (0.12 + Math.random() * 0.2) + ')'; gx.beginPath(); gx.moveTo(wx, wy); gx.quadraticCurveTo(wx + Math.cos(wa) * wl * 0.5 + 4, wy + Math.sin(wa) * wl * 0.5 - 4, wx + Math.cos(wa) * wl, wy + Math.sin(wa) * wl); gx.stroke(); }
    var GRAIN = gc.toDataURL();
    var LEATHER = 'src: url(' + GRAIN + '); repeat: 2 2; color: #2c1608; roughness: 0.55; metalness: 0.05';
    var LEATHER2 = 'src: url(' + GRAIN + '); repeat: 2 2; color: #6a3a1a; roughness: 0.42; metalness: 0.05';
    var WOOD = 'color: #3a2214; roughness: 0.5; metalness: 0.25';
    function wallAt(deg, r, y, extra) {                         // place on the curved wall, facing the room centre
      var x = r * Math.sin(deg * Math.PI / 180), z = -r * Math.cos(deg * Math.PI / 180);
      return Object.assign({ position: x.toFixed(3) + ' ' + y + ' ' + z.toFixed(3), rotation: '0 ' + (-deg) + ' 0' }, extra || {});
    }

    // seating group sits 2 m closer to the TV so the screen reads comfortably from the sofa
    var seating = E('a-entity', { position: '0 0 -2' }), wallRoot = root; root = seating;
    // ---- curved leather sofa around the coffee table ----
    var C = { x: 0, z: 0.9 }, step = 20, th;
    for (th = -80; th <= 80; th += step) {
      var rad = th * Math.PI / 180, g = E('a-entity', { position: (C.x + 2.3 * Math.sin(rad)).toFixed(3) + ' 0 ' + (C.z + 2.3 * Math.cos(rad)).toFixed(3), rotation: '0 ' + (th + 180) + ' 0' });
      E('a-box', { position: '0 0.28 0', width: 0.97, height: 0.45, depth: 0.9, material: LEATHER }, g);
      E('a-box', { position: '0 0.6 0.02', width: 0.75, height: 0.16, depth: 0.74, material: LEATHER2 }, g);
      E('a-cylinder', { position: '0 0.58 0.4', rotation: '0 0 90', radius: 0.09, height: 0.75, material: LEATHER2, 'segments-radial': 8 }, g);
      E('a-box', { position: '0 0.72 -0.5', width: 0.79, height: 0.95, depth: 0.34, material: LEATHER2 }, g);
      E('a-cylinder', { position: '0 1.2 -0.5', rotation: '0 0 90', radius: 0.17, height: 0.79, material: LEATHER2, 'segments-radial': 10 }, g);
    }
    [-1, 1].forEach(function (sd) {                              // rolled arms
      var rad = sd * 91 * Math.PI / 180, g = E('a-entity', { position: (C.x + 2.3 * Math.sin(rad)).toFixed(3) + ' 0 ' + (C.z + 2.3 * Math.cos(rad)).toFixed(3), rotation: '0 ' + (sd * 91 + 180) + ' 0' });
      E('a-box', { position: '0 0.42 0', width: 0.3, height: 0.8, depth: 1.25, material: LEATHER }, g);
      E('a-cylinder', { position: '0 0.84 0', rotation: '90 0 0', radius: 0.17, height: 1.25, material: LEATHER2, 'segments-radial': 10 }, g);
    });
    // cushions + throw blanket
    [[-60, '#c9a46a'], [-20, '#7a3a24'], [40, '#d6b98a'], [62, '#5a3a2a']].forEach(function (c) {
      var rad = c[0] * Math.PI / 180, g = E('a-entity', { position: (C.x + 2.5 * Math.sin(rad)).toFixed(3) + ' 0.95 ' + (C.z + 2.5 * Math.cos(rad)).toFixed(3), rotation: '-12 ' + (c[0] + 180 + rnd(-8, 8)) + ' 0' });
      E('a-box', { width: 0.46, height: 0.42, depth: 0.14, material: 'color: ' + c[1] + '; roughness: 0.95' }, g);
    });
    var tr = -66 * Math.PI / 180;
    E('a-box', { position: (C.x + 2.55 * Math.sin(tr)).toFixed(3) + ' 1.0 ' + (C.z + 2.55 * Math.cos(tr)).toFixed(3), rotation: '0 ' + (-66 + 180) + ' 18', width: 0.9, height: 0.05, depth: 1.1,
      material: 'color: #b89a74; roughness: 1' });

    // ---- brass coffee table ----
    E('a-cylinder', { position: C.x + ' 0.46 ' + C.z, radius: 0.85, height: 0.05, material: 'color: #9a7038; roughness: 0.55; metalness: 0.7; emissive: #2a1806; emissiveIntensity: 0.4', 'segments-radial': 36 });
    E('a-cylinder', { position: C.x + ' 0.22 ' + C.z, radius: 0.13, height: 0.4, material: BRASS });
    E('a-cylinder', { position: C.x + ' 0.04 ' + C.z, radius: 0.5, height: 0.06, material: BRASS, 'segments-radial': 24 });
    E('a-cylinder', { position: '-0.35 0.57 ' + (C.z - 0.05), radius: 0.24, height: 0.14, material: BRASS });
    [[0, 0.7, 0, 0.2], [0.12, 0.72, 0.08, 0.15], [-0.12, 0.7, -0.05, 0.16]].forEach(function (p) {
      E('a-sphere', { position: (-0.35 + p[0]) + ' ' + p[1] + ' ' + (C.z - 0.05 + p[2]), radius: p[3], scale: '1 0.7 1', material: 'color: #2f6b3a; roughness: 0.9', 'segments-width': 8, 'segments-height': 6 });
    });
    E('a-cylinder', { position: '0.3 0.54 ' + (C.z + 0.25), radius: 0.05, height: 0.1, material: 'color: #e8dcc8; roughness: 0.6' });
    E('a-box', { position: '0.15 0.51 ' + (C.z - 0.25), width: 0.4, height: 0.05, depth: 0.28, rotation: '0 20 0', material: 'color: #6b3a2a; roughness: 0.8' });
    E('a-box', { position: '0.17 0.56 ' + (C.z - 0.25), width: 0.36, height: 0.05, depth: 0.26, rotation: '0 8 0', material: 'color: #3a4a5a; roughness: 0.8' });

    // ---- woven rug ----
    var cv = document.createElement('canvas'); cv.width = 1024; cv.height = 720; var x = cv.getContext('2d'), i;
    x.fillStyle = '#6e3320'; x.fillRect(0, 0, 1024, 720);
    var pal = ['#6e3320', '#8a4a2a', '#a8723e', '#3a4c52', '#5a2a1c'];
    for (i = 0; i < 720; i += 6) { x.fillStyle = pal[(i / 6 * 7 | 0) % pal.length]; x.globalAlpha = 0.5; x.fillRect(0, i, 1024, 6); }
    x.globalAlpha = 1;
    [[56, '#2e4a50', 14], [104, '#c9a46a', 8], [140, '#8a3a20', 14]].forEach(function (b) { x.strokeStyle = b[1]; x.lineWidth = b[2]; x.strokeRect(b[0], b[0] * 0.7, 1024 - b[0] * 2, 720 - b[0] * 1.4); });
    x.strokeStyle = 'rgba(201,164,106,0.55)'; x.lineWidth = 6;
    for (i = 0; i < 5; i++) { var dx = 512 - 280 + i * 140; x.beginPath(); x.moveTo(dx, 360 - 110); x.lineTo(dx + 70, 360); x.lineTo(dx, 360 + 110); x.lineTo(dx - 70, 360); x.closePath(); x.stroke(); }
    for (i = 0; i < 1024; i += 3) { x.fillStyle = 'rgba(0,0,0,' + (0.10 + Math.random() * 0.2) + ')'; x.fillRect(i, 0, 1, 720); }      // warp threads
    for (i = 0; i < 720; i += 3) { x.fillStyle = 'rgba(255,214,160,' + (0.04 + Math.random() * 0.09) + ')'; x.fillRect(0, i + 1, 1024, 1); } // weft ridges
    for (i = 0; i < 14000; i++) { x.fillStyle = 'rgba(' + (Math.random() * 120 | 0) + ',' + (Math.random() * 80 | 0) + ',50,' + (Math.random() * 0.3) + ')'; x.fillRect(Math.random() * 1024, Math.random() * 720, 3, 2); }
    var rug = E('a-box', { position: '0.5 0.12 -1.2', width: 6.4, height: 0.025, depth: 4.5 });
    rug.setAttribute('material', { src: cv.toDataURL(), roughness: 1, metalness: 0 });

    root = wallRoot;
    // ---- bookshelf unit (left of TV) ----
    var bs = E('a-entity', { position: '-5.7 0 -6.7', rotation: '0 39.5 0' });
    E('a-box', { position: '0 0.5 0', width: 2.2, height: 1.0, depth: 0.6, material: WOOD }, bs);
    for (i = -1; i <= 1; i += 0.5) E('a-box', { position: i + ' 0.5 0.31', width: 0.02, height: 0.86, depth: 0.02, material: BRASS }, bs);
    E('a-box', { position: '0 2.35 -0.27', width: 2.2, height: 2.7, depth: 0.05, material: 'color: #1c120a; roughness: 0.8' }, bs);
    [-1.08, 1.08].forEach(function (px) { E('a-box', { position: px + ' 2.35 -0.02', width: 0.06, height: 2.7, depth: 0.55, material: WOOD }, bs); });
    [1.05, 1.85, 2.65, 3.7].forEach(function (py, k) {
      E('a-box', { position: '0 ' + py + ' -0.02', width: 2.2, height: 0.05, depth: 0.55, material: WOOD }, bs);

      const ang  = Math.random() * Math.PI * 2;
      const dist = Math.random() * Math.random() * 18;
      const sx   = Math.cos(ang) * dist;
      const sy   = 2.6 + (Math.random() - 0.5) * 9;
      const sz   = -(10 + Math.random() * 55);
      star.setAttribute('radius', 0.04 + Math.random() * 0.1);
      star.setAttribute('position', sx + ' ' + sy + ' ' + sz);
      star.setAttribute('material', 'color: #ffffff; emissive: #ffffff; emissiveIntensity: ' + (0.35 + Math.random() * 0.65) + '; roughness: 1');
      star.setAttribute('segments-height', '3');
      star.setAttribute('segments-width', '4');
      scene.appendChild(star);
    }
  });

  // ===================== TV BROWSER =====================
  function tvGo() {
    let url = document.getElementById('tv-url').value.trim();
    if (!url) return;
    if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
    document.getElementById('tv-url').value = url;
    document.getElementById('tv-frame').src  = url;
  }
  function tvNewTab() {
    const url = document.getElementById('tv-url').value.trim();
    if (url) window.open(url, '_blank');
  }
  function tvClose() {
    document.getElementById('tv-panel').classList.remove('open');
    document.getElementById('tv-frame').src = 'about:blank';
  }
  document.getElementById('tv-url').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') tvGo();
  });
</script>
