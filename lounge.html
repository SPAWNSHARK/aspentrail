<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SS Wayfarer — Crew Lounge</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; }
    #hud {
      position: fixed; top: 0; left: 0; right: 0;
      padding: 14px 20px;
      display: flex; justify-content: space-between; align-items: center;
      color: #cc8833;
      font-family: 'Courier New', monospace; font-size: 11px;
      letter-spacing: 3px; text-transform: uppercase;
      pointer-events: none;
      text-shadow: 0 0 8px #ff6600;
      background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
      z-index: 10;
    }
    #tv-panel {
      position: fixed; inset: 0;
      background: #000;
      display: none; flex-direction: column;
      z-index: 100;
    }
    #tv-panel.open { display: flex; }
    #tv-chrome {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px;
      background: #0a0a0a;
      border-bottom: 1px solid #2a2a2a;
      flex-shrink: 0;
    }
    #tv-chrome button {
      background: #111; color: #cc8833;
      border: 1px solid #333; border-radius: 3px;
      padding: 5px 12px;
      font-family: 'Courier New', monospace; font-size: 11px;
      letter-spacing: 1px; cursor: pointer; white-space: nowrap;
    }
    #tv-chrome button:hover { background: #222; border-color: #ff6600; }
    #tv-url {
      flex: 1; min-width: 0;
      background: #050505; color: #ffcc66;
      border: 1px solid #333; border-radius: 3px;
      padding: 5px 10px;
      font-family: 'Courier New', monospace; font-size: 12px; outline: none;
    }
    #tv-url:focus { border-color: #ff6600; }
    #tv-note {
      color: #444; font-family: 'Courier New', monospace; font-size: 10px;
      letter-spacing: 1px; padding: 4px 12px;
      background: #050505; border-bottom: 1px solid #1a1a1a; flex-shrink: 0;
    }
    #tv-frame { flex: 1; border: none; background: #0a0a0a; }
  </style>
</head>
<body>

<div id="hud">
  <span>SS WAYFARER</span>
  <span>CREW LOUNGE</span>
  <span>DECK 2 — STARBOARD FWD</span>
</div>

<div id="tv-panel">
  <div id="tv-chrome">
    <button onclick="tvClose()">✕ CLOSE</button>
    <input id="tv-url" type="text" placeholder="https://" value="https://www.wikipedia.org" />
    <button onclick="tvGo()">GO</button>
    <button onclick="tvNewTab()">↗ NEW TAB</button>
  </div>
  <div id="tv-note">Some sites block embedding — use ↗ NEW TAB as fallback</div>
  <iframe id="tv-frame" src="about:blank"
    sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox">
  </iframe>
</div>

  <!-- ===================== LIGHTING ===================== -->
  <a-light type="ambient" color="#1a0d05" intensity="0.55"></a-light>
  <a-light type="point" position="0 4.8 0" color="#ff9933" intensity="1.6" distance="14" decay="2"></a-light>
  <a-light type="point" position="0 3.5 2.0" color="#ff7722" intensity="1.0" distance="8" decay="2"></a-light>

  <!-- ===================== PLAYER ===================== -->
  <a-entity id="player"
    position="0 1.6 7"
    wasd-controls="acceleration: 22"
    look-controls="pointerLockEnabled: true">
    <a-camera fov="80" near="0.05">
      <a-cursor
        color="#cc8833"
        fuse="true"
        fuse-timeout="1500"
        raycaster="objects: .clickable"
        animation__click="property: scale; startEvents: click; easing: easeInCubic; dur: 150; from: 1.2 1.2 1.2; to: 1 1 1">
      </a-cursor>
    </a-camera>
  </a-entity>

</a-scene>

<script>
  // ===================== CAT ROAM COMPONENT =====================
  AFRAME.registerComponent('cat-roam', {
    schema: {
      speed:  { default: 0.5 },
      offset: { default: 0.0 }
    },
    init: function () {
      this.angle         = this.data.offset;
      this.r             = 2.5 + Math.abs(Math.sin(this.data.offset)) * 2.5;
      this.targetAngle   = this.angle + (Math.random() - 0.5) * 2;
      this.targetR       = this.r;
      this.changeTimer   = 0;
      this.changeInterval = 3 + Math.random() * 5;
      this.prevX = 0;
      this.prevZ = 0;
    },
    tick: function (t, dt) {
      const s = Math.min(dt / 1000, 0.05);
      this.changeTimer += s;
      if (this.changeTimer >= this.changeInterval) {
        this.changeTimer    = 0;
        this.changeInterval = 2.5 + Math.random() * 6;
        this.targetAngle    = this.angle + (Math.random() * 2 - 1) * Math.PI * 1.6;
        this.targetR        = 1.5 + Math.random() * 5;
      }
      this.angle += (this.targetAngle - this.angle) * s * this.data.speed * 2.5;
      this.r     += (this.targetR     - this.r)     * s * 0.9;
      const x = Math.cos(this.angle) * this.r;
      const z = Math.sin(this.angle) * this.r - 1.5;
      this.el.setAttribute('position', { x, y: 0, z });
      const dx = x - this.prevX;
      const dz = z - this.prevZ;
      if (Math.abs(dx) + Math.abs(dz) > 0.0005) {
        this.el.setAttribute('rotation', {
          x: 0,
          y: THREE.MathUtils.radToDeg(Math.atan2(dx, dz)),
          z: 0
        });
      }
      this.prevX = x;
      this.prevZ = z;
    }
  });

  // ===================== SCENE LOADED =====================
  document.querySelector('a-scene').addEventListener('loaded', function () {
    const scene = document.querySelector('a-scene');

    // click: TV
    document.querySelector('#tv-screen').addEventListener('click', function () {
      document.getElementById('tv-panel').classList.add('open');
      tvGo();
    });
    // hover: TV
    const tvEl = document.querySelector('#tv-screen');
    tvEl.addEventListener('mouseenter', function () {
      tvEl.setAttribute('material', 'emissiveIntensity', 1.7);
    });
    tvEl.addEventListener('mouseleave', function () {
      tvEl.setAttribute('material', 'emissiveIntensity', 0.9);
    });
    // click: exit
    document.querySelector('#exit-door').addEventListener('click', function () {
      window.location.href = 'index.html';
    });

    // stars behind the window
    for (let i = 0; i < 280; i++) {
      const star = document.createElement('a-sphere');
      const ang  = Math.random() * Math.PI * 2;
      const dist = Math.random() * Math.random() * 18;
      const sx   = Math.cos(ang) * dist;
      const sy   = 2.6 + (Math.random() - 0.5) * 9;
      const sz   = -(10 + Math.random() * 55);
      star.setAttribute('radius', 0.04 + Math.random() * 0.1);
      star.setAttribute('position', sx + ' ' + sy + ' ' + sz);
      star.setAttribute('material', 'color: #ffffff; emissive: #ffffff; emissiveIntensity: ' + (0.35 + Math.random() * 0.65) + '; roughness: 1');
      star.setAttribute('segments-height', '3');
      star.setAttribute('segments-width', '4');
      scene.appendChild(star);
    }
  });

  // ===================== TV BROWSER =====================
  function tvGo() {
    let url = document.getElementById('tv-url').value.trim();
    if (!url) return;
    if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
    document.getElementById('tv-url').value = url;
    document.getElementById('tv-frame').src  = url;
  }
  function tvNewTab() {
    const url = document.getElementById('tv-url').value.trim();
    if (url) window.open(url, '_blank');
  }
  function tvClose() {
    document.getElementById('tv-panel').classList.remove('open');
    document.getElementById('tv-frame').src = 'about:blank';
  }
  document.getElementById('tv-url').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') tvGo();
  });
</script>
</body>
</html>
