<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SS Wayfarer — Media Nexus</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-title" content="SS Wayfarer">
  <link rel="apple-touch-icon" sizes="180x180" href="/aspentrail/icons/apple-touch-icon.png">
  <link rel="icon" href="/aspentrail/icons/favicon.ico">
  <meta property="og:type" content="website">
  <meta property="og:title" content="SS Wayfarer — Media Nexus">
  <meta property="og:url" content="https://spawnshark.github.io/aspentrail/media.html">
  <meta property="og:image" content="https://spawnshark.github.io/aspentrail/images/wayfarer-share.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="The bronze SS Wayfarer in orbit above a sunlit planet.">
  <meta name="twitter:card" content="summary_large_image">
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="mobile.js?v=20261125g"></script>
  <script src="door.js?v=20261125g"></script>
  <script src="props.js?v=20261125g"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; }
    #hud {
      position: fixed; top: 0; left: 0; right: 0;
      padding: 14px 20px;
      display: flex; justify-content: space-between; align-items: center;
      color: #4488cc;
      font-family: 'Courier New', monospace; font-size: 11px;
      letter-spacing: 3px; text-transform: uppercase;
      pointer-events: none;
      text-shadow: 0 0 8px #0066ff;
      background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
      z-index: 10;
    }
    #channel-label {
      font-family: -apple-system, system-ui, sans-serif !important; color: #ffd9a0 !important; text-shadow: 0 0 10px #ff8a20 !important;
      position: fixed;
      bottom: 60px; left: 50%;
      transform: translateX(-50%);
      color: #88bbff;
      font-family: 'Courier New', monospace; font-size: 14px;
      letter-spacing: 5px; text-transform: uppercase;
      text-shadow: 0 0 10px #0066ff;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s;
      white-space: nowrap;
      z-index: 10;
    }
    #controls-hint {
      position: fixed; bottom: 18px; left: 50%;
      transform: translateX(-50%);
      color: #223355;
      font-family: 'Courier New', monospace; font-size: 10px;
      letter-spacing: 2px; text-transform: uppercase;
      pointer-events: none; z-index: 10;
    }
  </style>
</head>
<body>
<div id="hud"><span>SS WAYFARER</span><span>MEDIA NEXUS</span><span>DECK 2</span></div>
<div id="channel-label"></div>
<div id="controls-hint">TAP A WALL SCREEN TO PUT IT ON THE MAIN SCREEN · TAP THE MAIN SCREEN TO WATCH</div>

<!-- Media Nexus — HYBRID (user decision): theatre recliners facing one big main screen (−Z), side walls covered in
     channel screens (one per subscription), speaker towers either side. Walnut / bronze / amber like the rest of the ship.
     Seats + speakers are GLBs from the user's asset kit (models/props, recoloured by props.js). -->
<a-scene device-orientation-permission-ui="enabled: false" wayfarer-mobile="radius: 8.3" wf-media light="defaultLightsEnabled: false"
  vr-mode-ui="enabled: true" renderer="antialias: true; toneMapping: ACESFilmic; exposure: 1.1" background="color: #050302">

  <!-- recliners: two rows with a centre aisle; back row on a riser -->
  <a-entity wf-prop="src: cinema_seat; height: 1.15" position="-1.9 0 -0.6"  rotation="0 180 0"></a-entity>
  <a-entity wf-prop="src: cinema_seat; height: 1.15" position="-0.95 0 -0.6" rotation="0 180 0"></a-entity>
  <a-entity wf-prop="src: cinema_seat; height: 1.15" position="0.95 0 -0.6"  rotation="0 180 0"></a-entity>
  <a-entity wf-prop="src: cinema_seat; height: 1.15" position="1.9 0 -0.6"   rotation="0 180 0"></a-entity>
  <a-entity wf-prop="src: cinema_seat; height: 1.15" position="-1.9 0.36 1.7"  rotation="0 180 0"></a-entity>
  <a-entity wf-prop="src: cinema_seat; height: 1.15" position="-0.95 0.36 1.7" rotation="0 180 0"></a-entity>
  <a-entity wf-prop="src: cinema_seat; height: 1.15" position="0.95 0.36 1.7"  rotation="0 180 0"></a-entity>
  <a-entity wf-prop="src: cinema_seat; height: 1.15" position="1.9 0.36 1.7"   rotation="0 180 0"></a-entity>
  <!-- speaker towers flanking the main screen -->
  <a-entity wf-prop="src: speaker_tower; height: 2.3" position="-5.4 0 -6.6" rotation="0 25 0"></a-entity>
  <a-entity wf-prop="src: speaker_tower; height: 2.3" position="5.4 0 -6.6"  rotation="0 -25 0"></a-entity>

  <a-entity id="player" position="0 0 6.5">
    <a-camera wasd-controls="acceleration: 20; fly: false" look-controls="pointerLockEnabled: true; touchEnabled: true; magicWindowTrackingEnabled: false" position="0 1.6 0">
      <a-cursor color="#ffb060" fuse="true" fuse-timeout="1500" raycaster="objects: .clickable"></a-cursor>
    </a-camera>
  </a-entity>
</a-scene>

<script>
(function () {
  var THREE = AFRAME.THREE, sc = document.querySelector('a-scene');
  var R = 9.2, H = 6.2, SCR_Z = -8.2, SCR_W = 9.6, SCR_H = 4.4, SCR_Y = 3.2;
  // channels: edit this list (or, with a YouTube Data API key, fill it from the subscriptions feed — see CLAUDE.md)
  var CHANNELS = [
    { label: 'SPACE SCIENCE', glow: '#4a8cff', q: 'space+science+documentary' },
    { label: 'GENETICS',      glow: '#3fe0a0', q: 'genetics+ancient+dna' },
    { label: 'HISTORY',       glow: '#ffa040', q: 'ancient+history+documentary' },
    { label: 'BIBLE PROPHECY',glow: '#e0b060', q: 'biblical+eschatology' },
    { label: 'ARCHAEOLOGY',   glow: '#d08850', q: 'archaeology+discoveries' },
    { label: 'DESIGN',        glow: '#c070ff', q: 'graphic+design+affinity' },
    { label: 'TECHNOLOGY',    glow: '#8a6cff', q: 'technology+engineering' },
    { label: 'DOCUMENTARY',   glow: '#3fc8d0', q: 'documentary+film' },
    { label: 'MUSIC',         glow: '#ff6aa0', q: 'music+live+performance' },
    { label: 'HOME RENOVATION', glow: '#90c060', q: 'house+flip+renovation' },
    { label: 'WORLD NEWS',    glow: '#6aa0ff', q: 'world+news+today' },
    { label: 'COOKING',       glow: '#ffc080', q: 'cooking+recipes' }
  ];
  function cv(w, h) { var c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
  function rng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function tex(c, rx, ry) { var t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx || 1, ry || 1); t.anisotropy = 4; return t; }
  function rr(w, h, r) { var x = -w / 2, y = -h / 2, s = new THREE.Shape(); s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r); s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h); s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r); s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y); return s; }
  function soft(sh, d, b) { var g = new THREE.ExtrudeGeometry(sh, { depth: d, bevelEnabled: true, bevelThickness: b, bevelSize: b, bevelSegments: 2, curveSegments: 6 }); g.translate(0, 0, -d / 2); return g; }
  function polar(th, r, y) { return new THREE.Vector3(r * Math.sin(th), y, -r * Math.cos(th)); }      // th 0 = toward the main screen (−Z)
  function dotTex() { var c = cv(64, 64), x = c.getContext('2d'), g = x.createRadialGradient(32, 32, 0, 32, 32, 32); g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.35, 'rgba(255,255,255,0.4)'); g.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = g; x.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c); }
  function add(map, col, op) { return new THREE.MeshBasicMaterial({ map: map || null, color: col, transparent: true, opacity: op, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false }); }

  // a channel card: dark glass with the channel's colour, a stylised "thumbnail", title and play badge
  function card(ch, big, seed) {
    var W = big ? 1600 : 640, Hh = big ? 744 : 380, c = cv(W, Hh), x = c.getContext('2d'), r = rng(seed || 3), k = W / 640;
    var g = x.createLinearGradient(0, 0, W, Hh); g.addColorStop(0, '#05070c'); g.addColorStop(1, '#14100c'); x.fillStyle = g; x.fillRect(0, 0, W, Hh);
    for (var i = 0; i < 7; i++) { var rg = x.createRadialGradient(r() * W, r() * Hh * 0.8, 0, r() * W, r() * Hh, (60 + r() * 220) * k); rg.addColorStop(0, ch.glow + (i < 2 ? 'aa' : '55')); rg.addColorStop(1, ch.glow + '00'); x.fillStyle = rg; x.fillRect(0, 0, W, Hh); }
    x.fillStyle = 'rgba(0,0,0,0.45)'; x.fillRect(0, Hh * 0.72, W, Hh * 0.28);
    x.fillStyle = '#fff'; x.font = '700 ' + (big ? 64 : 30) + 'px -apple-system, "Helvetica Neue", Arial, sans-serif'; x.fillText(ch.label, 24 * k, Hh * 0.84);
    x.fillStyle = 'rgba(255,230,200,0.75)'; x.font = '500 ' + (big ? 30 : 15) + 'px -apple-system, "Helvetica Neue", Arial, sans-serif'; x.fillText(big ? 'TAP TO WATCH ON YOUTUBE' : 'LATEST VIDEO', 24 * k, Hh * 0.93);
    var cx = W / 2, cy = Hh * 0.38, pr = (big ? 70 : 34);                                               // play badge
    x.fillStyle = 'rgba(0,0,0,0.5)'; x.beginPath(); x.arc(cx, cy, pr, 0, 7); x.fill(); x.strokeStyle = 'rgba(255,255,255,0.85)'; x.lineWidth = big ? 5 : 3; x.stroke();
    x.fillStyle = '#fff'; x.beginPath(); x.moveTo(cx - pr * 0.3, cy - pr * 0.45); x.lineTo(cx + pr * 0.5, cy); x.lineTo(cx - pr * 0.3, cy + pr * 0.45); x.closePath(); x.fill();
    x.fillStyle = ch.glow; x.fillRect(0, Hh - 6 * k, W, 6 * k);
    var t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t;
  }

  var root, anim = [], bronze, amber, mainMesh, mainGlow, mainLight;
  function build() {
    root = new THREE.Group(); sc.object3D.add(root);
    var r = rng(11);
    // ── materials ──
    var bc = cv(256, 256), bx = bc.getContext('2d'); bx.fillStyle = '#8c6234'; bx.fillRect(0, 0, 256, 256); for (var i = 0; i < 1400; i++) { var a = r() * 0.18; bx.fillStyle = r() < 0.5 ? 'rgba(255,215,150,' + a * 0.5 + ')' : 'rgba(40,20,6,' + a * 0.5 + ')'; bx.fillRect(0, r() * 256, 256, 1); }
    bronze = new THREE.MeshStandardMaterial({ map: tex(bc), color: 0xd8b58a, roughness: 0.42, metalness: 0.8, emissive: 0x1a0e04, emissiveIntensity: 0.6 });
    amber = new THREE.MeshBasicMaterial({ color: 0xffa040, toneMapped: false });
    var Wc = cv(512, 1024), wx = Wc.getContext('2d'), Y = function (m) { return (1 - m / H) * 1024; };
    wx.fillStyle = '#2b221c'; wx.fillRect(0, 0, 512, 1024);
    function inset(y0, y1, col) { wx.fillStyle = col; wx.fillRect(26, Y(y1), 460, Y(y0) - Y(y1)); wx.fillStyle = 'rgba(255,210,150,0.07)'; wx.fillRect(26, Y(y1), 460, 3); wx.fillStyle = 'rgba(0,0,0,0.35)'; wx.fillRect(26, Y(y0) - 3, 460, 3); }
    inset(1.06, 5.4, '#372b23'); inset(0.14, 0.86, '#2f251e'); wx.fillStyle = 'rgba(0,0,0,0.55)'; wx.fillRect(0, 0, 3, 1024);
    function rail(m, h) { var gr = wx.createLinearGradient(0, Y(m + h), 0, Y(m)); gr.addColorStop(0, '#d9a866'); gr.addColorStop(0.5, '#9a6c36'); gr.addColorStop(1, '#5a3d1e'); wx.fillStyle = gr; wx.fillRect(0, Y(m + h), 512, Y(m) - Y(m + h)); }
    rail(0.95, 0.05); rail(5.55, 0.04);
    for (i = 0; i < 8000; i++) { wx.fillStyle = r() < 0.5 ? 'rgba(0,0,0,0.06)' : 'rgba(255,220,180,0.025)'; wx.fillRect(r() * 512, r() * 1024, 1 + r() * 2, 1 + r() * 8); }
    var walls = new THREE.Mesh(new THREE.CylinderGeometry(R, R, H, 128, 14, true), new THREE.MeshStandardMaterial({ map: tex(Wc, 44, 1), roughness: 0.62, metalness: 0.15, side: THREE.BackSide }));
    walls.position.y = H / 2; root.add(walls);
    // floor: polished dark deck (many small triangles — see the RULE in CLAUDE.md), amber rings, a carpeted seating area
    var Dc = cv(512, 512), dx = Dc.getContext('2d'); dx.fillStyle = '#1e1a17'; dx.fillRect(0, 0, 512, 512);
    for (i = 0; i < 70; i++) { dx.fillStyle = 'rgba(' + (r() < 0.5 ? '0,0,0' : '255,230,200') + ',' + (0.015 + r() * 0.025) + ')'; dx.fillRect(r() * 512, r() * 512, 40 + r() * 160, 20 + r() * 90); }
    dx.fillStyle = 'rgba(0,0,0,0.65)'; dx.fillRect(0, 0, 512, 3); dx.fillRect(0, 0, 3, 512);
    var fg = new THREE.RingGeometry(0.001, R, 128, 16); fg.rotateX(-Math.PI / 2);
    var uv = fg.attributes.uv, ps = fg.attributes.position; for (i = 0; i < uv.count; i++) uv.setXY(i, ps.getX(i) / (2 * R) + 0.5, -ps.getZ(i) / (2 * R) + 0.5);
    root.add(new THREE.Mesh(fg, new THREE.MeshStandardMaterial({ map: tex(Dc, 9, 9), roughness: 0.32, metalness: 0.45, color: 0xa89e92 })));
    [[R - 0.6, 0.03], [6.8, 0.02]].forEach(function (q) { var t = new THREE.Mesh(new THREE.RingGeometry(q[0] - q[1], q[0] + q[1], 160), amber); t.rotation.x = -Math.PI / 2; t.position.y = 0.006; root.add(t); });
    var Cc = cv(256, 256), cx2 = Cc.getContext('2d'); cx2.fillStyle = '#3a1c14'; cx2.fillRect(0, 0, 256, 256); for (i = 0; i < 6000; i++) { cx2.fillStyle = 'rgba(' + (r() < 0.5 ? '0,0,0' : '200,120,80') + ',0.08)'; cx2.fillRect(r() * 256, r() * 256, 2, 2); }
    var carpet = new THREE.Mesh(new THREE.PlaneGeometry(5.6, 4.6, 8, 8), new THREE.MeshStandardMaterial({ map: tex(Cc, 4, 4), roughness: 0.95 })); carpet.rotation.x = -Math.PI / 2; carpet.position.set(0, 0.008, 0.55); root.add(carpet);
    var riser = new THREE.Mesh(soft(rr(5.4, 1.9, 0.12), 0.36, 0.03), new THREE.MeshStandardMaterial({ map: tex(Cc, 3, 1), roughness: 0.9 })); riser.rotation.x = -Math.PI / 2; riser.position.set(0, 0.18, 1.85); root.add(riser);
    var rl = new THREE.Mesh(new THREE.BoxGeometry(5.3, 0.02, 0.02), amber); rl.position.set(0, 0.05, 0.88); root.add(rl);
    // ceiling: dark panels, bronze rims, the amber ring, cove
    var Kc = cv(512, 512), kx = Kc.getContext('2d'); kx.fillStyle = '#231b15'; kx.fillRect(0, 0, 512, 512); for (i = 0; i < 4000; i++) { kx.fillStyle = r() < 0.5 ? 'rgba(0,0,0,0.08)' : 'rgba(255,220,180,0.03)'; kx.fillRect(r() * 512, r() * 512, 2, 2); } kx.strokeStyle = 'rgba(0,0,0,0.5)'; kx.lineWidth = 3; kx.strokeRect(0, 0, 512, 512);
    var cg = new THREE.RingGeometry(0.001, R, 96, 12); cg.rotateX(Math.PI / 2); var cuv = cg.attributes.uv, cps = cg.attributes.position; for (i = 0; i < cuv.count; i++) cuv.setXY(i, cps.getX(i) / 18 + 0.5, cps.getZ(i) / 18 + 0.5);
    var ceil = new THREE.Mesh(cg, new THREE.MeshStandardMaterial({ map: tex(Kc, 7, 7), roughness: 0.8, metalness: 0.15 })); ceil.position.y = H; root.add(ceil);
    var ring = new THREE.Mesh(new THREE.TorusGeometry(4.2, 0.1, 10, 128), new THREE.MeshBasicMaterial({ color: 0xffb060, toneMapped: false })); ring.rotation.x = Math.PI / 2; ring.position.set(0, H - 0.25, 0.5); root.add(ring);
    [3.9, 4.55].forEach(function (rr2) { var t = new THREE.Mesh(new THREE.TorusGeometry(rr2, 0.06, 8, 128), bronze); t.rotation.x = Math.PI / 2; t.position.set(0, H - 0.2, 0.5); root.add(t); });
    var cove = new THREE.Mesh(new THREE.TorusGeometry(R - 0.12, 0.035, 6, 192), amber); cove.rotation.x = Math.PI / 2; cove.position.y = H - 0.18; root.add(cove);
    var crn = new THREE.Mesh(new THREE.TorusGeometry(R - 0.1, 0.09, 8, 192), bronze); crn.rotation.x = Math.PI / 2; crn.position.y = H - 0.08; root.add(crn);
    // bronze ribs round the wall, clear of the screens and the door
    var leg = soft(rr(0.24, H - 0.4, 0.05), 0.1, 0.03);
    [-150, -130, -40, 40, 130, 150].forEach(function (d) { var t = d * Math.PI / 180, p = polar(t, R - 0.06, (H - 0.4) / 2), m = new THREE.Mesh(leg, bronze); m.position.copy(p); m.rotation.y = -t; root.add(m); });

    buildMainScreen(); buildChannelWalls();

    // ── lights ──
    root.add(new THREE.HemisphereLight(0xffd8b0, 0x2a1c12, 0.9));
    [[-3, 2], [3, 2], [-3, -4], [3, -4]].forEach(function (q) { var l = new THREE.PointLight(0xffb070, 1.4, 11, 1.4); l.position.set(q[0], H - 0.6, q[1]); root.add(l); });
  }

  // ── the main screen: big, in a bronze proscenium with an amber glow, shows the selected channel ──
  var selected = 0;
  function buildMainScreen() {
    var g = new THREE.Group(); g.position.set(0, 0, SCR_Z); root.add(g);
    var fr = new THREE.Mesh(soft(rr(SCR_W + 0.5, SCR_H + 0.5, 0.25), 0.18, 0.05), bronze); fr.position.set(0, SCR_Y, 0); g.add(fr);
    mainMesh = new THREE.Mesh(new THREE.PlaneGeometry(SCR_W, SCR_H), new THREE.MeshBasicMaterial({ map: card(CHANNELS[0], true, 1), toneMapped: false })); mainMesh.position.set(0, SCR_Y, 0.15); g.add(mainMesh);
    var dot = dotTex(); mainGlow = new THREE.Mesh(new THREE.PlaneGeometry(SCR_W + 4, SCR_H + 3), add(dot, CHANNELS[0].glow, 0.35)); mainGlow.position.set(0, SCR_Y, 0.02); g.add(mainGlow);
    var strip = new THREE.Mesh(new THREE.BoxGeometry(SCR_W + 0.3, 0.025, 0.025), amber); strip.position.set(0, SCR_Y - SCR_H / 2 - 0.3, 0.2); g.add(strip);
    var stage = new THREE.Mesh(soft(rr(SCR_W + 1.4, 1.2, 0.2), 0.3, 0.04), bronze); stage.rotation.x = -Math.PI / 2; stage.position.set(0, 0.15, 0.4); g.add(stage);
    mainLight = new THREE.PointLight(new THREE.Color(CHANNELS[0].glow), 1.0, 10, 1.6); mainLight.position.set(0, SCR_Y, 2.2); g.add(mainLight);
    var ent = document.createElement('a-entity'); ent.setAttribute('class', 'clickable'); sc.appendChild(ent);
    ent.setObject3D('mesh', new THREE.Mesh(new THREE.PlaneGeometry(SCR_W, SCR_H), new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false })));
    ent.object3D.position.set(0, SCR_Y, SCR_Z + 0.2);
    ent.addEventListener('click', function () { window.open('https://www.youtube.com/results?search_query=' + CHANNELS[selected].q, '_blank'); });
  }
  function select(i) {
    selected = i; var ch = CHANNELS[i];
    mainMesh.material.map.dispose(); mainMesh.material.map = card(ch, true, i + 1); mainMesh.material.needsUpdate = true;
    mainGlow.material.color.set(ch.glow); mainLight.color.set(ch.glow);
    var lab = document.getElementById('channel-label'); lab.textContent = 'NOW SHOWING · ' + ch.label; lab.style.opacity = 1; clearTimeout(select.t); select.t = setTimeout(function () { lab.style.opacity = 0; }, 2000);
  }

  // ── channel screens covering both side walls: 3 columns × 2 rows each side ──
  function buildChannelWalls() {
    var dot = dotTex(), SW = 1.75, SH = 1.04, frameG = soft(rr(SW + 0.16, SH + 0.16, 0.08), 0.08, 0.02);
    var cols = [-112, -84, -56, 56, 84, 112], rows = [2.0, 3.45];
    var k = 0;
    cols.forEach(function (deg) {
      rows.forEach(function (y) {
        if (k >= CHANNELS.length) return;
        var i = k++, ch = CHANNELS[i], th = deg * Math.PI / 180, p = polar(th, R - 0.18, y), g = new THREE.Group();
        g.position.copy(p); g.rotation.y = -th; root.add(g);                      // local +z faces the room
        var fr = new THREE.Mesh(frameG, bronze); g.add(fr);
        var scr = new THREE.Mesh(new THREE.PlaneGeometry(SW, SH), new THREE.MeshBasicMaterial({ map: card(ch, false, i + 20), toneMapped: false })); scr.position.z = 0.12; g.add(scr);
        var gl = new THREE.Mesh(new THREE.PlaneGeometry(SW + 1.2, SH + 1), add(dot, ch.glow, 0.25)); gl.position.z = -0.02; g.add(gl);
        var scan = new THREE.Mesh(new THREE.PlaneGeometry(SW, 0.02), add(null, ch.glow, 0.35)); scan.position.z = 0.125; g.add(scan);
        anim.push(function (t) { scan.position.y = ((t * 0.35 + i * 0.13) % 1 - 0.5) * SH; });
        var ent = document.createElement('a-entity'); ent.setAttribute('class', 'clickable'); sc.appendChild(ent);
        ent.setObject3D('mesh', new THREE.Mesh(new THREE.PlaneGeometry(SW + 0.1, SH + 0.1), new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false })));
        ent.object3D.position.copy(polar(th, R - 0.28, y)); ent.object3D.rotation.y = -th;
        ent.addEventListener('click', function () { select(i); });
        ent.addEventListener('mouseenter', function () { scr.scale.setScalar(1.04); });
        ent.addEventListener('mouseleave', function () { scr.scale.setScalar(1); });
      });
    });
  }

  AFRAME.registerComponent('wf-media', {
    init: function () { if (sc.hasLoaded) build(); else sc.addEventListener('loaded', build); },
