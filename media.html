<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SS Wayfarer — Media Nexus</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <script src="textures.js"></script>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; }
    #hud {
      position: fixed; top: 0; left: 0; right: 0;
      padding: 14px 20px;
      display: flex; justify-content: space-between; align-items: center;
      color: #4488cc;
      font-family: 'Courier New', monospace; font-size: 11px;
      letter-spacing: 3px; text-transform: uppercase;
      pointer-events: none;
      text-shadow: 0 0 8px #0066ff;
      background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
      z-index: 10;
    }
    #channel-label {
      position: fixed;
      bottom: 60px; left: 50%;
      transform: translateX(-50%);
      color: #88bbff;
      font-family: 'Courier New', monospace; font-size: 14px;
      letter-spacing: 5px; text-transform: uppercase;
      text-shadow: 0 0 10px #0066ff;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s;
      white-space: nowrap;
      z-index: 10;
    }
    #controls-hint {
      position: fixed; bottom: 18px; left: 50%;
      transform: translateX(-50%);
      color: #223355;
      font-family: 'Courier New', monospace; font-size: 10px;
      letter-spacing: 2px; text-transform: uppercase;
      pointer-events: none; z-index: 10;
    }
  </style>
</head>
<body>

<div id="hud">
  <span>SS WAYFARER</span>
  <span>MEDIA NEXUS</span>
  <span>DECK 2 — STARBOARD AFT</span>
</div>
<div id="channel-label"></div>
<div id="controls-hint">WASD MOVE · DRAG LOOK · CLICK SCREEN TO TUNE IN</div>

<a-scene
  fog="type: exponential; color: #000205; density: 0.045"
  vr-mode-ui="enabled: true"
  renderer="antialias: true; colorManagement: true"
  background="color: #000205">

  <!-- ===================== ROOM SHELL ===================== -->
  <!-- walls: dark blue metal panels (applied via JS) -->
  <a-cylinder id="media-walls" radius="9.2" height="7" open-ended="true" position="0 3.5 0"
    material="side: back; color: #020410; roughness: 0.88; metalness: 0.15">
  </a-cylinder>
  <!-- floor: reflective grating (applied via JS) -->
  <a-cylinder id="media-floor" radius="9.3" height="0.08" position="0 0.04 0"
    material="color: #050818; roughness: 0.2; metalness: 0.9">
  </a-cylinder>
  <!-- floor reflection ring -->
  <a-torus radius="7" radius-tubular="0.04" position="0 0.09 0" rotation="90 0 0"
    material="color: #001133; emissive: #0011aa; emissiveIntensity: 0.5; roughness: 1">
  </a-torus>
  <!-- ceiling: panels (applied via JS) -->
  <a-cylinder id="media-ceil" radius="9.3" height="0.08" position="0 7.04 0"
    material="color: #030510; roughness: 0.95">
  </a-cylinder>
  <!-- ceiling light ring -->
  <a-torus radius="6.5" radius-tubular="0.06" position="0 6.9 0" rotation="90 0 0"
    material="color: #0022aa; emissive: #0033ff; emissiveIntensity: 1.2; roughness: 1">
  </a-torus>

  <!-- ===================== CENTRAL PLATFORM + CHAIR ===================== -->
  <a-cylinder radius="2.6" height="0.18" position="0 0.09 0"
    material="color: #0a0a1e; emissive: #0011aa; emissiveIntensity: 0.18; roughness: 0.25; metalness: 0.95">
  </a-cylinder>
  <a-torus radius="2.6" radius-tubular="0.045" position="0 0.2 0" rotation="90 0 0"
    material="color: #0033ff; emissive: #0055ff; emissiveIntensity: 2; roughness: 1">
  </a-torus>
  <!-- chair seat -->
  <a-box position="0 0.56 0" width="0.82" height="0.1" depth="0.88"
    material="color: #080818; roughness: 0.35; metalness: 0.9">
  </a-box>
  <!-- chair back -->
  <a-box position="0 1.2 0.42" width="0.82" height="1.3" depth="0.09"
    material="color: #06060e; roughness: 0.35; metalness: 0.9">
  </a-box>
  <!-- headrest -->
  <a-box position="0 1.92 0.44" width="0.6" height="0.32" depth="0.07"
    material="color: #08081a; roughness: 0.35; metalness: 0.9">
  </a-box>
  <!-- armrests -->
  <a-box position="-0.48 0.68 0.12" width="0.09" height="0.1" depth="0.68"
    material="color: #0a0a1e; roughness: 0.3; metalness: 0.95">
  </a-box>
  <a-box position="0.48 0.68 0.12" width="0.09" height="0.1" depth="0.68"
    material="color: #0a0a1e; roughness: 0.3; metalness: 0.95">
  </a-box>
  <!-- chair legs -->
  <a-cylinder radius="0.035" height="0.48" position="-0.32 0.24 0.36" color="#080818" roughness="0.3" metalness="0.95"></a-cylinder>
  <a-cylinder radius="0.035" height="0.48" position="0.32 0.24 0.36" color="#080818" roughness="0.3" metalness="0.95"></a-cylinder>
  <a-cylinder radius="0.035" height="0.48" position="-0.32 0.24 -0.36" color="#080818" roughness="0.3" metalness="0.95"></a-cylinder>
  <a-cylinder radius="0.035" height="0.48" position="0.32 0.24 -0.36" color="#080818" roughness="0.3" metalness="0.95"></a-cylinder>
  <!-- chair glow strip -->
  <a-box position="0 0.5 0.45" width="0.8" height="0.03" depth="0.01"
    material="color: #0044ff; emissive: #0066ff; emissiveIntensity: 2.5">
  </a-box>
  <a-box position="0 1.9 0.5" width="0.58" height="0.03" depth="0.01"
    material="color: #0044ff; emissive: #0066ff; emissiveIntensity: 2">
  </a-box>

  <!-- ===================== EXIT DOOR ===================== -->
  <!-- door surround (at θ=90°: x=0, z=8.2) -->
  <a-box position="0 1.65 8.24" width="2.0" height="3.1" depth="0.14"
    material="color: #070712; emissive: #001133; emissiveIntensity: 0.4; roughness: 0.4; metalness: 0.8">
  </a-box>
  <a-text value="← CORRIDOR" align="center"
    position="0 2.95 8.2" color="#2244aa" width="3.4" letter-spacing="3">
  </a-text>
  <a-box id="exit-door" class="clickable"
    position="0 1.65 8.32" width="1.8" height="2.9" depth="0.05"
    material="color: #050510; emissive: #001166; emissiveIntensity: 0.7">
  </a-box>
  <!-- floor guide strip to door -->
  <a-box position="0 0.1 6" width="0.15" height="0.04" depth="5.5"
    material="color: #001155; emissive: #0033ff; emissiveIntensity: 1.2">
  </a-box>

  <!-- ===================== LIGHTING ===================== -->
  <a-light type="ambient" color="#060818" intensity="0.6"></a-light>
  <a-light type="point" position="0 6.5 0" color="#1133ff" intensity="0.9" distance="14" decay="2"></a-light>
  <a-light type="point" position="0 0.5 0" color="#0022aa" intensity="0.5" distance="8" decay="2"></a-light>

  <!-- ===================== PLAYER ===================== -->
  <a-entity id="player"
    position="0 1.6 0"
    wasd-controls="acceleration: 20"
    look-controls="pointerLockEnabled: true">
    <a-camera fov="80" near="0.05">
      <a-cursor
        color="#4488cc"
        fuse="true"
        fuse-timeout="1500"
        raycaster="objects: .clickable"
        animation__click="property: scale; startEvents: click; easing: easeInCubic; dur: 150; from: 1.2 1.2 1.2; to: 1 1 1">
      </a-cursor>
    </a-camera>
  </a-entity>

</a-scene>

<script>
  // ===================== SCREEN DEFINITIONS =====================
  // Replace searchQ with a specific YouTube channel URL once you have your subscription list.
  // To auto-fetch latest videos, add YT_API_KEY and fetch:
  // https://www.googleapis.com/youtube/v3/search?channelId=CHANNEL_ID&part=snippet&order=date&maxResults=1&key=YT_API_KEY
  const SCREENS = [
    { theta: 0,   label: 'SPACE SCIENCE',   bg: '#01030a', glow: '#0066ff', q: 'space+science+documentary' },
    { theta: 30,  label: 'GENETICS',        bg: '#010a03', glow: '#00ff66', q: 'genetics+biology+science' },
    { theta: 60,  label: 'HISTORY',         bg: '#080400', glow: '#ff8800', q: 'history+documentary+ancient' },
    { theta: 120, label: 'TECHNOLOGY',      bg: '#060012', glow: '#cc44ff', q: 'technology+engineering' },
    { theta: 150, label: 'DOCUMENTARY',     bg: '#010a0a', glow: '#00cccc', q: 'documentary+film' },
    { theta: 180, label: 'MUSIC',           bg: '#0a0008', glow: '#ff44aa', q: 'music+live+performance' },
    { theta: 210, label: 'WORLD NEWS',      bg: '#010208', glow: '#4488ff', q: 'world+news+today' },
    { theta: 240, label: 'COMEDY',          bg: '#080300', glow: '#ffaa00', q: 'comedy+standup' },
    { theta: 270, label: 'GAMING',          bg: '#000a00', glow: '#44ff44', q: 'gaming+playthrough' },
    { theta: 300, label: 'FITNESS',         bg: '#0a0000', glow: '#ff4444', q: 'fitness+workout' },
    { theta: 330, label: 'COOKING',         bg: '#060400', glow: '#ffcc88', q: 'cooking+recipes' },
  ];

  const NEXUS_R  = 8.2;   // screen ring radius
  const SCREEN_Y = 2.8;   // screen center height
  const scene = document.querySelector('a-scene');
  const channelLabel = document.getElementById('channel-label');

  scene.addEventListener('loaded', function () {
    SCREENS.forEach(function (s, i) {
      const rad  = s.theta * Math.PI / 180;
      const x    = parseFloat((Math.cos(rad) * NEXUS_R).toFixed(3));
      const z    = parseFloat((Math.sin(rad) * NEXUS_R).toFixed(3));
      const rotY = -(s.theta + 90);
      const url  = 'https://www.youtube.com/results?search_query=' + s.q;

      // container (world pos + rotation so all children face inward)
      const ctr = document.createElement('a-entity');
      ctr.setAttribute('position', x + ' 0 ' + z);
      ctr.setAttribute('rotation', '0 ' + rotY + ' 0');

      // outer frame
      const frame = document.createElement('a-box');
      frame.setAttribute('width',  '2.9');
      frame.setAttribute('height', '2.1');
      frame.setAttribute('depth',  '0.1');
      frame.setAttribute('position', '0 ' + SCREEN_Y + ' 0');
      frame.setAttribute('material', 'color: #08081a; emissive: ' + s.glow + '; emissiveIntensity: 0.14; roughness: 0.3; metalness: 0.88');
      ctr.appendChild(frame);

      // inner bezel glow
      const bezel = document.createElement('a-box');
      bezel.setAttribute('width',  '2.65');
      bezel.setAttribute('height', '1.85');
      bezel.setAttribute('depth',  '0.06');
      bezel.setAttribute('position', '0 ' + SCREEN_Y + ' 0.03');
      bezel.setAttribute('material', 'color: #03030a; emissive: ' + s.glow + '; emissiveIntensity: 0.28');
      ctr.appendChild(bezel);

      // screen (clickable)
      const screen = document.createElement('a-plane');
      screen.setAttribute('class', 'clickable');
      screen.setAttribute('width',  '2.55');
      screen.setAttribute('height', '1.75');
      screen.setAttribute('position', '0 ' + SCREEN_Y + ' 0.07');
      screen.setAttribute('material', 'color: ' + s.bg + '; emissive: ' + s.glow + '; emissiveIntensity: 0.55; roughness: 0; side: double');
      screen.dataset.url   = url;
      screen.dataset.label = s.label;
      ctr.appendChild(screen);

      // channel label text (top of screen)
      const topLabel = document.createElement('a-text');
      topLabel.setAttribute('value', s.label);
      topLabel.setAttribute('position', '0 ' + (SCREEN_Y + 1.08) + ' 0.08');
      topLabel.setAttribute('align', 'center');
      topLabel.setAttribute('color', s.glow);
      topLabel.setAttribute('width', '2.6');
      topLabel.setAttribute('letter-spacing', '3');
      ctr.appendChild(topLabel);

      // status line (bottom)
      const status = document.createElement('a-text');
      status.setAttribute('value', '[ CLICK TO TUNE IN ]');
      status.setAttribute('position', '0 ' + (SCREEN_Y - 1.08) + ' 0.08');
      status.setAttribute('align', 'center');
      status.setAttribute('color', s.glow);
      status.setAttribute('width', '2.0');
      ctr.appendChild(status);

      // animated scan line
      const scanY0 = SCREEN_Y - 0.875;
      const scanY1 = SCREEN_Y + 0.875;
      const scan = document.createElement('a-box');
      scan.setAttribute('width',  '2.55');
      scan.setAttribute('height', '0.022');
      scan.setAttribute('depth',  '0.005');
      scan.setAttribute('position', '0 ' + scanY0 + ' 0.08');
      scan.setAttribute('material', 'color: ' + s.glow + '; emissive: ' + s.glow + '; emissiveIntensity: 4; opacity: 0.6; transparent: true');
      scan.setAttribute('animation',
        'property: position; from: 0 ' + scanY0 + ' 0.08; to: 0 ' + scanY1 + ' 0.08; ' +
        'loop: true; dur: ' + (1400 + i * 180) + '; easing: linear');
      ctr.appendChild(scan);

      // secondary scan line (offset)
      const scan2 = document.createElement('a-box');
      scan2.setAttribute('width',  '2.55');
      scan2.setAttribute('height', '0.012');
      scan2.setAttribute('depth',  '0.004');
      scan2.setAttribute('position', '0 ' + scanY1 + ' 0.08');
      scan2.setAttribute('material', 'color: ' + s.glow + '; emissive: ' + s.glow + '; emissiveIntensity: 2.5; opacity: 0.35; transparent: true');
      scan2.setAttribute('animation',
        'property: position; from: 0 ' + scanY1 + ' 0.08; to: 0 ' + scanY0 + ' 0.08; ' +
        'loop: true; dur: ' + (2100 + i * 130) + '; easing: linear');
      ctr.appendChild(scan2);

      // point light from screen (in world space — added to scene directly)
      const inward = 0.82;
      const light = document.createElement('a-light');
      light.setAttribute('type', 'point');
      light.setAttribute('position', (x * inward) + ' ' + SCREEN_Y + ' ' + (z * inward));
      light.setAttribute('color', s.glow);
      light.setAttribute('intensity', '0.32');
      light.setAttribute('distance', '5');
      light.setAttribute('decay', '2');
      scene.appendChild(light);

      // hover and click
      screen.addEventListener('mouseenter', function () {
        screen.setAttribute('material', 'emissiveIntensity', 1.4);
        channelLabel.textContent = '[ ' + s.label + ' ]';
        channelLabel.style.opacity = 1;
      });
      screen.addEventListener('mouseleave', function () {
        screen.setAttribute('material', 'emissiveIntensity', 0.55);
        channelLabel.style.opacity = 0;
      });
      screen.addEventListener('click', function () {
        window.open(url, '_blank');
      });

      scene.appendChild(ctr);
    });
  });

  document.querySelector('a-scene').addEventListener('loaded', function () {
    var T = window.TEX;
    document.querySelector('#media-walls').setAttribute('material',
      'side: back; src: ' + T.metalPanel + '; repeat: 22 4; roughness: 0.45; metalness: 0.72; color: #8899cc');
    document.querySelector('#media-floor').setAttribute('material',
      'src: ' + T.floorGrate + '; repeat: 14 14; roughness: 0.22; metalness: 0.92; color: #6688cc');
    document.querySelector('#media-ceil').setAttribute('material',
      'src: ' + T.ceilPanel + '; repeat: 14 14; roughness: 0.55; metalness: 0.6; color: #6677bb');
    document.querySelector('#exit-door').addEventListener('click', function () {
      window.location.href = 'index.html';
    });
  });
</script>
</body>
</html>
