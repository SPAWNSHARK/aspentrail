  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; } body { overflow: hidden; background: #000; }
    #wf-fade { position: fixed; inset: 0; background: #0a0705; z-index: 40; pointer-events: none; transition: opacity .5s; }
    #room-prompt { position: fixed; left: 50%; bottom: 150px; transform: translateX(-50%); width: min(86vw, 520px); text-align: center; z-index: 20; font: 600 14px -apple-system, system-ui, sans-serif; color: #ffd9a0; text-shadow: 0 1px 6px #000; opacity: 0; transition: opacity .4s; pointer-events: none; }

<body data-room="core">
  <script>if (/[?&]from=north/.test(location.search)) { document.addEventListener('DOMContentLoaded', function () { var pl = document.getElementById('player'); pl.setAttribute('position', '0 0 -8'); pl.setAttribute('rotation', '0 180 0'); }); }</script>
  <div id="room-prompt"></div>
  <div id="wf-fade"></div>
  <a-scene device-orientation-permission-ui="enabled: false" wayfarer-mobile="radius: 0" light="defaultLightsEnabled: false"
    fog="type: exponential; color: #04080a; density: 0.012" background="color: #02060a" vr-mode-ui="enabled: true"
    renderer="antialias: true; toneMapping: ACESFilmic; exposure: 1.15">
    <a-entity id="player" position="0 0 8" rotation="0 0 0">
      <a-camera id="cam" wasd-controls="acceleration: 22; fly: false" look-controls="pointerLockEnabled: true; touchEnabled: true; magicWindowTrackingEnabled: false" position="0 1.6 0">
        <a-cursor color="#7dffb8" opacity="0.6" fuse="true" fuse-timeout="1500" raycaster="objects: .interactive"></a-cursor>
      </a-camera>
    </a-entity>
    <a-entity id="brain" position="0 5.55 0" scale="0.55 0.55 0.55"></a-entity>
  </a-scene>
  <script src="core-room.js?v=20261128s"></script>
  <script src="interior-v8.js?v=20261127zb"></script>
  <script>window.WAYFARER.door.roomExit('core'); window.WAYFARER.door.roomExit('corenorth');</script>
</body>
