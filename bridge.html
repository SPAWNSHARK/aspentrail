<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SS Wayfarer — Command Bridge</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; }
    #hud {
      position: fixed; top: 0; left: 0; right: 0;
      padding: 14px 20px;
      display: flex; justify-content: space-between; align-items: center;
      color: #cc8833;
      font-family: 'Courier New', monospace;
      font-size: 11px; letter-spacing: 3px; text-transform: uppercase;
      pointer-events: none;
      text-shadow: 0 0 8px #ff6600;
      background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
      z-index: 10;
    }
    #room-prompt {
      position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
      color: #ffcc66; font-family: 'Courier New', monospace;
      font-size: 13px; letter-spacing: 4px; text-transform: uppercase;
      pointer-events: none; text-shadow: 0 0 12px #ff8833;
      opacity: 0; transition: opacity 0.3s ease; white-space: nowrap; z-index: 10;
    }
    #controls-hint {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      color: #554433; font-family: 'Courier New', monospace;
      font-size: 10px; letter-spacing: 2px; pointer-events: none; z-index: 10;
    }
  </style>
</head>
<body>

  <div id="hud">
    <span>SS WAYFARER</span>
    <span>COMMAND BRIDGE — SECTOR 01</span>
    <span>DECK 01</span>
  </div>
  <div id="room-prompt"></div>
  <div id="controls-hint">WASD / DRAG TO LOOK · GAZE OR CLICK TO INTERACT</div>

  <a-scene
    fog="type: exponential; color: #010100; density: 0.025"
    background="color: #010100"
    vr-mode-ui="enabled: true"
    renderer="antialias: true; colorManagement: true">

    <!-- ======================================================
         PLAYER — enters from corridor side (+Z)
    ====================================================== -->
    <a-entity id="player" position="0 0 5.5">
      <a-camera
        wasd-controls="acceleration: 22; fly: false"
        look-controls="pointerLockEnabled: true; touchEnabled: true"
        position="0 1.6 0">
        <a-cursor
          color="#ffcc66" opacity="0.6"
          fuse="true" fuse-timeout="1500"
          raycaster="objects: .interactive">
        </a-cursor>
      </a-camera>
    </a-entity>

    <!-- ======================================================
         ROOM STRUCTURE
    ====================================================== -->

    <!-- Outer floor -->
    <a-circle position="0 0 0" rotation="-90 0 0" radius="8.2"
      color="#0c0a06" roughness="0.9" metalness="0.35">
    </a-circle>

    <!-- Raised inner platform (stepped dais, central area) -->
    <a-circle position="0 0.18 0" rotation="-90 0 0" radius="5.8"
      color="#0f0d08" roughness="0.85" metalness="0.4">
    </a-circle>

    <!-- Ceiling -->
    <a-circle position="0 5.2 0" rotation="90 0 0" radius="8.2"
      color="#060504">
    </a-circle>

    <!-- Curved walls — cylinder rendered from inside -->
    <a-cylinder position="0 2.6 0" radius="8.2" height="5.2"
      open-ended="true"
      material="side: back; color: #0d0b07; roughness: 0.95; metalness: 0.08">
    </a-cylinder>

    <!-- ======================================================
         LIGHTING
    ====================================================== -->

    <!-- Very dim warm ambient -->
    <a-light type="ambient" color="#160e05" intensity="0.3"></a-light>

    <!-- Uplight from central platform edge -->
    <a-light type="point" position="0 0.08 0" color="#ff5500" intensity="0.9" distance="7" decay="2"></a-light>

    <!-- Primary blue wash from the viewscreen -->
    <a-light type="point" position="0 2.2 -5.5" color="#001ecc" intensity="2.5" distance="10" decay="1.5"></a-light>

    <!-- Ceiling dome wash — warm amber -->
    <a-light type="point" position="0 5.0 0" color="#2a1505" intensity="2.0" distance="11" decay="2"></a-light>

    <!-- Station screen glows -->
    <a-light type="point" position="-4.2 1.5 -1.5" color="#002eaa" intensity="0.7" distance="3.5" decay="2"></a-light>
    <a-light type="point" position="-2.2 1.5 -3.9" color="#002eaa" intensity="0.7" distance="3.5" decay="2"></a-light>
    <a-light type="point" position=" 2.2 1.5 -3.9" color="#002eaa" intensity="0.7" distance="3.5" decay="2"></a-light>
    <a-light type="point" position=" 4.2 1.5 -1.5" color="#002eaa" intensity="0.7" distance="3.5" decay="2"></a-light>

    <!-- ======================================================
         FORWARD VIEWSCREEN
    ====================================================== -->

    <!-- Main screen surface -->
    <a-plane position="0 2.5 -7.8" width="12.5" height="4.5"
      color="#000612" emissive="#000420" emissive-intensity="1">
    </a-plane>

    <!-- Subtle scan-line overlay (thin emissive strips) -->
    <a-plane position="0 2.5 -7.78" width="12.5" height="0.02"
      color="#0011aa" emissive="#0011aa" emissive-intensity="0.4"
      animation="property: position; to: 0 4.75 -7.78; from: 0 0.25 -7.78; loop: true; dur: 4000; easing: linear">
    </a-plane>

    <!-- Screen frame top -->
    <a-box position="0 4.77 -7.76" width="13" height="0.12" depth="0.1"
      color="#1a1004" emissive="#ff5500" emissive-intensity="0.4">
    </a-box>
    <!-- Screen frame bottom -->
    <a-box position="0 0.23 -7.76" width="13" height="0.12" depth="0.1"
      color="#1a1004" emissive="#ff5500" emissive-intensity="0.4">
    </a-box>
    <!-- Screen frame sides -->
    <a-box position="-6.26 2.5 -7.76" width="0.1" height="4.5" depth="0.1"
      color="#1a1004" emissive="#ff4400" emissive-intensity="0.3">
    </a-box>
    <a-box position=" 6.26 2.5 -7.76" width="0.1" height="4.5" depth="0.1"
      color="#1a1004" emissive="#ff4400" emissive-intensity="0.3">
    </a-box>

    <!-- ======================================================
         CAPTAIN'S CHAIR — raised dais, center of room
    ====================================================== -->

    <!-- Dais outer step -->
    <a-box position="0 0.09 -1.0" width="3.2" height="0.18" depth="3.0"
      color="#100e08" roughness="0.85">
    </a-box>
    <!-- Dais inner step -->
    <a-box position="0 0.22 -1.0" width="2.2" height="0.22" depth="2.0"
      color="#141108" roughness="0.8">
    </a-box>
    <!-- Dais glow trim -->
    <a-box position="0 0.19 -1.0" width="3.22" height="0.04" depth="3.02"
      color="#ff4400" emissive="#ff4400" emissive-intensity="0.6">
    </a-box>

    <!-- Chair base -->
    <a-box position="0 0.52 -1.0" width="0.18" height="0.3" depth="0.18"
      color="#1a1208">
    </a-box>
    <!-- Chair seat -->
    <a-box position="0 0.82 -1.0" width="1.0" height="0.1" depth="0.85"
      color="#1c1409" emissive="#2a1200" emissive-intensity="0.2">
    </a-box>
    <!-- Chair backrest -->
    <a-box position="0 1.45 -1.38" width="1.0" height="1.3" depth="0.1"
      color="#1c1409" emissive="#3a1800" emissive-intensity="0.15">
    </a-box>
    <!-- Chair headrest -->
    <a-box position="0 2.12 -1.33" width="0.65" height="0.35" depth="0.12"
      color="#1a1208" emissive="#441800" emissive-intensity="0.2">
    </a-box>
    <!-- Left armrest -->
    <a-box position="-0.56 0.92 -1.0" width="0.1" height="0.08" depth="0.75"
      color="#221608" emissive="#ff4400" emissive-intensity="0.5">
    </a-box>
    <!-- Right armrest -->
    <a-box position=" 0.56 0.92 -1.0" width="0.1" height="0.08" depth="0.75"
      color="#221608" emissive="#ff4400" emissive-intensity="0.5">
    </a-box>
    <!-- Chair top glow strip -->
    <a-box position="0 2.32 -1.32" width="0.8" height="0.04" depth="0.09"
      color="#ff8800" emissive="#ff8800" emissive-intensity="2.5">
    </a-box>

    <!-- Invisible interactive seat surface -->
    <a-box id="captains-chair" class="interactive"
      position="0 0.88 -1.0" width="1.0" height="0.06" depth="0.85"
      material="opacity: 0; transparent: true">
    </a-box>

    <!-- ======================================================
         HOLOGRAPHIC ORB above captain's chair
    ====================================================== -->
    <a-sphere position="0 3.1 -1.0" radius="0.22"
      color="#000a22" emissive="#0033ff" emissive-intensity="0.9"
      animation="property: rotation; to: 0 360 0; loop: true; dur: 9000; easing: linear">
    </a-sphere>
    <a-torus position="0 3.1 -1.0" radius="0.48" tube="0.018"
      color="#0044ff" emissive="#0044ff" emissive-intensity="0.7"
      animation="property: rotation; to: 60 360 20; loop: true; dur: 5500; easing: linear">
    </a-torus>
    <a-torus position="0 3.1 -1.0" radius="0.35" tube="0.012"
      color="#0066ff" emissive="#0066ff" emissive-intensity="0.5"
      animation="property: rotation; to: -30 360 70; loop: true; dur: 7000; easing: linear">
    </a-torus>

    <!-- ======================================================
         CREW STATIONS — 4 robots in forward arc
         Radius 4.6 from center
    ====================================================== -->

    <!-- STATION 1: Far left  (-70° → x=-4.32, z=-1.57) -->
    <a-entity position="-4.32 0.18 -1.57" rotation="0 32 0">
      <!-- Console surface -->
      <a-box position="0 0.52 0.52" width="1.15" height="0.08" depth="0.72"
        color="#0d0c07" emissive="#001eaa" emissive-intensity="0.35">
      </a-box>
      <!-- Console screen -->
      <a-plane position="0 0.88 0.24" rotation="-38 0 0" width="0.92" height="0.55"
        color="#000c20" emissive="#0033aa" emissive-intensity="0.8">
      </a-plane>
      <!-- Robot body -->
      <a-box position="0 0.88 -0.08" width="0.4" height="0.58" depth="0.28"
        color="#151008" emissive="#1a0d00" emissive-intensity="0.18">
      </a-box>
      <!-- Robot head -->
      <a-box position="0 1.35 -0.08" width="0.28" height="0.22" depth="0.22"
        color="#120e06">
      </a-box>
      <!-- Eye strip -->
      <a-box position="0 1.36 0.025" width="0.2" height="0.033" depth="0.02"
        color="#ff7700" emissive="#ff5500" emissive-intensity="2.0">
      </a-box>
      <!-- Shoulder lights -->
      <a-box position="-0.22 1.06 -0.08" width="0.03" height="0.03" depth="0.03"
        color="#ff2200" emissive="#ff2200" emissive-intensity="1.8">
      </a-box>
      <a-box position=" 0.22 1.06 -0.08" width="0.03" height="0.03" depth="0.03"
        color="#ff2200" emissive="#ff2200" emissive-intensity="1.8">
      </a-box>
    </a-entity>

    <!-- STATION 2: Left center  (-30° → x=-2.3, z=-3.99) -->
    <a-entity position="-2.3 0.18 -3.99" rotation="0 13 0">
      <a-box position="0 0.52 0.52" width="1.15" height="0.08" depth="0.72"
        color="#0d0c07" emissive="#001eaa" emissive-intensity="0.35">
      </a-box>
      <a-plane position="0 0.88 0.24" rotation="-38 0 0" width="0.92" height="0.55"
        color="#000c20" emissive="#0044cc" emissive-intensity="0.8">
      </a-plane>
      <a-box position="0 0.88 -0.08" width="0.4" height="0.58" depth="0.28"
        color="#151008" emissive="#1a0d00" emissive-intensity="0.18">
      </a-box>
      <a-box position="0 1.35 -0.08" width="0.28" height="0.22" depth="0.22"
        color="#120e06">
      </a-box>
      <a-box position="0 1.36 0.025" width="0.2" height="0.033" depth="0.02"
        color="#ff7700" emissive="#ff5500" emissive-intensity="2.0">
      </a-box>
      <a-box position="-0.22 1.06 -0.08" width="0.03" height="0.03" depth="0.03"
        color="#ff2200" emissive="#ff2200" emissive-intensity="1.8">
      </a-box>
      <a-box position=" 0.22 1.06 -0.08" width="0.03" height="0.03" depth="0.03"
        color="#ff2200" emissive="#ff2200" emissive-intensity="1.8">
      </a-box>
    </a-entity>

    <!-- STATION 3: Right center  (+30° → x=+2.3, z=-3.99) -->
    <a-entity position="2.3 0.18 -3.99" rotation="0 -13 0">
      <a-box position="0 0.52 0.52" width="1.15" height="0.08" depth="0.72"
        color="#0d0c07" emissive="#001eaa" emissive-intensity="0.35">
      </a-box>
      <a-plane position="0 0.88 0.24" rotation="-38 0 0" width="0.92" height="0.55"
        color="#000c20" emissive="#0033aa" emissive-intensity="0.8">
      </a-plane>
      <a-box position="0 0.88 -0.08" width="0.4" height="0.58" depth="0.28"
        color="#151008" emissive="#1a0d00" emissive-intensity="0.18">
      </a-box>
      <a-box position="0 1.35 -0.08" width="0.28" height="0.22" depth="0.22"
        color="#120e06">
      </a-box>
      <a-box position="0 1.36 0.025" width="0.2" height="0.033" depth="0.02"
        color="#ff7700" emissive="#ff5500" emissive-intensity="2.0">
      </a-box>
      <a-box position="-0.22 1.06 -0.08" width="0.03" height="0.03" depth="0.03"
        color="#ff2200" emissive="#ff2200" emissive-intensity="1.8">
      </a-box>
      <a-box position=" 0.22 1.06 -0.08" width="0.03" height="0.03" depth="0.03"
        color="#ff2200" emissive="#ff2200" emissive-intensity="1.8">
      </a-box>
    </a-entity>

    <!-- STATION 4: Far right  (+70° → x=+4.32, z=-1.57) -->
    <a-entity position="4.32 0.18 -1.57" rotation="0 -32 0">
      <a-box position="0 0.52 0.52" width="1.15" height="0.08" depth="0.72"
        color="#0d0c07" emissive="#001eaa" emissive-intensity="0.35">
      </a-box>
      <a-plane position="0 0.88 0.24" rotation="-38 0 0" width="0.92" height="0.55"
        color="#000c20" emissive="#0044cc" emissive-intensity="0.8">
      </a-plane>
      <a-box position="0 0.88 -0.08" width="0.4" height="0.58" depth="0.28"
        color="#151008" emissive="#1a0d00" emissive-intensity="0.18">
      </a-box>
      <a-box position="0 1.35 -0.08" width="0.28" height="0.22" depth="0.22"
        color="#120e06">
      </a-box>
      <a-box position="0 1.36 0.025" width="0.2" height="0.033" depth="0.02"
        color="#ff7700" emissive="#ff5500" emissive-intensity="2.0">
      </a-box>
      <a-box position="-0.22 1.06 -0.08" width="0.03" height="0.03" depth="0.03"
        color="#ff2200" emissive="#ff2200" emissive-intensity="1.8">
      </a-box>
      <a-box position=" 0.22 1.06 -0.08" width="0.03" height="0.03" depth="0.03"
        color="#ff2200" emissive="#ff2200" emissive-intensity="1.8">
      </a-box>
    </a-entity>

    <!-- ======================================================
         CEILING RING FIXTURES
    ====================================================== -->
    <a-torus position="0 5.15 0" rotation="90 0 0"
      radius="2.8" tube="0.055"
      color="#1a1004" emissive="#ff5500" emissive-intensity="1.0">
    </a-torus>
    <a-torus position="0 5.18 0" rotation="90 0 0"
      radius="5.8" tube="0.04"
      color="#1a0e02" emissive="#ff4400" emissive-intensity="0.45">
    </a-torus>

    <!-- ======================================================
         FLOOR RING DETAILS
    ====================================================== -->
    <a-torus position="0 0.01 0" rotation="-90 0 0"
      radius="5.8" tube="0.045"
      color="#331100" emissive="#ff4400" emissive-intensity="0.55">
    </a-torus>
    <a-torus position="0 0.01 0" rotation="-90 0 0"
      radius="3.2" tube="0.03"
      color="#221100" emissive="#ff5500" emissive-intensity="0.45">
    </a-torus>
    <a-torus position="0 0.19 0" rotation="-90 0 0"
      radius="5.8" tube="0.025"
      color="#441a00" emissive="#ff6600" emissive-intensity="0.3">
    </a-torus>

    <!-- ======================================================
         WALL TRIM BANDS
    ====================================================== -->
    <a-torus position="0 1.0 0" rotation="-90 0 0"
      radius="8.15" tube="0.045"
      color="#1a0e04" emissive="#ff4400" emissive-intensity="0.18">
    </a-torus>
    <a-torus position="0 3.6 0" rotation="-90 0 0"
      radius="8.15" tube="0.045"
      color="#1a0e04" emissive="#ff4400" emissive-intensity="0.18">
    </a-torus>

    <!-- ======================================================
         CORRIDOR EXIT — back of room (+Z side)
    ====================================================== -->
    <!-- Exit door frame -->
    <a-box position="0 1.5 7.9" width="2.2" height="3.0" depth="0.12"
      color="#0e0c08" emissive="#331100" emissive-intensity="0.15">
    </a-box>
    <!-- Exit door face (interactive) -->
    <a-box id="exit-panel" class="interactive"
      position="0 1.3 7.92" width="1.8" height="2.5" depth="0.06"
      color="#0a0805" emissive="#1a0800" emissive-intensity="0.4">
    </a-box>
    <!-- Exit glow strip -->
    <a-box position="0 2.65 7.86" width="1.8" height="0.06" depth="0.1"
      color="#ff6600" emissive="#ff6600" emissive-intensity="2.0">
    </a-box>
    <a-text value="← CORRIDOR" position="0 2.88 7.86"
      align="center" color="#ffcc66" width="3.2" letter-spacing="2">
    </a-text>

  </a-scene>

  <script>
    const prompt = document.getElementById('room-prompt');

    function showPrompt(text, color) {
      prompt.textContent = text;
      prompt.style.color = color || '#ffcc66';
      prompt.style.textShadow = `0 0 12px ${color || '#ff8833'}`;
      prompt.style.opacity = '1';
    }
    function hidePrompt() { prompt.style.opacity = '0'; }

    const chair = document.getElementById('captains-chair');
    chair.addEventListener('mouseenter', () => showPrompt('[ ENGAGE FLIGHT MODE ]', '#ffaa33'));
    chair.addEventListener('mouseleave', hidePrompt);
    chair.addEventListener('click', () => {
      showPrompt('FLIGHT SIMULATION — COMING SOON', '#ffaa33');
      setTimeout(hidePrompt, 2200);
    });

    const exit = document.getElementById('exit-panel');
    exit.addEventListener('mouseenter', () => {
      showPrompt('[ RETURN TO CORRIDOR ]', '#ffcc66');
      exit.setAttribute('material', 'emissiveIntensity', 1.0);
    });
    exit.addEventListener('mouseleave', () => {
      hidePrompt();
      exit.setAttribute('material', 'emissiveIntensity', 0.4);
    });
    exit.addEventListener('click', () => { window.location.href = 'index.html'; });
  </script>

</body>
</html>
