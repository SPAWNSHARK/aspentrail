<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SS Wayfarer — Hiveport</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#120c08">
  <meta name="apple-mobile-web-app-title" content="SS Wayfarer">
  <link rel="apple-touch-icon" sizes="180x180" href="/aspentrail/icons/apple-touch-icon.png?v=2">
  <link rel="icon" href="/aspentrail/icons/favicon.ico?v=2">
  <script>if (/[?&]from=dock/.test(location.search)) document.documentElement.className += ' from-dock';</script>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="mobile.js?v=20261126z"></script>
  <script src="life.js?v=20261126z"></script>
  <script src="manual.js?v=20261126z"></script>
  <script src="menubar.js?v=20261126z"></script>
  <script src="sound.js?v=20261126z"></script>
  <script src="avatar.js?v=20261126z"></script>
  <script src="lcars.js?v=20261126z"></script>
  <script src="missions.js?v=20261126z"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; }
    #jump { position:fixed; inset:0; z-index:60; pointer-events:none; opacity:0; background:radial-gradient(circle,#ffffff,#dff0ff 45%,#9fc4ff); }
    html.from-dock, html.from-dock body { background:#dff0ff; } html.from-dock #jump { opacity:1; }
    .panel { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); z-index:50; display:none; width:min(88vw,380px); max-height:84vh; overflow:auto; padding:18px; border-radius:22px;
      background:linear-gradient(140deg,rgba(255,255,255,.14),rgba(255,255,255,.03)),rgba(10,24,14,.6); -webkit-backdrop-filter:blur(22px) saturate(180%); backdrop-filter:blur(22px) saturate(180%);
      border:1px solid rgba(170,255,190,.25); box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 16px 40px rgba(0,0,0,.5); color:#fff; font:500 14px -apple-system,system-ui,sans-serif; }
    .panel h2 { font:700 13px -apple-system,system-ui,sans-serif; letter-spacing:3px; color:#b8ffcc; margin-bottom:10px; text-align:center; }
    .panel p { color:#e0f0e4; font-size:13px; line-height:1.45; margin-bottom:12px; text-align:center; }
    .panel p.say { font-size:15px; color:#fff; font-style:italic; }
    .panel button { display:block; width:100%; margin:8px 0 0; padding:12px; border-radius:14px; border:1px solid rgba(255,255,255,.22); background:rgba(255,255,255,.08); color:#fff; font:600 14px -apple-system,system-ui,sans-serif; text-align:left; }
    .panel button small { display:block; color:#cfe8d6; font-weight:400; font-size:12px; margin-top:2px; }
    .panel button.done { opacity:.45; } .panel button.cur { border-color:#9fffb8; background:rgba(120,255,160,.15); }
    .panel button.close { text-align:center; background:none; border-color:rgba(255,255,255,.12); color:#ccc; }
    #toast { position:fixed; left:50%; top:calc(40px + env(safe-area-inset-top,0px)); transform:translateX(-50%); z-index:58; padding:10px 16px; border-radius:16px; background:rgba(20,30,20,.6); border:1px solid rgba(140,255,170,.4); color:#c8ffd8; font:600 13px -apple-system,system-ui,sans-serif; opacity:0; transition:opacity .5s; pointer-events:none; -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); text-align:center; max-width:88vw; }
    canvas.a-canvas { transition: filter 1.5s; }
    body.tipsy canvas.a-canvas { animation: tipsy 6s ease-in-out infinite; }
    @keyframes tipsy { 0%,100% { filter: hue-rotate(0deg) saturate(1.2); transform: rotate(0deg) scale(1.02); } 50% { filter: hue-rotate(40deg) saturate(1.6) blur(.6px); transform: rotate(.6deg) scale(1.03); } }
    #loading { position:fixed; left:50%; bottom:calc(120px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); z-index:40; color:#b8ffcc; font:600 12px -apple-system,system-ui,sans-serif; letter-spacing:2px; opacity:.85; transition:opacity .6s; pointer-events:none; }
  </style>
</head>
<body>
<div id="jump"></div>
<div id="toast"></div>
<div id="loading">THE HIVEPORT IS WAKING…</div>
<div class="panel" id="bar-menu">
  <h2>THE RESIN SPIRE</h2>
  <p class="say" id="bar-line"></p>
  <div id="bar-list"></div>
  <button class="close" data-d="">Maybe later</button>
</div>
<div class="panel" id="talk">
  <h2 id="talk-who">K'VETAR</h2>
  <p class="say" id="talk-line"></p>
  <div id="talk-list"></div>
</div>
<div class="panel" id="shop">
  <h2 id="shop-name">SHOP</h2>
  <p class="say" id="shop-line"></p>
  <p id="shop-wallet"></p>
  <div id="shop-list"></div>
  <button class="close" id="shop-close">Leave</button>
</div>
<div class="panel" id="job-board">
  <h2>HIVEPORT JOB BOARD</h2>
  <p id="job-head"></p>
  <div id="job-list"></div>
  <button class="close" id="job-close">Close</button>
</div>

<a-scene device-orientation-permission-ui="enabled: false" wayfarer-mobile="radius: 0" wf-hive light="defaultLightsEnabled: false"
  background="color: #020604" vr-mode-ui="enabled: true" renderer="antialias: true; toneMapping: ACESFilmic; exposure: 1.1">
  <a-entity id="player" position="0 0 0">
    <a-camera id="cam" fov="80" near="0.05" far="400" wasd-controls="acceleration: 20; fly: false" look-controls="pointerLockEnabled: true; touchEnabled: true; magicWindowTrackingEnabled: false" position="0 1.6 19.2">
      <a-cursor color="#9fffb8" opacity="0.6" fuse="true" fuse-timeout="1500" raycaster="objects: .clickable"></a-cursor>
    </a-camera>
  </a-entity>
  <a-entity id="bartender" class="clickable"></a-entity>
  <a-entity id="board" class="clickable"></a-entity>
  <a-entity id="airlock" class="clickable"></a-entity>
</a-scene>

<script>
// THE HIVEPORT (user, Nov 26) — the K'Vetar trade station's venue, from the user's Hiveport prototype pack:
// the 96 × 44 m deck (central nexus with the Resin Spire bar and holo stage, plus eight side zones), rigged K'Vetar crowd
// (male + female rigs, one load each, cloned per NPC with their KHR_materials_variants caste/body/eye colours), the pack's
// grid-A* crowd (hiveport/systems/crowd.mjs) walking between its 42 drink/dance/social/game targets and steering round you,
// a bartender behind the bar (tap → drinks, Serve_Drink with the glass in hand), a dancing violet hologram on the stage,
// K'Vetar small talk from dialogue.json, the contracts job board, and the airlock home. Collision = layout.json obstacles.
// MUSIC (user, Nov 26 — "like Afterlife in Mass Effect 2"): an ORIGINAL dark electro-industrial loop (tools/make-club-loop.py →
// hiveport/audio/hiveport_club_loop.m4a/.mp3, 124 BPM, A minor), always on in the background,
// a little louder near the holo stage, under the crowd wash, station hum, bar sounds and K'Vetar voices (WF_SOUND.alien).
(function () {
  var THREE = AFRAME.THREE, sc = document.querySelector('a-scene'), MOB = window.WAYFARER && window.WAYFARER.mobile;
  var LOADER = new THREE.GLTFLoader(), NPCS = [], BAR = null, HOLO = null, CROWD = null, LAYOUT = null, DLG = null, DRINKS = {}, AUD = {}, ANIM = [];
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
  function load(u) { return new Promise(function (res, rej) { LOADER.load(u, res, undefined, rej); }); }
  function toast(t) { var e = document.getElementById('toast'); e.innerHTML = t; e.style.opacity = 1; clearTimeout(toast.t); toast.t = setTimeout(function () { e.style.opacity = 0; }, 5000); }

  // ── sound: the pack's loops + one-shots (transcoded to m4a for iOS); start on the first tap, honour the mute ──
  function sfx(n, v) { try { if (window.WF_SOUND && WF_SOUND.muted()) return; var a = new Audio('hiveport/audio/' + n + '.m4a'); a.volume = v || 0.6; a.play().catch(function () {}); } catch (e) {} }
  // BACKGROUND AUDIO through Web Audio gains (iOS Safari ignores <audio>.volume). The context is made at load and the loops are
  // decoded straight away; EVERY touch/click/key nudges it awake until it runs (iOS only unlocks audio on touchend/click — the old
  // code tried once on pointerdown and gave up, which is why the music never played on the iPhone). Music is always on.
  var C0 = window.AudioContext || window.webkitAudioContext;
  window.__hiveAudio = AUD;   /* debug handle */
  if (C0) (function () {
    var ctx = AUD.ctx = new C0(), master = ctx.createGain(); master.connect(ctx.destination);
    function decode(name, ext) { return fetch('hiveport/audio/' + name + '.' + ext).then(function (r) { if (!r.ok) throw 0; return r.arrayBuffer(); })
      .then(function (ab) { return new Promise(function (res, rej) { ctx.decodeAudioData(ab, res, rej); }); }); }
    [['hiveport_club_loop', 0.34], ['crowd_wash_loop', 0.3], ['station_hum_loop', 0.18]].forEach(function (q) {
      var g = ctx.createGain(); g.gain.value = q[1]; g.connect(master);
      AUD[q[0]] = { set volume(v) { g.gain.setTargetAtTime(v, ctx.currentTime, 0.4); } };
      decode(q[0], 'm4a').catch(function () { return decode(q[0], 'mp3'); })
        .then(function (buf) { var src = ctx.createBufferSource(); src.buffer = buf; src.loop = true; src.connect(g); src.start(); if (q[0] === 'hiveport_club_loop') { AUD.musicAt = ctx.currentTime; AUD.musicLen = buf.duration; } AUD.playing = (AUD.playing || 0) + 1; })
        .catch(function (e) { console.warn('hiveport audio', q[0], e); });
    });
    function wake() { if (ctx.state !== 'running') ctx.resume(); }
    ['touchstart', 'touchend', 'pointerdown', 'mousedown', 'click', 'keydown'].forEach(function (n) { addEventListener(n, wake, { capture: true, passive: true }); });
    wake();
    setInterval(function () { var m = window.WF_SOUND && WF_SOUND.muted(); master.gain.setTargetAtTime(m || document.hidden ? 0 : 1, ctx.currentTime, 0.1); }, 300);
  }());
  if (window.WF_SOUND) WF_SOUND.hum(false);

  // ── SkeletonUtils.clone (not bundled with A-Frame): each NPC gets its own bones ──
  function parallel(a, b, f) { f(a, b); for (var i = 0; i < a.children.length; i++) parallel(a.children[i], b.children[i], f); }
  function cloneSkinned(src) {
    var srcOf = new Map(), cloneOf = new Map(), c = src.clone();
    parallel(src, c, function (a, b) { srcOf.set(b, a); cloneOf.set(a, b); });
    c.traverse(function (n) { if (!n.isSkinnedMesh) return; var s = srcOf.get(n); n.skeleton = s.skeleton.clone(); n.bindMatrix.copy(s.bindMatrix); n.skeleton.bones = s.skeleton.bones.map(function (b) { return cloneOf.get(b); }); n.bind(n.skeleton, n.bindMatrix); });
    return c;
  }
  // ── KHR_materials_variants: per-mesh-name mappings, materials resolved through the loader's parser ──
  function variantKit(gltf) {
    var json = gltf.parser.json, names = json.extensions.KHR_materials_variants.variants.map(function (v) { return v.name; }), map = {}, need = {};
    json.nodes.forEach(function (n) { if (n.mesh == null) return; var pr = json.meshes[n.mesh].primitives[0], ext = pr.extensions && pr.extensions.KHR_materials_variants; if (!ext) return; map[n.name] = ext.mappings; ext.mappings.forEach(function (m) { need[m.material] = 1; }); });
    var mats = {};
    return Promise.all(Object.keys(need).map(function (i) { return gltf.parser.getDependency('material', +i).then(function (m) { mats[i] = m; }); })).then(function () {
      return { names: names, apply: function (root, vi) { root.traverse(function (o) { if (!o.isMesh) return; var mm = map[o.name]; if (!mm) return; for (var k = 0; k < mm.length; k++) if (mm[k].variants.indexOf(vi) >= 0) { o.material = mats[mm[k].material]; return; } }); } };
    });
  }
  function chooseVariant(names, female) {                      // caste mix: mostly civilians and soldiers, few commanders, rare generals
    var crest = female ? 'purple_female' : (function (r) { return r < 0.45 ? 'blue_civilian_male' : r < 0.75 ? 'yellow_soldier' : r < 0.93 ? 'orange_commander' : 'red_general_king'; }(Math.random()));
    var eye = (function (r) { return r < 0.55 ? 'yellow' : r < 0.8 ? 'blue' : r < 0.93 ? 'red' : 'black'; }(Math.random()));
    var all = names.map(function (n, i) { return [n, i]; }), opts = all.filter(function (q) { return q[0].indexOf(crest) >= 0 && q[0].indexOf(eye + ' eyes') >= 0; });
    if (!opts.length) opts = all.filter(function (q) { return q[0].indexOf(crest) >= 0; });
    var q = pick(opts.length ? opts : all); return { index: q[1], crest: crest };
  }
  var CASTE = { blue_civilian_male: ['civilian', 'K’VETAR CIVILIAN'], yellow_soldier: ['soldier', 'K’VETAR SOLDIER'], orange_commander: ['commander', 'K’VETAR COMMANDER'], red_general_king: ['general', 'K’VETAR GENERAL'], purple_female: ['female', 'K’VETAR MATRON'] };

  function makeActor(base, kit, vi) {
    var m = cloneSkinned(base.scene); if (kit) kit.apply(m, vi); m.userData.noCollide = true;
    m.traverse(function (o) { if (o.isMesh) { o.frustumCulled = false; o.userData.noCollide = true; } });
    var mx = new THREE.AnimationMixer(m), acts = {}; base.animations.forEach(function (c) { acts[c.name] = mx.clipAction(c); });
    sc.object3D.add(m);
    return { model: m, mixer: mx, actions: acts, hand: m.getObjectByName('R_hand'), current: null, drink: null };
  }
  function play(e, name, once) {
    if (e.current === name) return; var act = e.actions[name] || e.actions.Idle; if (!act) return;
    Object.keys(e.actions).forEach(function (k) { if (e.actions[k] !== act) e.actions[k].fadeOut(0.25); });
    act.reset(); act.setLoop(once ? THREE.LoopOnce : THREE.LoopRepeat, once ? 1 : Infinity); act.clampWhenFinished = !!once; act.fadeIn(0.25).play(); e.current = name;
  }
  function holdDrink(e, on, id) {
    if (on && !e.drink && e.hand) { var t = DRINKS[id] || DRINKS.amber_resin; if (!t) return; e.drink = t.clone(true); e.drink.position.set(0.015, -0.09, 0.085); e.drink.scale.setScalar(1.35); e.hand.add(e.drink); }
    else if (!on && e.drink) { e.drink.removeFromParent(); e.drink = null; }
  }
  function invisibleBox(w, h, d) { return new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false })); }

  function build() {
    Promise.all([fetch('hiveport/layout.json').then(function (r) { return r.json(); }), fetch('hiveport/dialogue.json').then(function (r) { return r.json(); }), import('./hiveport/systems/crowd.mjs')]).then(function (R) {
      LAYOUT = R[0]; DLG = R[1]; var Crowd = R[2].Crowd;
      // walls/props as footprints for the player (mobile.js), the hall outline as the room bound
      window.WAYFARER.extraSolids = LAYOUT.obstacles.map(function (o) { return [o.min[0], o.min[1], o.max[0], o.max[1]]; });
      window.WAYFARER.bounds = [[-48, -22], [48, -22], [48, 22], [-48, 22]];
      var mob = sc.components['wayfarer-mobile']; if (mob && mob.scanSolids) mob.scanSolids();
      // a chitin-and-amber environment so the metal and glass have something to reflect
      try { var es = new THREE.Scene(); es.add(new THREE.Mesh(new THREE.SphereGeometry(10, 32, 16), new THREE.ShaderMaterial({ side: THREE.BackSide,
        vertexShader: 'varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
        fragmentShader: 'varying vec3 vP; void main(){ vec3 d = normalize(vP); float h = d.y; vec3 c = mix(vec3(0.03,0.05,0.03), vec3(0.75,0.5,0.22), smoothstep(-0.1, 0.8, h)); c += vec3(0.55,0.2,0.9) * pow(max(0.0, sin(atan(d.x, d.z) * 3.0)), 8.0) * 0.6 * (1.0 - abs(h)); gl_FragColor = vec4(c, 1.0); }' })));
        var pm = new THREE.PMREMGenerator(sc.renderer); sc.object3D.environment = pm.fromScene(es, 0.04).texture; pm.dispose(); } catch (e) {}
      sc.object3D.add(new THREE.HemisphereLight(0xcab9f0, 0x25321b, 1.0));
      LAYOUT.lights.forEach(function (l) { var p = new THREE.PointLight(l.color, Math.min(3, l.intensity / 330), l.distance * 1.2, 1.6); p.position.fromArray(l.position); sc.object3D.add(p); });
      // the deck itself + ceilings over the open-top cutaway rooms (dark chitin with an amber honeycomb)
      load('hiveport/rooms/Hiveport_complete.glb?v=1').then(function (g) {
        g.scene.traverse(function (o) { if (o.isMesh) { o.userData.noCollide = true; [].concat(o.material).forEach(function (m) { m.envMapIntensity = 0.8; }); } }); g.scene.userData.noCollide = true; sc.object3D.add(g.scene);
        var cc = document.createElement('canvas'); cc.width = cc.height = 256; var x = cc.getContext('2d'); x.fillStyle = '#0d120c'; x.fillRect(0, 0, 256, 256);
        for (var i = 0; i < 6; i++) for (var j = 0; j < 6; j++) { x.beginPath(); for (var k = 0; k <= 6; k++) { var a = k / 6 * Math.PI * 2; x[k ? 'lineTo' : 'moveTo'](i * 43 + 21 + Math.cos(a) * 18, j * 43 + 21 + Math.sin(a) * 18); } x.strokeStyle = 'rgba(200,150,60,0.35)'; x.lineWidth = 2; x.stroke(); }
        LAYOUT.rooms.forEach(function (r) { var b = r.bounds, w = b[2] - b[0], d = b[3] - b[1], t = new THREE.CanvasTexture(cc); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(w / 6, d / 6);
          var c = new THREE.Mesh(new THREE.PlaneGeometry(w, d, 4, 4), new THREE.MeshStandardMaterial({ map: t, roughness: 0.8, metalness: 0.3, side: THREE.DoubleSide, emissive: 0x2a1a06, emissiveIntensity: 0.6 }));
          c.rotation.x = Math.PI / 2; c.position.set((b[0] + b[2]) / 2, r.height + 0.02, (b[1] + b[3]) / 2); c.userData.noCollide = true; sc.object3D.add(c); });
        document.getElementById('loading').style.opacity = 0;
      });
      ['amber_resin', 'voidfruit', 'neural_mist', 'crimson_spore', 'luminous_brew', 'quorum_blend'].forEach(function (id) { load('hiveport/props/drink_' + id + '.glb').then(function (g) { DRINKS[id] = g.scene; }); });
      // the crowd
      CROWD = new Crowd(LAYOUT);
      Promise.all([load('hiveport/characters/Kvetar_male_rigged.glb?v=1'), load('hiveport/characters/Kvetar_female_rigged.glb?v=1')]).then(function (G) {
        return Promise.all([variantKit(G[0]), variantKit(G[1])]).then(function (K) {
          var N = MOB ? 12 : 20, grid = [], tries = 0;
          for (var z = -18; z < 20; z += 2.5) for (var x = -44; x < 46; x += 2.5) if (CROWD.free([x, z]) && (Math.abs(x) < 21 || Math.random() < 0.35)) grid.push([x, z]);
          while (NPCS.length < N && grid.length && tries++ < 200) {
            var p = grid.splice(Math.floor(Math.random() * grid.length), 1)[0], a = CROWD.add('npc' + NPCS.length, p); if (!a) continue;
            var fem = Math.random() < 0.22, v = chooseVariant(K[fem ? 1 : 0].names, fem), e = makeActor(G[fem ? 1 : 0], K[fem ? 1 : 0], v.index);
            e.a = a; e.caste = v.crest; e.hit = hitBox(e); NPCS.push(e);
          }
          // the bartender: behind the Resin Spire, facing the stools
          var bi = K[0].names.indexOf('dark_green / blue eyes / blue_civilian_male');
          BAR = makeActor(G[0], K[0], bi < 0 ? 3 : bi); BAR.model.position.set(0, 0, 7.9); BAR.model.rotation.y = 0; play(BAR, 'Idle');
          var bh = document.getElementById('bartender'); bh.setObject3D('mesh', invisibleBox(1.4, 3.2, 1.2)); bh.object3D.position.set(0, 1.6, 8.2);
          buildShops(G[0], K[0]);
        });
      });
      // the violet holographic performer on the stage
      load('hiveport/characters/Kvetar_holographic_performer.glb?v=1').then(function (g) {
        g.scene.position.fromArray(LAYOUT.hologram); g.scene.traverse(function (o) { o.userData.noCollide = true; if (o.isMesh) o.frustumCulled = false; }); sc.object3D.add(g.scene);
        var mx = new THREE.AnimationMixer(g.scene), c = THREE.AnimationClip.findByName(g.animations, 'Dance'); if (c) mx.clipAction(c).play(); HOLO = { s: g.scene, mx: mx };
      });
      buildAirlockAndBoard();
    });
  }
  function hitBox(e) {                                          // tap target per NPC (raycasting 56k-tri skinned meshes would be too slow)
    var h = document.createElement('a-entity'); h.setAttribute('class', 'clickable'); sc.appendChild(h);
    h.setObject3D('mesh', invisibleBox(1.0, 3.2, 1.0)); h.addEventListener('click', function () { talkTo(e); }); return h;
  }

  // ── SHOPS (user, Nov 26): three K'Vetar traders along the TRADE LOUNGE's west wall (x −46, z −8.5 / −5.5 / −2.5) ──
  //    CHITIN & THRUST (ship upgrades + hull paint → localStorage 'wf-upgrades', read by minigame.html and shipskin.js) ·
  //    PURR & PLENTY (cat treats, catnip) · ODDS & ENDS (curios → trophies for the Captain's quarters). Wallet = WF_LIFE.
  var UPG_KEY = 'wf-upgrades';
  function upg() { try { return JSON.parse(localStorage.getItem(UPG_KEY) || '{}'); } catch (e) { return {}; } }
  function setUpg(u) { try { localStorage.setItem(UPG_KEY, JSON.stringify(u)); } catch (e) {} }
  var PAINT_NAMES = { copper: 'Copper (stock)', gunmetal: 'Gunmetal', verdigris: 'Verdigris', gold: 'Gold leaf', crimson: 'Crimson' };
  var SHOPS = [
    { id: 'ship', name: 'CHITIN & THRUST', sub: 'Shipwright', z: -8.5, col: '#7fffb0', caste: 'orange_commander', line: 'Your hull sings of copper, Captain. Shall we make it sing louder?' },
    { id: 'pets', name: 'PURR & PLENTY', sub: 'Companion goods', z: -5.5, col: '#ff9ad0', caste: 'purple_female', line: 'Small furred ones on your ship? The hive approves. Treats?' },
    { id: 'curio', name: 'ODDS & ENDS', sub: 'Curios & trophies', z: -2.5, col: '#ffd27a', caste: 'blue_civilian_male', line: 'Every object here has outlived three owners. Perhaps you will be the fourth.' }
  ];
  function shopItems(id) {
    var u = upg(), L = window.WF_LIFE;
    if (id === 'ship') {
      var out = [], e = u.engine || 0, sh = u.shield || 0, g = u.gun || 0, owned = u.paints || ['copper'];
      if (e < 3) out.push({ name: 'Engine tuning Mk ' + ['I', 'II', 'III'][e], note: '+12% flight speed (now +' + (e * 12) + '%)', price: [400, 900, 1800][e], buy: function () { u.engine = e + 1; setUpg(u); } });
      else out.push({ name: 'Engines', note: 'Fully tuned (+36%)', done: true });
      if (sh < 2) out.push({ name: 'Shield lattice Mk ' + ['I', 'II'][sh], note: '+1 hull bar in combat (now ' + (3 + sh) + ')', price: [600, 1400][sh], buy: function () { u.shield = sh + 1; setUpg(u); } });
      else out.push({ name: 'Shields', note: 'Maxed (5 hull bars)', done: true });
      if (g < 2) out.push({ name: 'Cannon capacitors Mk ' + ['I', 'II'][g], note: 'Fire 20% faster', price: [500, 1200][g], buy: function () { u.gun = g + 1; setUpg(u); } });
      else out.push({ name: 'Cannons', note: 'Maxed', done: true });
      Object.keys(PAINT_NAMES).forEach(function (k) {
        var have = owned.indexOf(k) >= 0, cur = (u.paint || 'copper') === k;
        out.push({ name: 'Hull paint: ' + PAINT_NAMES[k], note: cur ? 'On the hull now' : have ? 'Owned — tap to repaint (free)' : 'Repaints the Wayfarer (Flight Mode + Ship View)', price: have ? 0 : 300, done: cur,
          buy: function () { if (!have) owned.push(k); u.paints = owned; u.paint = k; setUpg(u); } });
      });
      return out;
    }
    if (id === 'pets') return [
      { name: 'Cat treats ×5', note: 'You have ' + (L ? L.count('treat') : 0), price: 40, buy: function () { L.give('treat', 5); } },
      { name: 'K’Vetar catnip ×3', note: 'A cat goes wild for it: +12% trust (you have ' + (L ? L.count('catnip') : 0) + ')', price: 90, buy: function () { L.give('catnip', 3); } }
    ];
    return [
      ['idol', 'Resin idol of the Hive Mother', 250], ['chart', 'Hand-inked star chart', 180], ['geode', 'Singing crystal geode', 320], ['tooth', 'Bioship tooth', 500], ['model', 'Brass model of the Wayfarer', 650]
    ].map(function (q) { var have = L && L.count(q[0]); return { name: q[1], note: have ? 'In your cargo — it will go on your trophy shelf' : 'A trophy for the Captain’s quarters', price: have ? 0 : q[2], done: !!have, buy: function () { L.give(q[0], 1); } }; });
  }
  function openShop(S) {
    var L = window.WF_LIFE; if (!L) return;
    document.getElementById('shop-name').textContent = S.name; document.getElementById('shop-line').textContent = '“' + S.line + '”';

  }
  function renderShop(S) {
    var L = window.WF_LIFE, list = document.getElementById('shop-list'); list.innerHTML = '';

  document.getElementById('shop-close').addEventListener('click', function () { closeP('shop'); });
  function buildShops(base, kit) {
    window.HIVE.male = { base: base, kit: kit };
    var chit = new THREE.MeshStandardMaterial({ color: 0x1d3a2a, roughness: 0.45, metalness: 0.4 }), brass = new THREE.MeshStandardMaterial({ color: 0xc09048, roughness: 0.3, metalness: 0.9 });
    SHOPS.forEach(function (S) {
      var g = new THREE.Group(); g.position.set(-45.9, 0, S.z); g.rotation.y = Math.PI / 2; g.userData.noCollide = true; sc.object3D.add(g);   // faces +x
      var top = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.08, 0.7), brass); top.position.y = 1.05; g.add(top);
      var body = new THREE.Mesh(new THREE.BoxGeometry(2.1, 1.0, 0.6), chit); body.position.y = 0.5; g.add(body);
      var c = document.createElement('canvas'); c.width = 512; c.height = 160; var x = c.getContext('2d'); x.fillStyle = 'rgba(0,0,0,0)'; x.fillRect(0, 0, 512, 160);

      var sign = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 0.75), new THREE.MeshBasicMaterial({ map: t, transparent: true, depthWrite: false, toneMapped: false, side: THREE.DoubleSide })); sign.position.set(0, 2.95, -0.2); g.add(sign);
      var gl = new THREE.PointLight(new THREE.Color(S.col), 1.2, 6, 2); gl.position.set(0, 2.2, 0.6); g.add(gl);
      // the trader, behind the counter (x −47), with its caste's colours
      var vi = kit.names.findIndex(function (n) { return n.indexOf(S.caste) >= 0; }); var v = makeActor(base, kit, vi < 0 ? 0 : vi);
      v.model.position.set(-47.1, 0, S.z); v.model.rotation.y = Math.PI / 2; play(v, 'Idle'); SHOPKEEPERS.push(v);
      var hit = document.createElement('a-entity'); hit.setAttribute('class', 'clickable'); hit.setObject3D('mesh', invisibleBox(2.4, 3.2, 1.8)); hit.object3D.position.set(-46.4, 1.6, S.z); sc.appendChild(hit);
      hit.addEventListener('click', function () { var p = sc.camera.el.object3D.position; if (Math.hypot(p.x + 46, p.z - S.z) > 6) { toast('Walk up to ' + S.name.toLowerCase() + ' in the Trade Lounge (west side)'); return; } openShop(S); });
    });
    window.WAYFARER.extraSolids = (window.WAYFARER.extraSolids || []).concat(SHOPS.map(function (S) { return [-46.3, S.z - 1.15, -45.5, S.z + 1.15]; }));
    var mob = sc.components['wayfarer-mobile']; if (mob && mob.scanSolids) mob.scanSolids();
  }
  var SHOPKEEPERS = [];

  // ── airlock home + job board, at the entrance (+Z) ──
  function buildAirlockAndBoard() {
    var cu = new THREE.MeshStandardMaterial({ color: 0xc09048, roughness: 0.3, metalness: 0.9 }), al = new THREE.Group(); al.position.set(0, 0, 21.55); al.rotation.y = Math.PI; sc.object3D.add(al); al.userData.noCollide = true;
    var arch = new THREE.Shape(); arch.moveTo(-1.4, 0); arch.lineTo(-1.4, 2.6); arch.absarc(0, 2.6, 1.4, Math.PI, 0, true); arch.lineTo(1.4, 0); arch.lineTo(1.1, 0); arch.lineTo(1.1, 2.6); arch.absarc(0, 2.6, 1.1, 0, Math.PI, false); arch.lineTo(-1.1, 0);
    var am = new THREE.Mesh(new THREE.ExtrudeGeometry(arch, { depth: 0.3, bevelEnabled: true, bevelThickness: 0.04, bevelSize: 0.04, bevelSegments: 2 }), cu); am.position.z = -0.15; al.add(am);
    var gl = new THREE.Mesh(new THREE.PlaneGeometry(2.2, 2.6), new THREE.MeshBasicMaterial({ color: 0x8affb0, transparent: true, opacity: 0.16, blending: THREE.AdditiveBlending, depthWrite: false })); gl.position.set(0, 1.3, 0.02); al.add(gl);
    var pc = document.createElement('canvas'); pc.width = 512; pc.height = 96; var px = pc.getContext('2d'); px.fillStyle = '#06100a'; px.fillRect(0, 0, 512, 96); px.strokeStyle = '#7a5530'; px.lineWidth = 4; px.strokeRect(3, 3, 506, 90);
    px.fillStyle = '#f0c070'; px.font = '600 38px -apple-system, Helvetica, sans-serif'; px.textAlign = 'center'; px.textBaseline = 'middle'; px.fillText('AIRLOCK  ·  SS WAYFARER', 256, 50);
    var pt = new THREE.CanvasTexture(pc); pt.colorSpace = THREE.SRGBColorSpace; var pl = new THREE.Mesh(new THREE.PlaneGeometry(2.0, 0.38), new THREE.MeshBasicMaterial({ map: pt })); pl.position.set(0, 4.25, 0.05); al.add(pl);
    var ae = document.getElementById('airlock'); ae.setObject3D('mesh', invisibleBox(2.4, 3, 0.6)); ae.object3D.position.set(0, 1.5, 21.3);
    var jb = new THREE.Group(); jb.position.set(-4.2, 0, 21.5); jb.rotation.y = Math.PI; sc.object3D.add(jb);
    var fr = new THREE.Mesh(new THREE.BoxGeometry(1.8, 1.35, 0.1), cu); fr.position.set(0, 1.75, 0); jb.add(fr);
    var lc = WAYFARER.lcars({ w: 512, h: 380, seed: 7, layout: 'keys', label: 'JOBS' }); ANIM.push(lc.update);
    var s2 = new THREE.Mesh(new THREE.PlaneGeometry(1.64, 1.2), new THREE.MeshBasicMaterial({ map: lc.texture, toneMapped: false })); s2.position.set(0, 1.75, 0.06); jb.add(s2);
    var be = document.getElementById('board'); be.setObject3D('mesh', invisibleBox(1.9, 1.5, 0.5)); be.object3D.position.set(-4.2, 1.75, 21.3);
  }

  // ── talking to the K'Vetar (dialogue.json) ──
  var talking = null;
  function openP(id) { document.getElementById(id).style.display = 'block'; document.body.classList.add('reading'); }
  function closeP(id) { document.getElementById(id).style.display = 'none'; if (!document.querySelector('.panel[style*="block"]')) document.body.classList.remove('reading'); }
  function talkTo(e) {
    if (window.WF_LIFE) WF_LIFE.event('kvetar');
    if (!DLG) return; talking = e; var cam = sc.camera.el.object3D.position;
    e.a.path = []; CROWD.release(e.a); e.a.wait = 6; e.a.state = 'Talk'; e.a.heading = Math.atan2(cam.x - e.a.p[0], cam.z - e.a.p[1]);
    sfx('mandible_click', 0.5); setTimeout(function () { alienSay(e.a.p[0], e.a.p[1], e.caste === 'red_general_king' ? 'growl' : e.caste === 'purple_female' ? 'trill' : 'query', true); }, 250);
    document.getElementById('talk-who').textContent = (CASTE[e.caste] || CASTE.blue_civilian_male)[1];
    var gl = pick(DLG.greetings); document.getElementById('talk-line').textContent = '“' + gl + '”'; if (window.WF_SOUND && WF_SOUND.speak) WF_SOUND.speak(gl, 'kvetar');
    var list = document.getElementById('talk-list'); list.innerHTML = '';
    DLG.playerPrompts.forEach(function (q) { var b = document.createElement('button'); b.textContent = q; b.onclick = function () { answer(q); }; list.appendChild(b); });
    if (window.HIVE_GAMES && HIVE_GAMES.talkHook) HIVE_GAMES.talkHook(e, list);    /* bounty target / pick a fight */
    openP('talk');
  }
  function answer(q) {
    var e = talking; if (!e) return; e.a.wait = 6; sfx('mandible_click', 0.45); alienSay(e.a.p[0], e.a.p[1], ['chitter', 'hum', 'click', 'trill', 'query'][Math.floor(Math.random() * 5)], true);
    if (/leave you/i.test(q)) { closeP('talk'); talking = null; return; }
    if (/get me a drink/i.test(q)) { closeP('talk'); openBar(); return; }
    if (/work/i.test(q)) { closeP('talk'); renderJobs(); openP('job-board'); return; }
    var pool = /crest/i.test(q) ? DLG[(CASTE[e.caste] || CASTE.blue_civilian_male)[0]] : /Hiveport/i.test(q) ? (DLG.general || []).concat(DLG.greetings) : /drinking/i.test(q) ? (DLG.female || []).concat(DLG.bartender || []) : DLG.civilian;
    var al = pick(pool && pool.length ? pool : DLG.greetings); document.getElementById('talk-line').textContent = '“' + al + '”'; if (window.WF_SOUND && WF_SOUND.speak) WF_SOUND.speak(al, 'kvetar');
  }
  // ── the bar ──
  function openBar() {
    if (!DLG) return; document.getElementById('bar-line').textContent = '“' + pick(DLG.bartender || ['Select a beverage.']) + '”';
    var list = document.getElementById('bar-list'); list.innerHTML = '';
    DLG.drinkMenu.forEach(function (d) { var b = document.createElement('button'); b.textContent = d.name; b.onclick = function () { closeP('bar-menu'); serve(d.id); }; list.appendChild(b); });
    if (BAR) play(BAR, 'Talk'); alienSay(0, 7.9, 'query', true); openP('bar-menu');
  }
  function serve(id) {
    if (window.WF_LIFE) WF_LIFE.event('drink');
    alienSay(0, 7.9, Math.random() < 0.5 ? 'click' : 'hum', true);
    if (BAR) { holdDrink(BAR, true, id); play(BAR, 'Serve_Drink', true); setTimeout(function () { holdDrink(BAR, false); play(BAR, 'Idle'); }, 2600); }
    sfx('drink_pour', 0.6); setTimeout(function () { sfx('glass_clink', 0.6); }, 1500);
    toast(DLG.drinkMenu.filter(function (d) { return d.id === id; })[0].name + ' — served.');
    document.body.classList.add('tipsy'); clearTimeout(window.__tipsy); window.__tipsy = setTimeout(function () { document.body.classList.remove('tipsy'); }, /neural|crimson/.test(id) ? 30000 : 16000);
  }
  document.querySelector('#bar-menu .close').addEventListener('click', function () { closeP('bar-menu'); if (BAR) play(BAR, 'Idle'); });
  document.getElementById('job-close').addEventListener('click', function () { closeP('job-board'); });
  function renderJobs() {
    var M = window.WF_MISSIONS, c = M.credits(), rk = M.rank(c), act = M.active(), list = document.getElementById('job-list'); list.innerHTML = '';
    document.getElementById('job-head').innerHTML = '<b>' + rk.name + '</b> · ' + c + ' credits' + (rk.next ? '<br><small>' + (rk.next[0] - c) + ' cr to ' + rk.next[1] + '</small>' : '');
    if (act) {
      var b = document.createElement('button'); b.className = 'cur'; b.innerHTML = act.title + '<small>' + act.text + '<br>Now: ' + M.status(act) + '<br>Reward ' + act.reward + ' cr</small>'; list.appendChild(b);
      var ab = document.createElement('button'); ab.className = 'close'; ab.textContent = 'Abandon contract'; ab.onclick = function () { M.abandon(); renderJobs(); }; list.appendChild(ab); return;
    }
    M.offers().forEach(function (o) {
      var b = document.createElement('button'), dn = M.isDone(o.id); if (dn) b.className = 'done';
      b.innerHTML = o.title + '<small>' + o.text + (o.need === 'combat' ? ' (Combat mode)' : '') + '<br>' + (dn ? 'Completed today' : 'Reward ' + o.reward + ' cr — tap to accept') + '</small>';
      if (!dn) b.onclick = function () { M.accept(o); renderJobs(); toast('Contract accepted: ' + o.title + '<br><small>Undock through the airlock to begin.</small>'); };
      list.appendChild(b);
    });
  }

  // ── leaving / arriving ──
  var jump = document.getElementById('jump'), leaving = false;
  function undock() { if (leaving) return; leaving = true; sfx('door_slide', 0.6); jump.style.transition = 'opacity .6s ease-in'; jump.style.opacity = 1;
    setTimeout(function () { document.documentElement.style.background = document.body.style.background = '#dff0ff'; location.href = 'minigame.html?from=station'; }, 650); }

  // K'Vetar voices (user, Nov 26: more than one kind of sound): WF_SOUND.alien click/chitter/hum/trill/growl/query, panned + by distance
  var _vp = new THREE.Vector3();
  function alienSay(x, z, kind, loud) {
    if (!window.WF_SOUND || WF_SOUND.muted() || !sc.camera) return;
    var c = sc.camera; c.el.object3D.getWorldPosition(_vp); var d = Math.hypot(x - _vp.x, z - _vp.z); if (d > 22 && !loud) return;
    _vp.set(x, 1.7, z).project(c); WF_SOUND.alien(kind || null, Math.max(-1, Math.min(1, _vp.x)) * 0.8, (loud ? 1.2 : 0.9) / (1 + d / 5));
  }
  // shared with hiveport-games.js (dance floor, gambling den, brawls, bounties)
  window.HIVE = { get NPCS() { return NPCS; }, get CROWD() { return CROWD; }, get LAYOUT() { return LAYOUT; }, get AUD() { return AUD; }, get BAR() { return BAR; },
    play: play, talkTo: function (e) { talkTo(e); }, alienSay: alienSay, toast: toast, openP: openP, closeP: closeP, sfx: sfx, makeActor: makeActor, invisibleBox: invisibleBox, sc: sc, talking: function () { return talking; } };
  var DRINK_STATES = ['Drink_Sip', 'Serve_Drink', 'Reach_Grab', 'Toast'], P2 = [0, 0], tmp = new THREE.Vector3();
  AFRAME.registerComponent('wf-hive', {
    init: function () { if (sc.hasLoaded) build(); else sc.addEventListener('loaded', build);
      document.getElementById('bartender').addEventListener('click', openBar);
      document.getElementById('board').addEventListener('click', function () { renderJobs(); openP('job-board'); });
      document.getElementById('airlock').addEventListener('click', undock); },
    tick: function (t, dtm) {
      var dt = Math.min(dtm || 16, 60) / 1000, s = t / 1000; ANIM.forEach(function (f) { f(s); });
      var cam = this.el.camera && this.el.camera.el; if (!cam) return; cam.object3D.getWorldPosition(tmp); P2[0] = tmp.x; P2[1] = tmp.z;
      if (tmp.z > 20.6 && Math.abs(tmp.x) < 1.6) undock();
      if (AUD.hiveport_club_loop && LAYOUT) {               // music: dance floor ⇄ lounge by distance to the holo stage
        var dd = Math.hypot(P2[0] - LAYOUT.hologram[0], P2[1] - LAYOUT.hologram[2]), k = Math.max(0, Math.min(1, (dd - 6) / 18));
        AUD.hiveport_club_loop.volume = 0.3 + 0.22 * (1 - k);   /* always playing; a little louder by the stage */
      }
      if (HOLO) { HOLO.mx.update(dt); HOLO.s.position.y = LAYOUT.hologram[1] + 0.055 * Math.sin(s * 2); }
      if (BAR) BAR.mixer.update(dt); SHOPKEEPERS.forEach(function (v) { v.mixer.update(dt); });
      if (!CROWD) return; CROWD.update(dt, P2);
      if (s > (this._voice || 2) && NPCS.length) {                 // the crowd talks: someone nearby clicks, hums or chitters every few seconds
        this._voice = s + 1.8 + Math.random() * 4; var vn = NPCS[Math.floor(Math.random() * NPCS.length)];
        alienSay(vn.a.p[0], vn.a.p[1], vn.caste === 'yellow_soldier' && Math.random() < 0.4 ? 'growl' : null);
      }
      for (var i = 0; i < NPCS.length; i++) {
        var e = NPCS[i], a = e.a, name = a.state || 'Idle', d = Math.hypot(a.p[0] - P2[0], a.p[1] - P2[1]);
        play(e, name, name === 'Serve_Drink'); holdDrink(e, DRINK_STATES.indexOf(name) >= 0, 'amber_resin');
        e.model.position.set(a.p[0], 0, a.p[1]); e.model.rotation.y = a.heading; e.hit.object3D.position.set(a.p[0], 1.6, a.p[1]);
        if (d < 32) e.mixer.update(dt); else if ((i + Math.floor(s * 10)) % 4 === 0) e.mixer.update(dt * 4);   // far NPCs animate at a quarter rate
      }
    }
  });
  // arriving from the ship: the docking flash fades into the Hiveport; a docking contract completes here
  if (/from=dock/.test(location.search) && window.WF_LIFE) WF_LIFE.event('dock');
  try { var V0 = JSON.parse(localStorage.getItem('wf-visited') || '[]'); if (V0.indexOf('HIVEPORT') < 0) { V0.push('HIVEPORT'); localStorage.setItem('wf-visited', JSON.stringify(V0)); } } catch (e) {}
  if (/from=dock/.test(location.search) && window.WF_MISSIONS) { var res = WF_MISSIONS.progress('dock'); if (res && res.done && window.WF_LIFE) WF_LIFE.event('contract'); if (res) setTimeout(function () { toast(res.text); }, 1600); }
  if (document.documentElement.classList.contains('from-dock')) {
    var fade = function () { sfx('security_chime', 0.5); jump.style.transition = 'opacity 1.2s ease-out'; requestAnimationFrame(function () { document.documentElement.classList.remove('from-dock'); jump.style.opacity = '1'; requestAnimationFrame(function () { jump.style.opacity = '0'; }); }); };
    if (sc.hasLoaded) setTimeout(fade, 300); else sc.addEventListener('loaded', function () { setTimeout(fade, 300); });
  }
}());
