<html lang="en">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; }
    #hud {
      position: fixed; top: 0; left: 0; right: 0;
      padding: 14px 20px;
      display: flex; justify-content: space-between; align-items: center;
      color: #6688cc; font-family: 'Courier New', monospace;
      font-size: 11px; letter-spacing: 3px; text-transform: uppercase;
      pointer-events: none; text-shadow: 0 0 8px #0044ff;
      background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
      z-index: 10;
    }
    #room-prompt {
      position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
      color: #88aaff; font-family: 'Courier New', monospace;
      font-size: 13px; letter-spacing: 4px; text-transform: uppercase;
      pointer-events: none; text-shadow: 0 0 12px #0044ff;
      opacity: 0; transition: opacity 0.3s ease; white-space: nowrap; z-index: 10;
    }
    #controls-hint {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      color: #223355; font-family: 'Courier New', monospace;
      font-size: 10px; letter-spacing: 2px; pointer-events: none; z-index: 10;
    }

    /* Scroll reader panel */
    #scroll-panel {
      position: fixed; bottom: -100%; left: 50%; transform: translateX(-50%);
      width: min(600px, 92vw);
      background: rgba(2, 4, 12, 0.96);
      border: 1px solid #112244;
      padding: 28px 32px 24px;
      font-family: 'Courier New', monospace;
      color: #88aadd;
      z-index: 20;
      transition: bottom 0.4s ease;
      pointer-events: all;
    }
    #scroll-panel.open { bottom: 24px; }
    #scroll-title {
      font-size: 13px; letter-spacing: 4px; color: #aabbff;
      text-shadow: 0 0 10px #0044ff; margin-bottom: 16px;
      text-transform: uppercase;
    }
    #scroll-body {
      font-size: 12px; line-height: 1.9; color: #5577aa;
      letter-spacing: 1px; max-height: 180px; overflow-y: auto;
    }
    #scroll-close {
      display: block; margin-top: 18px; text-align: right;
      font-size: 10px; letter-spacing: 3px; color: #334466;
      cursor: pointer; text-transform: uppercase;
    }
    #scroll-close:hover { color: #88aaff; }
    /* ── boot overlay + mobile layout ── */
    #boot {
      position: fixed; inset: 0; background: #000208; color: #6688cc;
      font: 11px 'Courier New', monospace; letter-spacing: 4px; text-align: center;
      display: flex; align-items: center; justify-content: center; padding: 0 24px;
      z-index: 50; transition: opacity 0.6s ease;
    }
    #boot.done { opacity: 0; pointer-events: none; }
    html.touch #room-prompt { bottom: 170px; font-size: 12px; letter-spacing: 2px; }
    @media (max-width: 640px) {
      #hud { padding: 10px 14px; font-size: 9px; letter-spacing: 1.5px; }
      #hud span:nth-child(2) { display: none; }
      #scroll-panel { width: 94vw; padding: 20px 20px calc(18px + env(safe-area-inset-bottom, 0px)); }
      #scroll-title { font-size: 12px; letter-spacing: 2px; }
      #scroll-body { font-size: 14px; line-height: 1.7; max-height: 38vh; letter-spacing: 0.5px; }
      #scroll-close { font-size: 12px; padding: 16px 0 4px; }
    }
  </style>
</head>
<body>

  <div id="boot">SS WAYFARER<br><br>LOADING THE LIBRARY…</div>

  <div id="hud">
    <span>SS WAYFARER</span>
    <span>THE LIBRARY — DEEP CORE</span>
    <span>DECK 01</span>
  </div>
  <div id="room-prompt"></div>
  <div id="controls-hint">WASD / DRAG TO LOOK · GAZE OR CLICK SCROLLS TO READ</div>

  <div id="scroll-panel">
    <div id="scroll-title"></div>
    <div id="scroll-body"></div>
    <span id="scroll-close">[ CLOSE SCROLL ]</span>
  </div>

  <a-scene device-orientation-permission-ui="enabled: false" wayfarer-mobile="radius: 10.2"
    fog="type: exponential; color: #04060f; density: 0.011"
    vr-mode-ui="enabled: true"
    renderer="antialias: true; toneMapping: ACESFilmic; exposure: 1.1">

    <!-- ======================================================
         SPACE ENVIRONMENT (through glass ceiling)
    ====================================================== -->
    <a-sky id="sky" color="#00010a"></a-sky>

    <!-- ======================================================
         PLAYER — enters from corridor (+Z)
    ====================================================== -->
    <a-entity id="player" position="0 0 8">
      <a-camera
        wasd-controls="acceleration: 20; fly: false"
        look-controls="pointerLockEnabled: true; touchEnabled: true; magicWindowTrackingEnabled: false"
        position="0 1.6 0">
        <a-cursor
          color="#88aaff" opacity="0.5"
          fuse="true" fuse-timeout="1500"
          raycaster="objects: .interactive, .interactive *">
        </a-cursor>
      </a-camera>
    </a-entity>

    <!-- ======================================================
         ROOM SHELL
         Wall / floor / shelf textures are generated in textures.js and
         applied in the script at the bottom (data URLs can't live in
         A-Frame's semicolon-separated attribute strings).
    ====================================================== -->

    <!-- GLASS FLOOR (centre) — walk on it, see the brain below -->
    <a-circle id="glass-floor" position="0 0 0" rotation="-90 0 0" radius="7.6" segments="64"
      material="color: #1c3d38; opacity: 0.16; transparent: true; depthWrite: false; roughness: 0.05; metalness: 0.3">
    </a-circle>
    <!-- engraved rings in the glass -->
    <a-torus position="0 0.006" rotation="-90 0 0" radius="2.4" radius-tubular="0.012" segments-tubular="64" segments-radial="6"
      material="color: #0a2a22; emissive: #19e3a4; emissiveIntensity: 0.9; shader: standard"></a-torus>
    <a-torus position="0 0.006" rotation="-90 0 0" radius="4.6" radius-tubular="0.012" segments-tubular="96" segments-radial="6"
      material="color: #0a2a22; emissive: #19e3a4; emissiveIntensity: 0.7"></a-torus>
    <a-torus position="0 0.006" rotation="-90 0 0" radius="6.6" radius-tubular="0.012" segments-tubular="128" segments-radial="6"
      material="color: #0a2a22; emissive: #19e3a4; emissiveIntensity: 0.5"></a-torus>
    <!-- bezel around the glass -->
    <a-torus position="0 0.03 0" rotation="-90 0 0" radius="7.62" radius-tubular="0.05" segments-tubular="128" segments-radial="8"
      material="color: #3a3228; emissive: #1affb4; emissiveIntensity: 0.3; roughness: 0.4; metalness: 0.3"></a-torus>

    <!-- SOLID DECK RING (glass edge → wall) -->
    <a-ring id="deck-ring" position="0 0.002 0" rotation="-90 0 0" radius-inner="7.6" radius-outer="11" segments-theta="96"
      material="color: #e9a56e; roughness: 0.42; metalness: 0.45">
    </a-ring>

    <!-- GLASS DOME over the centre: built in buildDome() (glass, bronze ribs, amber ring), light speed beyond it -->
    <!-- CEILING RING (structure around the skylight) -->
    <a-ring id="ceil-ring" position="0 5 0" rotation="90 0 0" radius-inner="7.6" radius-outer="11" segments-theta="96"
      material="color: #8a8aa0; roughness: 0.7; metalness: 0.2; side: double">
    </a-ring>

    <!-- CURVED WALLS — plated texture applied in script -->
    <a-cylinder id="lib-walls" position="0 2.5 0" radius="11" height="5" open-ended="true" segments-radial="72"
      material="side: back; color: #9a7a58; roughness: 0.7; metalness: 0.1">
    </a-cylinder>
    <!-- wall top / base trim -->
    <a-torus position="0 4.96 0" rotation="-90 0 0" radius="10.95" radius-tubular="0.07" segments-tubular="128" segments-radial="6"
      material="color: #8c6234; roughness: 0.42; metalness: 0.8"></a-torus>
    <a-torus position="0 0.05 0" rotation="-90 0 0" radius="10.9" radius-tubular="0.08" segments-tubular="128" segments-radial="6"
      material="color: #8c6234; roughness: 0.42; metalness: 0.8"></a-torus>

    <!-- ======================================================
         BRAIN IN ELECTROGEL (below glass floor)
    ====================================================== -->

    <!-- Electrogel tank walls -->
    <a-cylinder position="0 -8 0" radius="8" height="16" open-ended="true"
      material="side: double; color: #001a10; opacity: 0.12; transparent: true">
    </a-cylinder>
    <!-- Tank floor -->
    <a-circle position="0 -16 0" rotation="-90 0 0" radius="8"
      color="#000d08" roughness="1">
    </a-circle>

    <a-entity id="gel-tank" gel-tank></a-entity>

    <!-- THE BRAIN — real 3D folds, built in brain.js -->
    <a-entity id="brain" position="0 -7.3 0"></a-entity>   <!-- heartbeat, discharges: brain.js -->

    <!-- ELECTROGEL GLOW LIGHTS (below the floor — they only light the brain) -->
    <a-light type="point" position="0 -3.0 1.5"  color="#7dffd0" intensity="0.8" distance="13" decay="2"></a-light>
    <a-light class="hq" type="point" position="-5 -8 3"     color="#00cc88" intensity="0.7" distance="10" decay="2"></a-light>
    <a-light type="point" position="3 -8.5 -7.5" color="#3fd0ff" intensity="1.0" distance="11" decay="2"></a-light>

    <!-- ======================================================
         ROOM LIGHTING
         (A-Frame 1.5 uses legacy light units: intensity is multiplied by PI
          internally and point lights fall off to zero at `distance`.)
    ====================================================== -->

    <!-- Cool fill + sky/ground bounce so nothing is ever pure black -->
    <a-light type="ambient" color="#d9a878" intensity="0.42"></a-light>
    <a-light type="hemisphere" color="#c89868" groundColor="#6a3a14" intensity="0.55"></a-light>

    <!-- Starlight through the skylight -->
    <a-light type="directional" color="#ffc890" intensity="0.4" position="2 10 3"></a-light>

    <!-- Electrogel glow rising through the glass floor, washing the lower walls -->
    <a-light type="point" position="0 -0.6 0" color="#22ffb0" intensity="0.95" distance="15" decay="1.6"></a-light>

    <!-- Warm downlights on the ceiling ring (floor + shelf tops) -->
    <a-light class="hq" type="point" position="0 4.6 8.5" color="#ffb06a" intensity="1.1" distance="11" decay="2"></a-light>
    <a-light class="hq" type="point" position="-7.4 4.6 -4.25" color="#ffb06a" intensity="1.1" distance="11" decay="2"></a-light>
    <a-light class="hq" type="point" position="7.4 4.6 -4.25" color="#ffb06a" intensity="1.1" distance="11" decay="2"></a-light>

    <!-- Wall sconces + bookcases are generated in the script (see buildSconces / buildBookcases) -->

    <!-- BOOKCASES: generated by buildBookcases() in the script -->
    <a-entity id="bookcases"></a-entity>
    <a-entity id="sconces"></a-entity>

    <!-- ======================================================
         INTERACTIVE SCROLLS — pickup objects on pedestals
    ====================================================== -->

    <!-- SCROLL 1: Center room — Second Brain index -->
    <a-entity class="scroll-entity interactive"
      position="-2.5 0 1.5"
      data-title="SECOND BRAIN — INDEX"
      data-body="Your Obsidian vault lives here.\n\nMarkdown files will appear as physical scrolls once loaded.\nDrag your .md files into the repo and they will populate this room.\n\n[ PENDING: OBSIDIAN VAULT IMPORT ]">
      <a-sphere class="hit" radius="0.75" position="0 1.0 0" material="shader: flat; transparent: true; opacity: 0; depthWrite: false"></a-sphere>
      <a-cylinder position="0 0.1 0" radius="0.34" height="0.2" color="#3a2c1c" roughness="0.55" metalness="0.3"></a-cylinder>
      <a-cylinder position="0 0.55 0" radius="0.07" height="0.7" color="#5a4630" roughness="0.5" metalness="0.3"></a-cylinder>
      <a-cylinder position="0 0.92 0" radius="0.2" height="0.04" color="#6a5438" roughness="0.5" metalness="0.3"></a-cylinder>
      <a-torus position="0 0.21 0" rotation="-90 0 0" radius="0.3" radius-tubular="0.012" segments-tubular="32" segments-radial="6"
        material="color: #3a1d06; emissive: #ffa43c; emissiveIntensity: 1.4"></a-torus>
      <a-entity position="0 1.12 0"
        animation="property: position; to: 0 1.2 0; dir: alternate; loop: true; dur: 2600; easing: easeInOutSine"
        animation__spin="property: rotation; to: 0 360 0; loop: true; dur: 16000; easing: linear">
        <a-cylinder rotation="0 0 90" radius="0.1" height="0.46" color="#dcc08a" roughness="0.85"
          material="emissive: #7a4a14; emissiveIntensity: 0.55"></a-cylinder>
        <a-cylinder position="-0.25 0 0" rotation="0 0 90" radius="0.135" height="0.035" color="#b08840" roughness="0.4" metalness="0.5"
          material="emissive: #6a4410; emissiveIntensity: 0.5"></a-cylinder>
        <a-cylinder position="0.25 0 0" rotation="0 0 90" radius="0.135" height="0.035" color="#b08840" roughness="0.4" metalness="0.5"
          material="emissive: #6a4410; emissiveIntensity: 0.5"></a-cylinder>
        <a-sphere radius="0.46" material="color: #ffa43c; emissive: #ff8a20; emissiveIntensity: 0.4; transparent: true; opacity: 0.10; shader: standard"></a-sphere>
      </a-entity>
    </a-entity>

    <!-- SCROLL 2: Sons of Naphtali -->
    <a-entity class="scroll-entity interactive"
      position="2.5 0 1.5"
      data-title="THE SONS OF NAPHTALI — BOOK I"
      data-body="Genetics, haplogroups, and the genetic trail of the tribe of Naphtali.\n\nBook 1 scope: comprehensive. Chapter structure in progress.\n\n[ PENDING: MANUSCRIPT FILES ]">
      <a-sphere class="hit" radius="0.75" position="0 1.0 0" material="shader: flat; transparent: true; opacity: 0; depthWrite: false"></a-sphere>
      <a-cylinder position="0 0.1 0" radius="0.34" height="0.2" color="#3a2c1c" roughness="0.55" metalness="0.3"></a-cylinder>
      <a-cylinder position="0 0.55 0" radius="0.07" height="0.7" color="#5a4630" roughness="0.5" metalness="0.3"></a-cylinder>
      <a-cylinder position="0 0.92 0" radius="0.2" height="0.04" color="#6a5438" roughness="0.5" metalness="0.3"></a-cylinder>
      <a-torus position="0 0.21 0" rotation="-90 0 0" radius="0.3" radius-tubular="0.012" segments-tubular="32" segments-radial="6"
        material="color: #3a1d06; emissive: #ffa43c; emissiveIntensity: 1.4"></a-torus>
      <a-entity position="0 1.12 0"
        animation="property: position; to: 0 1.2 0; dir: alternate; loop: true; dur: 2600; easing: easeInOutSine"
        animation__spin="property: rotation; to: 0 360 0; loop: true; dur: 16000; easing: linear">
        <a-cylinder rotation="0 0 90" radius="0.1" height="0.46" color="#dcc08a" roughness="0.85"
          material="emissive: #7a4a14; emissiveIntensity: 0.55"></a-cylinder>
        <a-cylinder position="-0.25 0 0" rotation="0 0 90" radius="0.135" height="0.035" color="#b08840" roughness="0.4" metalness="0.5"
          material="emissive: #6a4410; emissiveIntensity: 0.5"></a-cylinder>
        <a-cylinder position="0.25 0 0" rotation="0 0 90" radius="0.135" height="0.035" color="#b08840" roughness="0.4" metalness="0.5"
          material="emissive: #6a4410; emissiveIntensity: 0.5"></a-cylinder>
        <a-sphere radius="0.46" material="color: #ffa43c; emissive: #ff8a20; emissiveIntensity: 0.4; transparent: true; opacity: 0.10; shader: standard"></a-sphere>
      </a-entity>
    </a-entity>

    <!-- SCROLL 3: Haplogroups -->
    <a-entity class="scroll-entity interactive"
      position="-2.5 0 -2"
      data-title="JEWISH GENETIC HAPLOGROUPS — BOOK II"
      data-body="Spun off from Book I when the scope became too large to contain.\n\nFocuses on haplogroup distribution, migration patterns, and genetic markers across Jewish diaspora populations.\n\n[ PENDING: RESEARCH FILES ]">
      <a-sphere class="hit" radius="0.75" position="0 1.0 0" material="shader: flat; transparent: true; opacity: 0; depthWrite: false"></a-sphere>
      <a-cylinder position="0 0.1 0" radius="0.34" height="0.2" color="#3a2c1c" roughness="0.55" metalness="0.3"></a-cylinder>
      <a-cylinder position="0 0.55 0" radius="0.07" height="0.7" color="#5a4630" roughness="0.5" metalness="0.3"></a-cylinder>
      <a-cylinder position="0 0.92 0" radius="0.2" height="0.04" color="#6a5438" roughness="0.5" metalness="0.3"></a-cylinder>
      <a-torus position="0 0.21 0" rotation="-90 0 0" radius="0.3" radius-tubular="0.012" segments-tubular="32" segments-radial="6"
        material="color: #3a1d06; emissive: #ffa43c; emissiveIntensity: 1.4"></a-torus>
      <a-entity position="0 1.12 0"
        animation="property: position; to: 0 1.2 0; dir: alternate; loop: true; dur: 2600; easing: easeInOutSine"
        animation__spin="property: rotation; to: 0 360 0; loop: true; dur: 16000; easing: linear">
        <a-cylinder rotation="0 0 90" radius="0.1" height="0.46" color="#dcc08a" roughness="0.85"
          material="emissive: #7a4a14; emissiveIntensity: 0.55"></a-cylinder>
        <a-cylinder position="-0.25 0 0" rotation="0 0 90" radius="0.135" height="0.035" color="#b08840" roughness="0.4" metalness="0.5"
          material="emissive: #6a4410; emissiveIntensity: 0.5"></a-cylinder>
        <a-cylinder position="0.25 0 0" rotation="0 0 90" radius="0.135" height="0.035" color="#b08840" roughness="0.4" metalness="0.5"
          material="emissive: #6a4410; emissiveIntensity: 0.5"></a-cylinder>
        <a-sphere radius="0.46" material="color: #ffa43c; emissive: #ff8a20; emissiveIntensity: 0.4; transparent: true; opacity: 0.10; shader: standard"></a-sphere>
      </a-entity>
    </a-entity>

    <!-- SCROLL 4: Daily notes -->
    <a-entity class="scroll-entity interactive"
      position="2.5 0 -2"
      data-title="DAILY NOTES — ACTIVE VAULT"
      data-body="Neurodivergent idea capture. All the little things.\n\nEvery idea that lands here gets a home. Nothing lost.\n\n[ PENDING: DAILY NOTE FILES ]">
      <a-sphere class="hit" radius="0.75" position="0 1.0 0" material="shader: flat; transparent: true; opacity: 0; depthWrite: false"></a-sphere>
      <a-cylinder position="0 0.1 0" radius="0.34" height="0.2" color="#3a2c1c" roughness="0.55" metalness="0.3"></a-cylinder>
      <a-cylinder position="0 0.55 0" radius="0.07" height="0.7" color="#5a4630" roughness="0.5" metalness="0.3"></a-cylinder>
      <a-cylinder position="0 0.92 0" radius="0.2" height="0.04" color="#6a5438" roughness="0.5" metalness="0.3"></a-cylinder>
      <a-torus position="0 0.21 0" rotation="-90 0 0" radius="0.3" radius-tubular="0.012" segments-tubular="32" segments-radial="6"
        material="color: #3a1d06; emissive: #ffa43c; emissiveIntensity: 1.4"></a-torus>
      <a-entity position="0 1.12 0"
        animation="property: position; to: 0 1.2 0; dir: alternate; loop: true; dur: 2600; easing: easeInOutSine"
        animation__spin="property: rotation; to: 0 360 0; loop: true; dur: 16000; easing: linear">
        <a-cylinder rotation="0 0 90" radius="0.1" height="0.46" color="#dcc08a" roughness="0.85"
          material="emissive: #7a4a14; emissiveIntensity: 0.55"></a-cylinder>
        <a-cylinder position="-0.25 0 0" rotation="0 0 90" radius="0.135" height="0.035" color="#b08840" roughness="0.4" metalness="0.5"
          material="emissive: #6a4410; emissiveIntensity: 0.5"></a-cylinder>
        <a-cylinder position="0.25 0 0" rotation="0 0 90" radius="0.135" height="0.035" color="#b08840" roughness="0.4" metalness="0.5"
          material="emissive: #6a4410; emissiveIntensity: 0.5"></a-cylinder>
        <a-sphere radius="0.46" material="color: #ffa43c; emissive: #ff8a20; emissiveIntensity: 0.4; transparent: true; opacity: 0.10; shader: standard"></a-sphere>
      </a-entity>
    </a-entity>

    <!-- ======================================================
         BOOK WINGS — stub doorways
    ====================================================== -->

    <!-- the two wing doorways are shared ship doors (door.js), built in buildWings(); locked until the wings exist -->

    <!-- ======================================================
         CORRIDOR EXIT (+Z, entrance side)
    ====================================================== -->
    <!-- exit: the shared ship door (door.js → WAYFARER.door.roomExit) -->

      <!-- study corner: walnut writing desk at the back wall with a microscope, specimen rack and hourglass; armillary sphere on a bronze plinth -->
    <a-entity wf-prop="src: writing_desk; accent: teal" position="0 0 -9.25"></a-entity>
    <a-entity wf-prop="src: microscope; accent: teal" position="-0.5 0.85 -9.3" rotation="0 20 0"></a-entity>
    <a-entity wf-prop="src: specimen_vial_rack; accent: teal" position="0.05 0.85 -9.45"></a-entity>
    <a-entity wf-prop="src: hourglass" position="0.52 0.85 -9.25"></a-entity>
    <a-cylinder position="-5.9 0.45 -7.05" radius="0.32" height="0.9" segments-radial="32" material="color: #b07840; metalness: 0.8; roughness: 0.38"></a-cylinder><a-torus position="-5.9 0.9 -7.05" rotation="90 0 0" radius="0.33" radius-tubular="0.025" material="color: #ffa040; shader: flat"></a-torus>
    <a-entity wf-prop="src: armillary_sphere; accent: teal; height: 0.6" position="-5.9 0.92 -7.05"></a-entity>
</a-scene>

  <script>
    const promptEl = document.getElementById('room-prompt');
    const panel    = document.getElementById('scroll-panel');
    const panTitle = document.getElementById('scroll-title');
    const panBody  = document.getElementById('scroll-body');

    function showPrompt(text, color) {
      promptEl.textContent = text;
      promptEl.style.color = color || '#88aaff';
      promptEl.style.textShadow = `0 0 12px ${color || '#0044ff'}`;
      promptEl.style.opacity = '1';
    }
    function hidePrompt() { promptEl.style.opacity = '0'; }

    // Scrolls
    document.querySelectorAll('.scroll-entity').forEach(el => {
      el.addEventListener('mouseenter', () => showPrompt('[ READ SCROLL ]', '#ffcc66'));
      el.addEventListener('mouseleave', hidePrompt);
      el.addEventListener('click', () => {
        const title = el.getAttribute('data-title');
        const body  = el.getAttribute('data-body').replace(/\\n/g, '\n');
        panTitle.textContent = title;
        panBody.innerHTML = body.split('\n').map(l => l ? `<div>${l}</div>` : '<br>').join('');
        panel.classList.add('open'); document.body.classList.add('reading');
        hidePrompt();
      });
    });

    document.getElementById('scroll-close').addEventListener('click', () => {
      panel.classList.remove('open'); document.body.classList.remove('reading');
    });


    // ─────────────────────────────────────────────────────────────────────
    // WORLD BUILD — textures, bookcases, sconces, stars
    // ─────────────────────────────────────────────────────────────────────
    const scene = document.querySelector('a-scene');
    const THREE = AFRAME.THREE;
    const MOB = window.WAYFARER.mobile;   // phone / small tablet quality profile

    // Put an emissive map on an entity's existing material (A-Frame's material
    // component has no emissiveMap property, so we set it on the three.js material).
    function setEmissiveMap(el, url, intensity, repeat, color) {
      const apply = () => {
        const mesh = el.getObject3D('mesh');
        if (!mesh || !mesh.material) return false;
        new THREE.TextureLoader().load(url, tex => {
          tex.colorSpace = THREE.SRGBColorSpace;
          tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
          if (repeat) tex.repeat.set(repeat[0], repeat[1]);
          tex.anisotropy = 4;
          const m = mesh.material;
          m.emissiveMap = tex;
          m.emissive.set(color || '#ffffff');
          m.emissiveIntensity = intensity;
          m.needsUpdate = true;
        });
        return true;
      };
      if (!apply()) el.addEventListener('object3dset', apply, { once: true });
    }

    // Face an entity at the room centre. +Z (local) points inward.
    function faceCentre(deg) {
      const t = deg * Math.PI / 180;
      return Math.atan2(-Math.cos(t), -Math.sin(t)) * 180 / Math.PI;
    }
    function polar(deg, r) {
      const t = deg * Math.PI / 180;
      return [r * Math.cos(t), r * Math.sin(t)];
    }

    function el(tag, attrs, parent) {
      const e = document.createElement(tag);
      for (const k in attrs) e.setAttribute(k, attrs[k]);
      if (parent) parent.appendChild(e);
      return e;
    }

    // PAINTED BOOKSHELVES: five variants (seeded) — rich spines (oxblood, emerald, navy, ochre, plum, teal, cream, black) with gilt
    // bands and titles, mixed heights, leaning books, horizontal stacks, and ornaments (globes, plants, candles, skulls, crystals,
    // hourglasses, framed photos). Compartment floors line up with the wooden boards (y 0.37 / 1.1 / 1.85 / 2.6 / 3.35 m of 4 m).
    const SHELF_T = [];
    function shelfTexture(v) {
      if (SHELF_T[v]) return SHELF_T[v];
      const W = 512, H = 640, c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d');
      let sd = 1234 + v * 977; const r = () => { sd = (sd * 1664525 + 1013904223) >>> 0; return sd / 4294967296; };
      const Y = m => (1 - m / 4) * H, PAL = [['#6b1e1e', '#8a2a24', '#4a1414'], ['#1f4a32', '#2d6a44', '#163a28'], ['#1d2e55', '#2a4278', '#141f3a'], ['#9a6a1e', '#b88430', '#7a5214'], ['#4a2650', '#663a70', '#341a3a'],
        ['#1f5a5a', '#2a7a74', '#143e3e'], ['#e6d8b8', '#cdbb96', '#f2e6c8'], ['#1a1614', '#2a2420', '#0e0c0a'], ['#7a3a1a', '#a0522d', '#5a2a10']];
      const pal = PAL.slice().sort(() => r() - 0.5).slice(0, 5 + (v % 3));
      x.fillStyle = '#1a100a'; x.fillRect(0, 0, W, H);
      const rows = [[0.42, 1.06], [1.16, 1.81], [1.91, 2.56], [2.66, 3.31], [3.4, 3.93]];
      rows.forEach(([y0, y1]) => {
        const bot = Y(y0), top = Y(y1), hMax = bot - top; let px = 6;
        x.fillStyle = '#120a06'; x.fillRect(0, top, W, hMax);
        const g = x.createLinearGradient(0, top, 0, bot); g.addColorStop(0, 'rgba(255,170,80,.18)'); g.addColorStop(1, 'rgba(0,0,0,0)'); x.fillStyle = g; x.fillRect(0, top, W, hMax);
        while (px < W - 10) {
          const roll = r();
          if (roll < 0.1) {                                              // an ornament
            const ow = 34 + r() * 26, kind = Math.floor(r() * 6), cx = px + ow / 2, by = bot - 2;
            if (kind === 0) { x.fillStyle = '#c08a48'; x.fillRect(cx - 3, by - 14, 6, 14); x.beginPath(); x.arc(cx, by - 30, 16, 0, 6.28); x.fillStyle = '#2a6a8a'; x.fill(); x.strokeStyle = '#d8b070'; x.lineWidth = 2; x.stroke(); x.fillStyle = '#5a9a5a'; x.fillRect(cx - 8, by - 36, 9, 7); }
            else if (kind === 1) { x.fillStyle = '#8a4a2a'; x.fillRect(cx - 10, by - 18, 20, 18); for (let k = 0; k < 7; k++) { x.fillStyle = k % 2 ? '#3f7a3a' : '#5aa04a'; x.beginPath(); x.ellipse(cx + Math.cos(k) * 9, by - 26 - (k % 3) * 7, 5, 11, Math.sin(k) * 0.8, 0, 6.28); x.fill(); } }
            else if (kind === 2) { x.fillStyle = '#e8dcc4'; x.fillRect(cx - 4, by - 30, 8, 30); x.fillStyle = '#ffcf6a'; x.beginPath(); x.ellipse(cx, by - 36, 4, 7, 0, 0, 6.28); x.fill(); x.fillStyle = 'rgba(255,190,90,.25)'; x.beginPath(); x.arc(cx, by - 36, 16, 0, 6.28); x.fill(); }
            else if (kind === 3) { x.fillStyle = '#e8e0cc'; x.beginPath(); x.arc(cx, by - 16, 12, Math.PI, 0); x.fill(); x.fillRect(cx - 9, by - 16, 18, 14); x.fillStyle = '#222'; x.fillRect(cx - 7, by - 19, 5, 5); x.fillRect(cx + 2, by - 19, 5, 5); }
            else if (kind === 4) { for (let k = 0; k < 4; k++) { x.fillStyle = ['#b08cff', '#7fd8ff', '#d0a8ff', '#9af0e0'][k]; x.beginPath(); x.moveTo(cx - 10 + k * 6, by); x.lineTo(cx - 6 + k * 6, by - 18 - k * 5); x.lineTo(cx - 2 + k * 6, by); x.fill(); } }
            else { x.fillStyle = '#c08a48'; x.fillRect(cx - 12, by - 4, 24, 4); x.fillRect(cx - 12, by - 34, 24, 4); x.fillStyle = 'rgba(200,230,255,.5)'; x.beginPath(); x.moveTo(cx - 9, by - 30); x.lineTo(cx + 9, by - 30); x.lineTo(cx, by - 17); x.lineTo(cx + 9, by - 4); x.lineTo(cx - 9, by - 4); x.lineTo(cx, by - 17); x.fill(); x.fillStyle = '#e8c890'; x.fillRect(cx - 5, by - 10, 10, 6); }
            px += ow + 4; continue;
          }
          if (roll < 0.17) {                                             // a horizontal stack
            let sy = bot; const sw = 40 + r() * 20; for (let k = 0; k < 3 + Math.floor(r() * 3); k++) { const th = 6 + r() * 5, cc = pal[Math.floor(r() * pal.length)]; x.fillStyle = cc[0]; x.fillRect(px + r() * 4, sy - th, sw, th); x.fillStyle = 'rgba(220,180,90,.6)'; x.fillRect(px + 6, sy - th + 2, sw - 12, 1); sy -= th; }
            px += sw + 6; continue;
          }
          const bw = 7 + r() * 13, bh = hMax * (0.62 + r() * 0.34), cc = pal[Math.floor(r() * pal.length)], lean = r() < 0.08 ? (r() - 0.5) * 0.35 : 0;
          x.save(); x.translate(px + bw / 2, bot); x.rotate(lean);
          const sg = x.createLinearGradient(-bw / 2, 0, bw / 2, 0); sg.addColorStop(0, cc[2]); sg.addColorStop(0.45, cc[1]); sg.addColorStop(1, cc[2]); x.fillStyle = sg; x.fillRect(-bw / 2, -bh, bw, bh);
          x.fillStyle = 'rgba(232,192,104,.75)'; if (r() < 0.8) { x.fillRect(-bw / 2, -bh + 6, bw, 2); x.fillRect(-bw / 2, -10, bw, 2); } if (r() < 0.5) x.fillRect(-bw / 2, -bh * 0.55, bw, 1.5);
          if (bw > 11 && r() < 0.6) { x.fillStyle = cc[0] === '#e6d8b8' ? '#3a2a1a' : 'rgba(240,214,150,.85)'; for (let k = 0; k < 4; k++) x.fillRect(-1.5, -bh * 0.75 + k * 7, 3, 4); }
          x.restore(); px += bw + (lean ? 6 : 1);
        }
      });
      for (let i = 0; i < 2500; i++) { x.fillStyle = 'rgba(0,0,0,' + r() * 0.06 + ')'; x.fillRect(r() * W, r() * H, 1, 2); }
      const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; SHELF_T[v] = t; return t;
    }

    // BOOKCASES — a row of lit bays around the back arc, between the two wings
    function buildBookcases(L) {
      const root = document.getElementById('bookcases');
      // bays all round the room (user, Nov 24), except the entrance (90°) and the two book wings (~191° and ~349°)
      const centres = [10, 30, 50, 70, 110, 130, 150, 170, 220, 240, 260, 280, 300, 320];
      centres.forEach(deg => {
        const [x, z] = polar(deg, 10.55);
        const bay = el('a-entity', { position: `${x.toFixed(3)} 0 ${z.toFixed(3)}`, rotation: `0 ${faceCentre(deg).toFixed(2)} 0` }, root);

        // book face: one of five PAINTED shelf variants (user, Nov 26: "more variety, colour") — see shelfTexture()
        const face = el('a-plane', { position: '0 2 0.06', width: 3.2, height: 4 }, bay);
        const vt = shelfTexture(centres.indexOf(deg) % 5);
        const putT = () => { const m = face.getObject3D('mesh'); if (!m) return false; m.material = new THREE.MeshStandardMaterial({ map: vt, emissiveMap: vt, emissive: new THREE.Color('#ff9a50'), emissiveIntensity: 0.55, roughness: 0.9 }); return true; };
        if (!putT()) face.addEventListener('object3dset', putT, { once: true });

        const wood = { src: L.wood, color: '#caa27a', roughness: 0.7, metalness: 0.05 };
        // boards (match compartment floors baked into the texture)
        [3.35, 2.6, 1.85, 1.1, 0.37].forEach(y => {
          const b = el('a-box', { position: `0 ${y} 0.22`, width: 3.2, height: 0.07, depth: 0.44 }, bay);
          b.setAttribute('material', wood);
        });
        // uprights, kick plate, cornice
        [-1.6, 1.6].forEach(x2 => el('a-box', { position: `${x2} 2 0.22`, width: 0.1, height: 4.0, depth: 0.46, color: '#3a2412', roughness: 0.7 }, bay));
        el('a-box', { position: '0 0.17 0.22', width: 3.2, height: 0.34, depth: 0.46, color: '#2e1c0e', roughness: 0.8 }, bay);
        el('a-box', { position: '0 4.07 0.22', width: 3.4, height: 0.14, depth: 0.56, color: '#3a2412', roughness: 0.6 }, bay);
        // warm light strip under the cornice
        el('a-box', { position: '0 3.97 0.4', width: 3.0, height: 0.03, depth: 0.05,
          material: 'color: #ffd9a0; emissive: #ffb455; emissiveIntensity: 2.2; shader: standard' }, bay);
      });
    }

    // WALL ARCHITECTURE — walnut panels, bevelled bronze ribs between the bays, square amber lamps on the ribs above the
    // bookcases (same language as the corridor and Bridge). Lights stay where the old sconces were.
    function buildSconces() {
      const root = new THREE.Group(); scene.object3D.add(root);
      const bz = (function () { const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d'); x.fillStyle = '#8c6234'; x.fillRect(0, 0, 256, 256);
        for (let i = 0; i < 1400; i++) { const a = Math.random() * 0.18; x.fillStyle = Math.random() < 0.5 ? 'rgba(255,215,150,' + a * 0.5 + ')' : 'rgba(40,20,6,' + a * 0.5 + ')'; x.fillRect(0, Math.random() * 256, 256, 1); }
        const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; return t; }());
      const bronze = new THREE.MeshStandardMaterial({ map: bz, color: 0xd8b58a, roughness: 0.42, metalness: 0.8, emissive: 0x1a0e04, emissiveIntensity: 0.6 });
      const lampM = new THREE.MeshBasicMaterial({ color: 0xffb468, toneMapped: false }), amber = new THREE.MeshBasicMaterial({ color: 0xffa040, toneMapped: false });
      function rr(w, h, r) { const x = -w / 2, y = -h / 2, sh = new THREE.Shape(); sh.moveTo(x + r, y); sh.lineTo(x + w - r, y); sh.quadraticCurveTo(x + w, y, x + w, y + r); sh.lineTo(x + w, y + h - r); sh.quadraticCurveTo(x + w, y + h, x + w - r, y + h); sh.lineTo(x + r, y + h); sh.quadraticCurveTo(x, y + h, x, y + h - r); sh.lineTo(x, y + r); sh.quadraticCurveTo(x, y, x + r, y); return sh; }
      function soft(sh, d, b) { const g = new THREE.ExtrudeGeometry(sh, { depth: d, bevelEnabled: true, bevelThickness: b, bevelSize: b, bevelSegments: 2, curveSegments: 6 }); g.translate(0, 0, -d / 2); return g; }
      const leg = soft(rr(0.3, 4.86, 0.06), 0.12, 0.035), back = soft(rr(0.22, 0.3, 0.04), 0.02, 0.01), lamp = soft(rr(0.14, 0.2, 0.03), 0.035, 0.01);
      const dot = (function () { const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d'), g = x.createRadialGradient(32, 32, 0, 32, 32, 32); g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.35, 'rgba(255,255,255,0.4)'); g.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = g; x.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c); }());
      const glowM = new THREE.MeshBasicMaterial({ map: dot, color: 0xff9a3c, transparent: true, opacity: 0.4, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false });
      function onWall(deg, r, y, g, m) { const [x, z] = polar(deg, r), o = new THREE.Mesh(g, m); o.position.set(x, y, z); o.rotation.y = faceCentre(deg) * Math.PI / 180; root.add(o); return o; }
      [0, 20, 40, 60, 120, 140, 160, 180, 210, 230, 250, 270, 290, 310, 330].forEach(deg => {
        onWall(deg, 10.9, 2.45, leg, bronze);
        const a = onWall(deg, 10.86, 2.45, new THREE.BoxGeometry(0.012, 4.5, 0.01), amber);
        onWall(deg, 10.8, 4.45, back, bronze); onWall(deg, 10.76, 4.44, lamp, lampM); onWall(deg, 10.88, 4.45, new THREE.PlaneGeometry(1.0, 1.0), glowM);
      });
      (MOB ? [230, 310, 60, 120] : [230, 270, 310, 30, 60, 120, 150]).forEach(deg => {
        const [x, z] = polar(deg, 9.8); const l = new THREE.PointLight(0xffb866, 1.5 * Math.PI, 9, 2); l.position.set(x, 3.2, z); root.add(l);
      });
    }

    function wallTexture() {             // walnut panels, bronze rails — the corridor/Bridge wall, 5 m tall
      const W = 512, H = 1024, c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d'), Y = m => (1 - m / 5) * H;
      x.fillStyle = '#2b221c'; x.fillRect(0, 0, W, H);
      const inset = (y0, y1, col) => { x.fillStyle = col; x.fillRect(26, Y(y1), W - 52, Y(y0) - Y(y1)); x.fillStyle = 'rgba(255,210,150,0.07)'; x.fillRect(26, Y(y1), W - 52, 3); x.fillStyle = 'rgba(0,0,0,0.35)'; x.fillRect(26, Y(y0) - 3, W - 52, 3); };
      inset(1.06, 4.3, '#372b23'); inset(0.14, 0.86, '#2f251e');
      x.fillStyle = 'rgba(0,0,0,0.55)'; x.fillRect(0, 0, 3, H);
      const rail = (m, h) => { const g = x.createLinearGradient(0, Y(m + h), 0, Y(m)); g.addColorStop(0, '#d9a866'); g.addColorStop(0.5, '#9a6c36'); g.addColorStop(1, '#5a3d1e'); x.fillStyle = g; x.fillRect(0, Y(m + h), W, Y(m) - Y(m + h)); };
      rail(0.95, 0.05); rail(4.42, 0.04);
      for (let i = 0; i < 9000; i++) { x.fillStyle = Math.random() < 0.5 ? 'rgba(0,0,0,0.06)' : 'rgba(255,220,180,0.025)'; x.fillRect(Math.random() * W, Math.random() * H, 1 + Math.random() * 2, 1 + Math.random() * 8); }
      const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(53, 1); t.anisotropy = 4; return t;
    }
    function deckTexture() {             // polished dark deck plates
      const c = document.createElement('canvas'); c.width = c.height = 512; const x = c.getContext('2d');
      x.fillStyle = '#1e1a17'; x.fillRect(0, 0, 512, 512);
      for (let i = 0; i < 70; i++) { x.fillStyle = 'rgba(' + (Math.random() < 0.5 ? '0,0,0' : '255,230,200') + ',' + (0.015 + Math.random() * 0.025) + ')'; x.fillRect(Math.random() * 512, Math.random() * 512, 40 + Math.random() * 160, 20 + Math.random() * 90); }
      x.fillStyle = 'rgba(0,0,0,0.65)'; x.fillRect(0, 0, 512, 3); x.fillRect(0, 0, 3, 512);
      const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(10, 10); return t;
    }


    // BRASS GLOBE LAMPS on the deck, just outside the glass
    function buildLamps() {
      const root = el('a-entity', { id: 'lamps' }, scene);
      [22, 67, 112, 157, 202, 247, 292, 337].forEach(deg => {
        const [x, z] = polar(deg, 8.6);
        const g = el('a-entity', { position: `${x.toFixed(3)} 0 ${z.toFixed(3)}` }, root);
        const brass = 'color: #b8903f; roughness: 0.35; metalness: 0.9; emissive: #2a1a06; emissiveIntensity: 0.6';
        el('a-cylinder', { position: '0 0.05 0', radius: 0.26, height: 0.1, material: brass }, g);
        el('a-cylinder', { position: '0 0.3 0', radius: 0.07, 'radius-top': 0.07, height: 0.5, material: brass }, g);
        el('a-cylinder', { position: '0 0.58 0', radius: 0.2, height: 0.07, material: brass }, g);
        el('a-sphere', { position: '0 0.86 0', radius: 0.25, material: 'color: #ffe0b0; emissive: #ffa648; emissiveIntensity: 2.2; shader: standard' }, g);
        el('a-sphere', { position: '0 0.86 0', radius: 0.6, material: 'color: #ffa43c; emissive: #ff8a20; emissiveIntensity: 0.5; transparent: true; opacity: 0.10; shader: standard; depthWrite: false' }, g);
      });
      if (!MOB) [22, 157, 202, 337].forEach(deg => {
        const [x, z] = polar(deg, 8.6);
        el('a-light', { type: 'point', position: `${x.toFixed(2)} 1.0 ${z.toFixed(2)}`, color: '#ffb060', intensity: 0.7, distance: 6, decay: 2 }, scene);
      });
    }

    // CEILING + DOME — same architecture as the corridor and Bridge: bronze ribs, amber light ring, amber cove, dark panels.
    // The ship flies bow-first toward the corridor door (+Z here), so light speed streams aft (−Z) over the dome.
    function buildDome() {
      const R0 = 7.62, Y0 = 5, SQ = 0.38, root = new THREE.Group(); scene.object3D.add(root);
      const bz = (function () { const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d'); x.fillStyle = '#8c6234'; x.fillRect(0, 0, 256, 256);
        for (let i = 0; i < 1400; i++) { const a = Math.random() * 0.18; x.fillStyle = Math.random() < 0.5 ? 'rgba(255,215,150,' + a * 0.5 + ')' : 'rgba(40,20,6,' + a * 0.5 + ')'; x.fillRect(0, Math.random() * 256, 256, 1); }
        const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; return t; }());
      const bronze = new THREE.MeshStandardMaterial({ map: bz, color: 0xd8b58a, roughness: 0.42, metalness: 0.8, emissive: 0x1a0e04, emissiveIntensity: 0.6 });
      const amber = new THREE.MeshBasicMaterial({ color: 0xffb060, toneMapped: false });
      const addM = (col, op, map) => new THREE.MeshBasicMaterial({ map: map || null, color: col, transparent: true, opacity: op, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false, fog: false });
      const ramp = (function () { const c = document.createElement('canvas'); c.width = 256; c.height = 4; const x = c.getContext('2d'), g = x.createLinearGradient(0, 0, 256, 0); g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.5, 'rgba(255,255,255,1)'); g.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = g; x.fillRect(0, 0, 256, 4); return new THREE.CanvasTexture(c); }());

      // glass dome (squashed hemisphere), faintly blue
      const glass = new THREE.Mesh(new THREE.SphereGeometry(R0 - 0.02, 64, 20, 0, Math.PI * 2, 0, Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0x8fb8ff, transparent: true, opacity: 0.035, depthWrite: false, side: THREE.BackSide, fog: false }));
      glass.scale.y = SQ; glass.position.y = Y0; root.add(glass);
      // twelve bevelled bronze ribs following the dome, a ring at mid-height, a glowing crown
      const prof = []; for (let i = 0; i <= 24; i++) { const t = i / 24 * Math.PI / 2; prof.push([R0 * Math.cos(t), Y0 + R0 * SQ * Math.sin(t)]); }
      const rib = new THREE.Shape(); rib.moveTo(prof[0][0], prof[0][1]); prof.forEach(p => rib.lineTo(p[0], p[1]));
      for (let i = 24; i >= 0; i--) { const t = i / 24 * Math.PI / 2, nx = Math.cos(t) / 1, ny = Math.sin(t) / SQ, l = Math.hypot(nx, ny); rib.lineTo(prof[i][0] - nx / l * 0.14, prof[i][1] - ny / l * 0.14); }
      const ribG = new THREE.ExtrudeGeometry(rib, { depth: 0.12, bevelEnabled: true, bevelThickness: 0.025, bevelSize: 0.02, bevelSegments: 2, curveSegments: 1 }); ribG.translate(0, 0, -0.06);
      for (let k = 0; k < 12; k++) { const m = new THREE.Mesh(ribG, bronze); m.rotation.y = k * Math.PI / 6; root.add(m); }
      const latY = Y0 + R0 * SQ * Math.sin(Math.PI / 4), latR = R0 * Math.cos(Math.PI / 4);
      const lat = new THREE.Mesh(new THREE.TorusGeometry(latR - 0.05, 0.06, 8, 96), bronze); lat.rotation.x = Math.PI / 2; lat.position.y = latY - 0.03; root.add(lat);
      const crown = new THREE.Mesh(new THREE.TorusGeometry(0.62, 0.1, 10, 48), bronze); crown.rotation.x = Math.PI / 2; crown.position.y = Y0 + R0 * SQ - 0.06; root.add(crown);
      const cg = new THREE.Mesh(new THREE.TorusGeometry(0.5, 0.03, 8, 48), amber); cg.rotation.x = Math.PI / 2; cg.position.y = Y0 + R0 * SQ - 0.12; root.add(cg);

      // the big amber light ring at the dome base, between bronze rims (as on the Bridge)
      const ring = new THREE.Mesh(new THREE.TorusGeometry(R0 + 0.18, 0.12, 12, 160), amber); ring.rotation.x = Math.PI / 2; ring.position.y = Y0 - 0.12; root.add(ring);
      [R0 - 0.1, R0 + 0.5].forEach(r => { const t = new THREE.Mesh(new THREE.TorusGeometry(r, 0.08, 10, 160), bronze); t.rotation.x = Math.PI / 2; t.position.y = Y0 - 0.06; root.add(t); });
      const halo = new THREE.Mesh(new THREE.RingGeometry(R0 - 1.0, R0 + 1.4, 128), addM(0xff9a40, 0.5, ramp)); halo.rotation.x = Math.PI / 2; halo.position.y = Y0 - 0.02; root.add(halo);
      // outer ring of the ceiling: bronze rim at 9.4 m and the amber cove where it meets the wall
      const rim = new THREE.Mesh(new THREE.TorusGeometry(9.4, 0.07, 8, 160), bronze); rim.rotation.x = Math.PI / 2; rim.position.y = Y0 - 0.06; root.add(rim);
      const cove = new THREE.Mesh(new THREE.TorusGeometry(10.85, 0.04, 6, 192), amber); cove.rotation.x = Math.PI / 2; cove.position.y = Y0 - 0.16; root.add(cove);
      const crn = new THREE.Mesh(new THREE.TorusGeometry(10.9, 0.1, 8, 192), bronze); crn.rotation.x = Math.PI / 2; crn.position.y = Y0 - 0.06; root.add(crn);
      const wash = new THREE.Mesh(new THREE.CylinderGeometry(10.96, 10.96, 1.3, 128, 1, true), addM(0xff9a40, 0.3, (function () { const c = document.createElement('canvas'); c.width = 4; c.height = 128; const x = c.getContext('2d'), g = x.createLinearGradient(0, 0, 0, 128); g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = g; x.fillRect(0, 0, 4, 128); return new THREE.CanvasTexture(c); }())));
      wash.material.side = THREE.BackSide; wash.position.y = Y0 - 0.8; root.add(wash);

      // the brass crossbar over the glass (kept from the earlier build), now in the ship's bronze
      const bar = new THREE.Mesh(new THREE.BoxGeometry(15.2, 0.14, 0.55), bronze); bar.position.set(0, Y0 + 0.06, -0.25); root.add(bar);
      [-5.5, -2.0, 2.0, 5.5].forEach(x => { const b = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.08, 0.7), bronze); b.position.set(x, Y0 + 0.13, -0.25); root.add(b); });
      const barL = new THREE.Mesh(new THREE.BoxGeometry(15.0, 0.012, 0.012), amber); barL.position.set(0, Y0 - 0.015, 0.03); root.add(barL);

      // light speed beyond the dome
      const hs = window.WAYFARER.hyperspace(scene.object3D, { fwd: 1, arc: [-75, 75], count: MOB ? 900 : 1500, minR: 16, maxR: 190, tunnel: 0.6, width: 0.55, bright: 0.9, seed: 33,
        spill: [{ p: [0, 5.5, 0], i: 1.1 * Math.PI, d: 16, decay: 1.2 }] });   // the dome throws blue light on the deck and shelves
      AFRAME.registerComponent('wf-lib-hyper', { tick: function (t) { hs.update(t / 1000); } });
      scene.setAttribute('wf-lib-hyper', '');
    }

    // STARS — one draw call instead of 180 entities
    function buildStars() {
      const n = 600, pos = new Float32Array(n * 3), col = new Float32Array(n * 3);
      for (let i = 0; i < n; i++) {
        const th = Math.random() * Math.PI * 2, ph = Math.acos(Math.random() * 0.9 + 0.1);
        const r = 60;
        pos[i*3]   = r * Math.sin(ph) * Math.cos(th);
        pos[i*3+1] = r * Math.cos(ph) + 2;
        pos[i*3+2] = r * Math.sin(ph) * Math.sin(th);
        const b = 0.35 + Math.random() * 0.65, t = Math.random();
        col[i*3] = b * (t < 0.15 ? 0.75 : 1); col[i*3+1] = b * (t < 0.15 ? 0.82 : 0.97); col[i*3+2] = b * (t > 0.85 ? 0.8 : 1);
      }
      // Milky Way: a dense, dusty band along a tilted great circle
      const nb = MOB ? 500 : 1400, bp = new Float32Array(nb * 3), bc = new Float32Array(nb * 3), tilt = 0.9;
      for (let i = 0; i < nb; i++) {
        const a = Math.random() * Math.PI * 2, w = (Math.random() + Math.random() + Math.random() - 1.5) * 0.22;
        let x = Math.cos(w) * Math.cos(a), y = Math.sin(w), z = Math.cos(w) * Math.sin(a);
        const y2 = y * Math.cos(tilt) - z * Math.sin(tilt), z2 = y * Math.sin(tilt) + z * Math.cos(tilt);
        if (y2 < -0.05) { i--; continue; }
        bp[i*3] = 58 * x; bp[i*3+1] = 58 * y2 + 2; bp[i*3+2] = 58 * z2;
        const f = (0.25 + Math.random() * 0.5) * (1 - Math.abs(w) * 2.2), t = Math.random();
        bc[i*3] = f * (0.85 + 0.15 * t); bc[i*3+1] = f * (0.78 + 0.1 * t); bc[i*3+2] = f * (0.95 - 0.2 * t);
      }
      const bg = new THREE.BufferGeometry();
      bg.setAttribute('position', new THREE.BufferAttribute(bp, 3)); bg.setAttribute('color', new THREE.BufferAttribute(bc, 3));
      scene.object3D.add(new THREE.Points(bg, new THREE.PointsMaterial({ size: 3.2, sizeAttenuation: false, vertexColors: true, fog: false, transparent: true, opacity: 0.7, depthWrite: false })));
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      g.setAttribute('color', new THREE.BufferAttribute(col, 3));
      const pts = new THREE.Points(g, new THREE.PointsMaterial({ size: 2.2, sizeAttenuation: false, vertexColors: true, fog: false }));
      scene.object3D.add(pts);
    }

    // BOOK WINGS — the shared ship door, sealed until the wings are built (Book I left, Book II right)
    function buildWings() {
      const say = msg => { if (typeof showPrompt === 'function') { showPrompt(msg, '#ffcc66'); setTimeout(hidePrompt, 1800); } };
      const wings = [
        WAYFARER.door.create({ sc: scene, frame: { x: -10.42, z: -2, rot: 90 }, name: 'SONS OF NAPHTALI', tint: 0xffb040, depth: 0.45, noPockets: true, locked: 'BOOK I WING — SEALED (COMING SOON)', say: say }),
        WAYFARER.door.create({ sc: scene, frame: { x: 10.42, z: -2, rot: -90 }, name: 'HAPLOGROUPS', tint: 0x4f8cff, depth: 0.45, noPockets: true, locked: 'BOOK II WING — SEALED (COMING SOON)', say: say })
      ];
      const wp = new THREE.Vector3();
      AFRAME.registerComponent('wf-lib-wings', { tick: function (t, dt) { if (!scene.camera) return; scene.camera.getWorldPosition(wp); wings.forEach(D => D.update(dt, wp)); } });
      scene.setAttribute('wf-lib-wings', '');
    }

    scene.addEventListener('loaded', () => {
      const T = window.TEX, L = T.library({ lite: MOB });

      // quality profile: cap pixel ratio, drop the extra lights on phones, lighter brain
      scene.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, MOB ? 1.5 : 2));
      if (MOB) {
        document.querySelectorAll('.hq').forEach(e => e.remove());
        document.querySelector('a-light[type="ambient"]').setAttribute('intensity', 0.5);
      }
      document.getElementById('brain').setAttribute('brain-mesh', { detail: MOB ? 'low' : 'high' });

      // Curved wall: 18 tiles of 3.84 m x 5 m around a 69 m circumference
      const walls = document.getElementById('lib-walls');
      walls.getObject3D('mesh').material = new THREE.MeshStandardMaterial({ map: wallTexture(), roughness: 0.62, metalness: 0.15, side: THREE.BackSide });

      // Deck ring: ring UVs span the whole 22 m disc -> 8 repeats = 2.75 m tiles
      const deck = document.getElementById('deck-ring');
      deck.getObject3D('mesh').material = new THREE.MeshStandardMaterial({ map: deckTexture(), roughness: 0.3, metalness: 0.5, color: 0xa89e92 });
      [[8.2, 0.025], [10.3, 0.03]].forEach(q => { const t = new THREE.Mesh(new THREE.RingGeometry(q[0] - q[1], q[0] + q[1], 160), new THREE.MeshBasicMaterial({ color: 0xffa040, toneMapped: false })); t.rotation.x = -Math.PI / 2; t.position.y = 0.006; scene.object3D.add(t); });

      const ceil = document.getElementById('ceil-ring');
      ceil.setAttribute('material', { src: T.ceilPanel, repeat: '10 10', color: '#5a4434', roughness: 0.8, metalness: 0.15, side: 'double' });

      buildBookcases(L);
      buildSconces();
      buildWings();
      buildLamps();
      buildDome();

      requestAnimationFrame(() => requestAnimationFrame(() => document.getElementById('boot').classList.add('done')));
    });
  </script>

<script>window.WAYFARER.door.roomExit('library');</script>
</body>
</html>
