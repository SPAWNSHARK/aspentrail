<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SS Wayfarer — The Library</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000208">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <script src="textures.js"></script>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="brain.js"></script>
  <script src="mobile.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; }
    #hud {
      position: fixed; top: 0; left: 0; right: 0;
      padding: 14px 20px;
      display: flex; justify-content: space-between; align-items: center;
      color: #6688cc; font-family: 'Courier New', monospace;
      font-size: 11px; letter-spacing: 3px; text-transform: uppercase;
      pointer-events: none; text-shadow: 0 0 8px #0044ff;
      background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
      z-index: 10;
    }
    #room-prompt {
      position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
      color: #88aaff; font-family: 'Courier New', monospace;
      font-size: 13px; letter-spacing: 4px; text-transform: uppercase;
      pointer-events: none; text-shadow: 0 0 12px #0044ff;
      opacity: 0; transition: opacity 0.3s ease; white-space: nowrap; z-index: 10;
    }
    #controls-hint {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      color: #223355; font-family: 'Courier New', monospace;
      font-size: 10px; letter-spacing: 2px; pointer-events: none; z-index: 10;
    }

    /* Scroll reader panel */
    #scroll-panel {
      position: fixed; bottom: -100%; left: 50%; transform: translateX(-50%);
      width: min(600px, 92vw);
      background: rgba(2, 4, 12, 0.96);
      border: 1px solid #112244;
      padding: 28px 32px 24px;
      font-family: 'Courier New', monospace;
      color: #88aadd;
      z-index: 20;
      transition: bottom 0.4s ease;
      pointer-events: all;
    }
    #scroll-panel.open { bottom: 24px; }
    #scroll-title {
      font-size: 13px; letter-spacing: 4px; color: #aabbff;
      text-shadow: 0 0 10px #0044ff; margin-bottom: 16px;
      text-transform: uppercase;
    }
    #scroll-body {
      font-size: 12px; line-height: 1.9; color: #5577aa;
      letter-spacing: 1px; max-height: 180px; overflow-y: auto;
    }
    #scroll-close {
      display: block; margin-top: 18px; text-align: right;
      font-size: 10px; letter-spacing: 3px; color: #334466;
      cursor: pointer; text-transform: uppercase;
    }
    #scroll-close:hover { color: #88aaff; }
    /* ── boot overlay + mobile layout ── */
    #boot {
      position: fixed; inset: 0; background: #000208; color: #6688cc;
      font: 11px 'Courier New', monospace; letter-spacing: 4px; text-align: center;
      display: flex; align-items: center; justify-content: center; padding: 0 24px;
      z-index: 50; transition: opacity 0.6s ease;
    }
    #boot.done { opacity: 0; pointer-events: none; }
    html.touch #room-prompt { bottom: 170px; font-size: 12px; letter-spacing: 2px; }
    @media (max-width: 640px) {
      #hud { padding: 10px 14px; font-size: 9px; letter-spacing: 1.5px; }
      #hud span:nth-child(2) { display: none; }
      #scroll-panel { width: 94vw; padding: 20px 20px calc(18px + env(safe-area-inset-bottom, 0px)); }
      #scroll-title { font-size: 12px; letter-spacing: 2px; }
      #scroll-body { font-size: 14px; line-height: 1.7; max-height: 38vh; letter-spacing: 0.5px; }
      #scroll-close { font-size: 12px; padding: 16px 0 4px; }
    }
  </style>
</head>
<body>

  <div id="boot">SS WAYFARER<br><br>LOADING THE LIBRARY…</div>

  <div id="hud">
    <span>SS WAYFARER</span>
    <span>THE LIBRARY — DEEP CORE</span>
    <span>DECK 01</span>
  </div>
  <div id="room-prompt"></div>
  <div id="controls-hint">WASD / DRAG TO LOOK · GAZE OR CLICK SCROLLS TO READ</div>

  <div id="scroll-panel">
    <div id="scroll-title"></div>
    <div id="scroll-body"></div>
    <span id="scroll-close">[ CLOSE SCROLL ]</span>
  </div>

  <a-scene wayfarer-mobile="radius: 10.2"
    fog="type: exponential; color: #04060f; density: 0.011"
    vr-mode-ui="enabled: true"
    renderer="antialias: true; toneMapping: ACESFilmic; exposure: 1.1">

    <!-- ======================================================
         SPACE ENVIRONMENT (through glass ceiling)
    ====================================================== -->
    <a-sky id="sky" color="#00010a"></a-sky>

    <!-- ======================================================
         PLAYER — enters from corridor (+Z)
    ====================================================== -->
    <a-entity id="player" position="0 0 8">
      <a-camera
        wasd-controls="acceleration: 20; fly: false"
        look-controls="pointerLockEnabled: true; touchEnabled: true"
        position="0 1.6 0">
        <a-cursor
          color="#88aaff" opacity="0.5"
          fuse="true" fuse-timeout="1500"
          raycaster="objects: .interactive, .interactive *">
        </a-cursor>
      </a-camera>
    </a-entity>

    <!-- ======================================================
         ROOM SHELL
         Wall / floor / shelf textures are generated in textures.js and
         applied in the script at the bottom (data URLs can't live in
         A-Frame's semicolon-separated attribute strings).
    ====================================================== -->

    <!-- GLASS FLOOR (centre) — walk on it, see the brain below -->
    <a-circle id="glass-floor" position="0 0 0" rotation="-90 0 0" radius="7.6" segments="64"
      material="color: #1c3d38; opacity: 0.16; transparent: true; roughness: 0.05; metalness: 0.3">
    </a-circle>
    <!-- engraved rings in the glass -->
    <a-torus position="0 0.006" rotation="-90 0 0" radius="2.4" radius-tubular="0.012" segments-tubular="64" segments-radial="6"
      material="color: #0a2a22; emissive: #19e3a4; emissiveIntensity: 0.9; shader: standard"></a-torus>
    <a-torus position="0 0.006" rotation="-90 0 0" radius="4.6" radius-tubular="0.012" segments-tubular="96" segments-radial="6"
      material="color: #0a2a22; emissive: #19e3a4; emissiveIntensity: 0.7"></a-torus>
    <a-torus position="0 0.006" rotation="-90 0 0" radius="6.6" radius-tubular="0.012" segments-tubular="128" segments-radial="6"
      material="color: #0a2a22; emissive: #19e3a4; emissiveIntensity: 0.5"></a-torus>
    <!-- bezel around the glass -->
    <a-torus position="0 0.03 0" rotation="-90 0 0" radius="7.62" radius-tubular="0.05" segments-tubular="128" segments-radial="8"
      material="color: #3a3228; emissive: #1affb4; emissiveIntensity: 0.3; roughness: 0.4; metalness: 0.3"></a-torus>

    <!-- SOLID DECK RING (glass edge → wall) -->
    <a-ring id="deck-ring" position="0 0.002 0" rotation="-90 0 0" radius-inner="7.6" radius-outer="11" segments-theta="96"
      material="color: #ffffff; roughness: 0.5; metalness: 0.2">
    </a-ring>

    <!-- GLASS CEILING (centre) — look up, see space -->
    <a-circle position="0 5 0" rotation="90 0 0" radius="7.6" segments="64"
      material="color: #0b1530; opacity: 0.10; transparent: true; roughness: 0.05; metalness: 0.5">
    </a-circle>
    <!-- CEILING RING (structure around the skylight) -->
    <a-ring id="ceil-ring" position="0 5 0" rotation="90 0 0" radius-inner="7.6" radius-outer="11" segments-theta="96"
      material="color: #8a8aa0; roughness: 0.7; metalness: 0.2; side: double">
    </a-ring>
    <a-torus position="0 4.97 0" rotation="-90 0 0" radius="7.62" radius-tubular="0.045" segments-tubular="128" segments-radial="8"
      material="color: #2c2a33; emissive: #6fa8ff; emissiveIntensity: 0.85; roughness: 0.4"></a-torus>
    <a-torus position="0 4.9 0" rotation="-90 0 0" radius="9.4" radius-tubular="0.03" segments-tubular="128" segments-radial="6"
      material="color: #2c2a33; emissive: #6fa8ff; emissiveIntensity: 0.9"></a-torus>

    <!-- CURVED WALLS — plated texture applied in script -->
    <a-cylinder id="lib-walls" position="0 2.5 0" radius="11" height="5" open-ended="true" segments-radial="72"
      material="side: back; color: #6a6258; roughness: 0.7; metalness: 0.1">
    </a-cylinder>
    <!-- wall top / base trim -->
    <a-torus position="0 4.96 0" rotation="-90 0 0" radius="10.95" radius-tubular="0.07" segments-tubular="128" segments-radial="6"
      material="color: #1a1712; roughness: 0.6"></a-torus>
    <a-torus position="0 0.05 0" rotation="-90 0 0" radius="10.9" radius-tubular="0.08" segments-tubular="128" segments-radial="6"
      material="color: #1a1712; roughness: 0.6"></a-torus>

    <!-- ======================================================
         BRAIN IN ELECTROGEL (below glass floor)
    ====================================================== -->

    <!-- Electrogel tank walls -->
    <a-cylinder position="0 -8 0" radius="8" height="16" open-ended="true"
      material="side: double; color: #001a10; opacity: 0.12; transparent: true">
    </a-cylinder>
    <!-- Tank floor -->
    <a-circle position="0 -16 0" rotation="-90 0 0" radius="8"
      color="#000d08" roughness="1">
    </a-circle>

    <a-entity id="gel-tank" gel-tank></a-entity>

    <!-- THE BRAIN — real 3D folds, built in brain.js -->
    <a-entity id="brain" position="0 -7.3 0"
      animation="property: scale; from: 0.965 0.965 0.965; to: 1.04 1.04 1.04; dir: alternate; loop: true; dur: 1500; easing: easeInOutSine">
    </a-entity>

    <!-- ELECTROGEL GLOW LIGHTS (below the floor — they only light the brain) -->
    <a-light type="point" position="0 -3.0 1.5"  color="#7dffd0" intensity="0.8" distance="13" decay="2"></a-light>
    <a-light class="hq" type="point" position="-5 -8 3"     color="#00cc88" intensity="0.7" distance="10" decay="2"></a-light>
    <a-light type="point" position="3 -8.5 -7.5" color="#3fd0ff" intensity="1.0" distance="11" decay="2"></a-light>

    <!-- ======================================================
         ROOM LIGHTING
         (A-Frame 1.5 uses legacy light units: intensity is multiplied by PI
          internally and point lights fall off to zero at `distance`.)
    ====================================================== -->

    <!-- Cool fill + sky/ground bounce so nothing is ever pure black -->
    <a-light type="ambient" color="#b3a592" intensity="0.38"></a-light>
    <a-light type="hemisphere" color="#7d92e0" groundColor="#5a3a1c" intensity="0.5"></a-light>

    <!-- Starlight through the skylight -->
    <a-light type="directional" color="#9db4ff" intensity="0.35" position="2 10 3"></a-light>

    <!-- Electrogel glow rising through the glass floor, washing the lower walls -->
    <a-light type="point" position="0 -0.6 0" color="#22ffb0" intensity="0.95" distance="15" decay="1.6"></a-light>

    <!-- Warm downlights on the ceiling ring (floor + shelf tops) -->
    <a-light class="hq" type="point" position="0 4.6 8.5" color="#ffe0b8" intensity="1.0" distance="11" decay="2"></a-light>
    <a-light class="hq" type="point" position="-7.4 4.6 -4.25" color="#ffe0b8" intensity="1.0" distance="11" decay="2"></a-light>
    <a-light class="hq" type="point" position="7.4 4.6 -4.25" color="#ffe0b8" intensity="1.0" distance="11" decay="2"></a-light>

    <!-- Wall sconces + bookcases are generated in the script (see buildSconces / buildBookcases) -->

    <!-- BOOKCASES: generated by buildBookcases() in the script -->
    <a-entity id="bookcases"></a-entity>
    <a-entity id="sconces"></a-entity>

    <!-- ======================================================
         INTERACTIVE SCROLLS — pickup objects on pedestals
    ====================================================== -->

    <!-- SCROLL 1: Center room — Second Brain index -->
    <a-entity class="scroll-entity interactive"
      position="-2.5 0 1.5"
      data-title="SECOND BRAIN — INDEX"
      data-body="Your Obsidian vault lives here.\n\nMarkdown files will appear as physical scrolls once loaded.\nDrag your .md files into the repo and they will populate this room.\n\n[ PENDING: OBSIDIAN VAULT IMPORT ]">
      <a-sphere class="hit" radius="0.75" position="0 1.0 0" material="shader: flat; transparent: true; opacity: 0; depthWrite: false"></a-sphere>
      <a-cylinder position="0 0.1 0" radius="0.34" height="0.2" color="#3a2c1c" roughness="0.55" metalness="0.3"></a-cylinder>
      <a-cylinder position="0 0.55 0" radius="0.07" height="0.7" color="#5a4630" roughness="0.5" metalness="0.3"></a-cylinder>
      <a-cylinder position="0 0.92 0" radius="0.2" height="0.04" color="#6a5438" roughness="0.5" metalness="0.3"></a-cylinder>
      <a-torus position="0 0.21 0" rotation="-90 0 0" radius="0.3" radius-tubular="0.012" segments-tubular="32" segments-radial="6"
        material="color: #3a1d06; emissive: #ffa43c; emissiveIntensity: 1.4"></a-torus>
      <a-entity position="0 1.12 0"
        animation="property: position; to: 0 1.2 0; dir: alternate; loop: true; dur: 2600; easing: easeInOutSine"
        animation__spin="property: rotation; to: 0 360 0; loop: true; dur: 16000; easing: linear">
        <a-cylinder rotation="0 0 90" radius="0.1" height="0.46" color="#dcc08a" roughness="0.85"
          material="emissive: #7a4a14; emissiveIntensity: 0.55"></a-cylinder>
        <a-cylinder position="-0.25 0 0" rotation="0 0 90" radius="0.135" height="0.035" color="#b08840" roughness="0.4" metalness="0.5"
          material="emissive: #6a4410; emissiveIntensity: 0.5"></a-cylinder>
        <a-cylinder position="0.25 0 0" rotation="0 0 90" radius="0.135" height="0.035" color="#b08840" roughness="0.4" metalness="0.5"
          material="emissive: #6a4410; emissiveIntensity: 0.5"></a-cylinder>
        <a-sphere radius="0.46" material="color: #ffa43c; emissive: #ff8a20; emissiveIntensity: 0.4; transparent: true; opacity: 0.10; shader: standard"></a-sphere>
      </a-entity>
    </a-entity>

    <!-- SCROLL 2: Sons of Naphtali -->
    <a-entity class="scroll-entity interactive"
      position="2.5 0 1.5"
      data-title="THE SONS OF NAPHTALI — BOOK I"
      data-body="Genetics, haplogroups, and the genetic trail of the tribe of Naphtali.\n\nBook 1 scope: comprehensive. Chapter structure in progress.\n\n[ PENDING: MANUSCRIPT FILES ]">
      <a-sphere class="hit" radius="0.75" position="0 1.0 0" material="shader: flat; transparent: true; opacity: 0; depthWrite: false"></a-sphere>
      <a-cylinder position="0 0.1 0" radius="0.34" height="0.2" color="#3a2c1c" roughness="0.55" metalness="0.3"></a-cylinder>
      <a-cylinder position="0 0.55 0" radius="0.07" height="0.7" color="#5a4630" roughness="0.5" metalness="0.3"></a-cylinder>
      <a-cylinder position="0 0.92 0" radius="0.2" height="0.04" color="#6a5438" roughness="0.5" metalness="0.3"></a-cylinder>
      <a-torus position="0 0.21 0" rotation="-90 0 0" radius="0.3" radius-tubular="0.012" segments-tubular="32" segments-radial="6"
        material="color: #3a1d06; emissive: #ffa43c; emissiveIntensity: 1.4"></a-torus>
      <a-entity position="0 1.12 0"
        animation="property: position; to: 0 1.2 0; dir: alternate; loop: true; dur: 2600; easing: easeInOutSine"
        animation__spin="property: rotation; to: 0 360 0; loop: true; dur: 16000; easing: linear">
        <a-cylinder rotation="0 0 90" radius="0.1" height="0.46" color="#dcc08a" roughness="0.85"
          material="emissive: #7a4a14; emissiveIntensity: 0.55"></a-cylinder>
        <a-cylinder position="-0.25 0 0" rotation="0 0 90" radius="0.135" height="0.035" color="#b08840" roughness="0.4" metalness="0.5"
          material="emissive: #6a4410; emissiveIntensity: 0.5"></a-cylinder>
        <a-cylinder position="0.25 0 0" rotation="0 0 90" radius="0.135" height="0.035" color="#b08840" roughness="0.4" metalness="0.5"
          material="emissive: #6a4410; emissiveIntensity: 0.5"></a-cylinder>
        <a-sphere radius="0.46" material="color: #ffa43c; emissive: #ff8a20; emissiveIntensity: 0.4; transparent: true; opacity: 0.10; shader: standard"></a-sphere>
      </a-entity>
    </a-entity>

    <!-- SCROLL 3: Haplogroups -->
    <a-entity class="scroll-entity interactive"
      position="-2.5 0 -2"
      data-title="JEWISH GENETIC HAPLOGROUPS — BOOK II"
      data-body="Spun off from Book I when the scope became too large to contain.\n\nFocuses on haplogroup distribution, migration patterns, and genetic markers across Jewish diaspora populations.\n\n[ PENDING: RESEARCH FILES ]">
      <a-sphere class="hit" radius="0.75" position="0 1.0 0" material="shader: flat; transparent: true; opacity: 0; depthWrite: false"></a-sphere>
      <a-cylinder position="0 0.1 0" radius="0.34" height="0.2" color="#3a2c1c" roughness="0.55" metalness="0.3"></a-cylinder>
      <a-cylinder position="0 0.55 0" radius="0.07" height="0.7" color="#5a4630" roughness="0.5" metalness="0.3"></a-cylinder>
      <a-cylinder position="0 0.92 0" radius="0.2" height="0.04" color="#6a5438" roughness="0.5" metalness="0.3"></a-cylinder>
      <a-torus position="0 0.21 0" rotation="-90 0 0" radius="0.3" radius-tubular="0.012" segments-tubular="32" segments-radial="6"
        material="color: #3a1d06; emissive: #ffa43c; emissiveIntensity: 1.4"></a-torus>
      <a-entity position="0 1.12 0"
        animation="property: position; to: 0 1.2 0; dir: alternate; loop: true; dur: 2600; easing: easeInOutSine"
        animation__spin="property: rotation; to: 0 360 0; loop: true; dur: 16000; easing: linear">
        <a-cylinder rotation="0 0 90" radius="0.1" height="0.46" color="#dcc08a" roughness="0.85"
          material="emissive: #7a4a14; emissiveIntensity: 0.55"></a-cylinder>
        <a-cylinder position="-0.25 0 0" rotation="0 0 90" radius="0.135" height="0.035" color="#b08840" roughness="0.4" metalness="0.5"
          material="emissive: #6a4410; emissiveIntensity: 0.5"></a-cylinder>
        <a-cylinder position="0.25 0 0" rotation="0 0 90" radius="0.135" height="0.035" color="#b08840" roughness="0.4" metalness="0.5"
          material="emissive: #6a4410; emissiveIntensity: 0.5"></a-cylinder>
        <a-sphere radius="0.46" material="color: #ffa43c; emissive: #ff8a20; emissiveIntensity: 0.4; transparent: true; opacity: 0.10; shader: standard"></a-sphere>
      </a-entity>
    </a-entity>

    <!-- SCROLL 4: Daily notes -->
    <a-entity class="scroll-entity interactive"
      position="2.5 0 -2"
      data-title="DAILY NOTES — ACTIVE VAULT"
      data-body="Neurodivergent idea capture. All the little things.\n\nEvery idea that lands here gets a home. Nothing lost.\n\n[ PENDING: DAILY NOTE FILES ]">
      <a-sphere class="hit" radius="0.75" position="0 1.0 0" material="shader: flat; transparent: true; opacity: 0; depthWrite: false"></a-sphere>
      <a-cylinder position="0 0.1 0" radius="0.34" height="0.2" color="#3a2c1c" roughness="0.55" metalness="0.3"></a-cylinder>
      <a-cylinder position="0 0.55 0" radius="0.07" height="0.7" color="#5a4630" roughness="0.5" metalness="0.3"></a-cylinder>
      <a-cylinder position="0 0.92 0" radius="0.2" height="0.04" color="#6a5438" roughness="0.5" metalness="0.3"></a-cylinder>
      <a-torus position="0 0.21 0" rotation="-90 0 0" radius="0.3" radius-tubular="0.012" segments-tubular="32" segments-radial="6"
        material="color: #3a1d06; emissive: #ffa43c; emissiveIntensity: 1.4"></a-torus>
      <a-entity position="0 1.12 0"
        animation="property: position; to: 0 1.2 0; dir: alternate; loop: true; dur: 2600; easing: easeInOutSine"
        animation__spin="property: rotation; to: 0 360 0; loop: true; dur: 16000; easing: linear">
        <a-cylinder rotation="0 0 90" radius="0.1" height="0.46" color="#dcc08a" roughness="0.85"
          material="emissive: #7a4a14; emissiveIntensity: 0.55"></a-cylinder>
        <a-cylinder position="-0.25 0 0" rotation="0 0 90" radius="0.135" height="0.035" color="#b08840" roughness="0.4" metalness="0.5"
          material="emissive: #6a4410; emissiveIntensity: 0.5"></a-cylinder>
        <a-cylinder position="0.25 0 0" rotation="0 0 90" radius="0.135" height="0.035" color="#b08840" roughness="0.4" metalness="0.5"
          material="emissive: #6a4410; emissiveIntensity: 0.5"></a-cylinder>
        <a-sphere radius="0.46" material="color: #ffa43c; emissive: #ff8a20; emissiveIntensity: 0.4; transparent: true; opacity: 0.10; shader: standard"></a-sphere>
      </a-entity>
    </a-entity>

    <!-- ======================================================
         BOOK WINGS — stub doorways
    ====================================================== -->

    <!-- LEFT WING: Sons of Naphtali -->
    <a-box position="-10.42 1.5 -2" width="0.1" height="3.0" depth="2.5"
      color="#4a3a28" emissive="#553300" emissive-intensity="0.2" roughness="0.6" metalness="0.3">
    </a-box>
    <a-box position="-10.44 1.3 -2" width="0.06" height="2.6" depth="2.0"
      color="#2a1608" emissive="#aa6600" emissive-intensity="0.55">
    </a-box>
    <a-box position="-10.35 2.7 -2" width="0.1" height="0.06" depth="2.0"
      color="#cc8833" emissive="#cc8833" emissive-intensity="1.5">
    </a-box>
    <a-text value="SONS OF NAPHTALI" position="-10.1 2.92 -2"
      align="center" rotation="0 -90 0" color="#cc8833" width="3.5" letter-spacing="2">
    </a-text>
    <a-text value="BOOK I — GENETICS" position="-10.1 2.65 -2"
      align="center" rotation="0 -90 0" color="#664422" width="2.5">
    </a-text>

    <!-- RIGHT WING: Haplogroups -->
    <a-box position="10.42 1.5 -2" width="0.1" height="3.0" depth="2.5"
      color="#2e3a44" emissive="#003355" emissive-intensity="0.2" roughness="0.6" metalness="0.3">
    </a-box>
    <a-box position="10.44 1.3 -2" width="0.06" height="2.6" depth="2.0"
      color="#08202e" emissive="#0055aa" emissive-intensity="0.6">
    </a-box>
    <a-box position="10.35 2.7 -2" width="0.1" height="0.06" depth="2.0"
      color="#0066cc" emissive="#0066cc" emissive-intensity="1.5">
    </a-box>
    <a-text value="HAPLOGROUPS" position="10.1 2.92 -2"
      align="center" rotation="0 90 0" color="#5599cc" width="3.5" letter-spacing="2">
    </a-text>
    <a-text value="BOOK II — DIASPORA" position="10.1 2.65 -2"
      align="center" rotation="0 90 0" color="#224466" width="2.5">
    </a-text>

    <!-- ======================================================
         CORRIDOR EXIT (+Z, entrance side)
    ====================================================== -->
    <a-box position="0 1.5 9.9" width="2.2" height="3.0" depth="0.12"
      color="#0a0906" emissive="#002211" emissive-intensity="0.1">
    </a-box>
    <a-box id="exit-panel" class="interactive"
      position="0 1.3 9.92" width="1.8" height="2.5" depth="0.06"
      color="#060806" emissive="#001a0e" emissive-intensity="0.4">
    </a-box>
    <a-box position="0 2.65 9.86" width="1.8" height="0.06" depth="0.1"
      color="#00aa66" emissive="#00aa66" emissive-intensity="1.5">
    </a-box>
    <a-text value="← CORRIDOR" position="0 2.88 9.86"
      align="center" color="#00ffaa" width="3.2" letter-spacing="2">
    </a-text>

  </a-scene>

  <script>
    const promptEl = document.getElementById('room-prompt');
    const panel    = document.getElementById('scroll-panel');
    const panTitle = document.getElementById('scroll-title');
    const panBody  = document.getElementById('scroll-body');

    function showPrompt(text, color) {
      promptEl.textContent = text;
      promptEl.style.color = color || '#88aaff';
      promptEl.style.textShadow = `0 0 12px ${color || '#0044ff'}`;
      promptEl.style.opacity = '1';
    }
    function hidePrompt() { promptEl.style.opacity = '0'; }

    // Scrolls
    document.querySelectorAll('.scroll-entity').forEach(el => {
      el.addEventListener('mouseenter', () => showPrompt('[ READ SCROLL ]', '#ffcc66'));
      el.addEventListener('mouseleave', hidePrompt);
      el.addEventListener('click', () => {
        const title = el.getAttribute('data-title');
        const body  = el.getAttribute('data-body').replace(/\\n/g, '\n');
        panTitle.textContent = title;
        panBody.innerHTML = body.split('\n').map(l => l ? `<div>${l}</div>` : '<br>').join('');
        panel.classList.add('open'); document.body.classList.add('reading');
        hidePrompt();
      });
    });

    document.getElementById('scroll-close').addEventListener('click', () => {
      panel.classList.remove('open'); document.body.classList.remove('reading');
    });

    // Exit
    const exit = document.getElementById('exit-panel');
    exit.addEventListener('mouseenter', () => {
      showPrompt('[ RETURN TO CORRIDOR ]', '#00ffaa');
      exit.setAttribute('material', 'emissiveIntensity', 1.0);
    });
    exit.addEventListener('mouseleave', () => {
      hidePrompt();
      exit.setAttribute('material', 'emissiveIntensity', 0.4);
    });
    exit.addEventListener('click', () => { window.location.href = 'index.html'; });

    // ─────────────────────────────────────────────────────────────────────
    // WORLD BUILD — textures, bookcases, sconces, stars
    // ─────────────────────────────────────────────────────────────────────
    const scene = document.querySelector('a-scene');
    const THREE = AFRAME.THREE;
    const MOB = window.WAYFARER.mobile;   // phone / small tablet quality profile

    // Put an emissive map on an entity's existing material (A-Frame's material
    // component has no emissiveMap property, so we set it on the three.js material).
    function setEmissiveMap(el, url, intensity, repeat, color) {
      const apply = () => {
        const mesh = el.getObject3D('mesh');
        if (!mesh || !mesh.material) return false;
        new THREE.TextureLoader().load(url, tex => {
          tex.colorSpace = THREE.SRGBColorSpace;
          tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
          if (repeat) tex.repeat.set(repeat[0], repeat[1]);
          tex.anisotropy = 4;
          const m = mesh.material;
          m.emissiveMap = tex;
          m.emissive.set(color || '#ffffff');
          m.emissiveIntensity = intensity;
          m.needsUpdate = true;
        });
        return true;
      };
      if (!apply()) el.addEventListener('object3dset', apply, { once: true });
    }

    // Face an entity at the room centre. +Z (local) points inward.
    function faceCentre(deg) {
      const t = deg * Math.PI / 180;
      return Math.atan2(-Math.cos(t), -Math.sin(t)) * 180 / Math.PI;
    }
    function polar(deg, r) {
      const t = deg * Math.PI / 180;
      return [r * Math.cos(t), r * Math.sin(t)];
    }

    function el(tag, attrs, parent) {
      const e = document.createElement(tag);
      for (const k in attrs) e.setAttribute(k, attrs[k]);
      if (parent) parent.appendChild(e);
      return e;
    }

    // BOOKCASES — a row of lit bays around the back arc, between the two wings
    function buildBookcases(L) {
      const root = document.getElementById('bookcases');
      const centres = [220, 240, 260, 280, 300, 320];
      centres.forEach(deg => {
        const [x, z] = polar(deg, 10.55);
        const bay = el('a-entity', { position: `${x.toFixed(3)} 0 ${z.toFixed(3)}`, rotation: `0 ${faceCentre(deg).toFixed(2)} 0` }, root);

        // book face
        const face = el('a-plane', { position: '0 2 0.06', width: 3.2, height: 4 }, bay);
        face.setAttribute('material', Object.assign({ src: L.shelf.albedo, roughness: 0.9, metalness: 0, color: '#ffffff' }, L.shelf.normal ? { normalMap: L.shelf.normal } : {}));
        setEmissiveMap(face, L.shelf.albedo, 0.42);

        const wood = { src: L.wood, color: '#caa27a', roughness: 0.7, metalness: 0.05 };
        // boards (match compartment floors baked into the texture)
        [3.35, 2.6, 1.85, 1.1, 0.37].forEach(y => {
          const b = el('a-box', { position: `0 ${y} 0.22`, width: 3.2, height: 0.07, depth: 0.44 }, bay);
          b.setAttribute('material', wood);
        });
        // uprights, kick plate, cornice
        [-1.6, 1.6].forEach(x2 => el('a-box', { position: `${x2} 2 0.22`, width: 0.1, height: 4.0, depth: 0.46, color: '#3a2412', roughness: 0.7 }, bay));
        el('a-box', { position: '0 0.17 0.22', width: 3.2, height: 0.34, depth: 0.46, color: '#2e1c0e', roughness: 0.8 }, bay);
        el('a-box', { position: '0 4.07 0.22', width: 3.4, height: 0.14, depth: 0.56, color: '#3a2412', roughness: 0.6 }, bay);
        // warm light strip under the cornice
        el('a-box', { position: '0 3.97 0.4', width: 3.0, height: 0.03, depth: 0.05,
          material: 'color: #ffd9a0; emissive: #ffb455; emissiveIntensity: 2.2; shader: standard' }, bay);
      });
    }

    // SCONCES — amber wall lamps. Back arc sits between bookcases.
    function buildSconces() {
      const root = document.getElementById('sconces');
      (MOB ? [230, 310, 60, 120] : [230, 270, 310, 30, 60, 120, 150]).forEach(deg => {
        const [x, z] = polar(deg, 10.85);
        const s = el('a-entity', { position: `${x.toFixed(3)} 2.35 ${z.toFixed(3)}`, rotation: `0 ${faceCentre(deg).toFixed(2)} 0` }, root);
        el('a-box', { position: '0 0 0', width: 0.26, height: 0.8, depth: 0.08, color: '#2a2218', roughness: 0.5, metalness: 0.4 }, s);
        el('a-cylinder', { position: '0 0.05 0.12', radius: 0.07, height: 0.46,
          material: 'color: #ffd9a0; emissive: #ffb050; emissiveIntensity: 2.0; shader: standard' }, s);
        el('a-cone', { position: '0 -0.3 0.12', 'radius-bottom': 0.1, 'radius-top': 0.03, height: 0.16, color: '#3a2c1a', roughness: 0.5, metalness: 0.4 }, s);
        el('a-sphere', { position: '0 0.05 0.12', radius: 0.26,
          material: 'color: #ffa43c; emissive: #ff8a20; emissiveIntensity: 0.5; transparent: true; opacity: 0.12; shader: standard' }, s);
        el('a-light', { type: 'point', position: '0 0.1 0.7', color: '#ffb866', intensity: 1.5, distance: 9, decay: 2 }, s);
      });
    }

    // STARS — one draw call instead of 180 entities
    function buildStars() {
      const n = 600, pos = new Float32Array(n * 3), col = new Float32Array(n * 3);
      for (let i = 0; i < n; i++) {
        const th = Math.random() * Math.PI * 2, ph = Math.acos(Math.random() * 0.9 + 0.1);
        const r = 60;
        pos[i*3]   = r * Math.sin(ph) * Math.cos(th);
        pos[i*3+1] = r * Math.cos(ph) + 2;
        pos[i*3+2] = r * Math.sin(ph) * Math.sin(th);
        const b = 0.35 + Math.random() * 0.65, t = Math.random();
        col[i*3] = b * (t < 0.15 ? 0.75 : 1); col[i*3+1] = b * (t < 0.15 ? 0.82 : 0.97); col[i*3+2] = b * (t > 0.85 ? 0.8 : 1);
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      g.setAttribute('color', new THREE.BufferAttribute(col, 3));
      const pts = new THREE.Points(g, new THREE.PointsMaterial({ size: 2.2, sizeAttenuation: false, vertexColors: true, fog: false }));
      scene.object3D.add(pts);
    }

    // WING FRAMES — brass jambs + lintel around the two book-wing doors
    function buildWings() {
      [-1, 1].forEach(sd => {
        const x = sd * 10.3, acc = sd < 0 ? '#ffb455' : '#6fb4ff';
        const g = el('a-entity', { position: `${x} 0 -2`, rotation: `0 ${sd < 0 ? 0 : 0} 0` });
        scene.appendChild(g);
        [-1.34, 1.34].forEach(dz => el('a-box', { position: `0 1.6 ${dz}`, width: 0.4, height: 3.2, depth: 0.2, color: '#3a2f22', roughness: 0.5, metalness: 0.35 }, g));
        el('a-box', { position: '0 3.12 0', width: 0.4, height: 0.24, depth: 2.9, color: '#3a2f22', roughness: 0.5, metalness: 0.35 }, g);
        [-1.34, 1.34].forEach(dz => el('a-box', { position: `${-sd * 0.21} 1.6 ${dz}`, width: 0.03, height: 3.0, depth: 0.04,
          material: `color: ${acc}; emissive: ${acc}; emissiveIntensity: 1.6; shader: standard` }, g));
      });
    }

    scene.addEventListener('loaded', () => {
      const T = window.TEX, L = T.library({ lite: MOB });

      // quality profile: cap pixel ratio, drop the extra lights on phones, lighter brain
      scene.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, MOB ? 1.5 : 2));
      if (MOB) {
        document.querySelectorAll('.hq').forEach(e => e.remove());
        document.querySelector('a-light[type="ambient"]').setAttribute('intensity', 0.5);
      }
      document.getElementById('brain').setAttribute('brain-mesh', { detail: MOB ? 'low' : 'high' });
      document.querySelector('#sky').setAttribute('src', T.starfield);

      // Curved wall: 18 tiles of 3.84 m x 5 m around a 69 m circumference
      const walls = document.getElementById('lib-walls');
      walls.setAttribute('material', {
        side: 'back', src: L.wall.albedo, normalMap: L.wall.normal,
        repeat: '18 1', normalTextureRepeat: '18 1',
        color: '#ffffff', roughness: 0.62, metalness: 0.12
      });
      setEmissiveMap(walls, L.wall.glow, 1.0, [18, 1]);

      // Deck ring: ring UVs span the whole 22 m disc -> 8 repeats = 2.75 m tiles
      const deck = document.getElementById('deck-ring');
      deck.setAttribute('material', Object.assign({
        src: L.floor.albedo, repeat: '8 8',
        color: '#ffffff', roughness: 0.5, metalness: 0.2
      }, L.floor.normal ? { normalMap: L.floor.normal, normalTextureRepeat: '8 8' } : {}));
      setEmissiveMap(deck, L.floor.glow, 0.9, [8, 8]);

      const ceil = document.getElementById('ceil-ring');
      ceil.setAttribute('material', { src: T.ceilPanel, repeat: '10 10', color: '#a8a8c0', roughness: 0.7, metalness: 0.15, side: 'double' });

      buildBookcases(L);
      buildSconces();
      buildWings();
      buildStars();

      requestAnimationFrame(() => requestAnimationFrame(() => document.getElementById('boot').classList.add('done')));
    });
  </script>

</body>
</html>
